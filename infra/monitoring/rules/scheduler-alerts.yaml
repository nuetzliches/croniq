groups:
  - name: CroniqScheduler
    rules:
      - alert: CroniqDeadLettersHigh
        expr: sum(rate(cronipolicy_deadletter_total[5m])) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Dead letters are being generated
          description: "{{ $value }} dead-letter events per second over the last 5 minutes. Inspect Croniq.JobStore"

      - alert: CroniqMisfireBurst
        expr: sum(rate(cronitrigger_misfires_total[5m])) > 5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Croniq trigger misfires are elevated
          description: "Trigger misfires exceeded 5/min. Check scheduler load or clock skew."

      - alert: CroniqJobFailures
        expr: sum(rate(cronijob_executions_total{result="failure"}[5m])) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Croniq job executions are failing
          description: "At least one job execution failed in the last 5 minutes."

      - alert: CroniqQueueDepthHigh
        expr: avg(cronijob_queue_depth) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Croniq scheduler backlog is growing
          description: "Queue depth averaged {{ $value }} for 5m which means the worker throughput is falling behind. Scale the worker or throttle new schedules."

      - alert: CroniqLatencyP95High
        expr: histogram_quantile(0.95, sum(rate(cronijob_execution_duration_ms_bucket[5m])) by (le)) > 2000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Croniq job execution latency is elevated
          description: "Execution latency P95 stayed above 2s for 5 minutes. Investigate handler slowness or external dependencies."

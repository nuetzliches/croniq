services:
  croniq-sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: croniq-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${CRONIQ_SQL_PASSWORD:-CroniqSqlP@ssw0rd!}
      MSSQL_PID: Developer
    ports:
      - "${CRONIQ_SQL_HOST_PORT:-11433}:1433"
    volumes:
      - croniq-sql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P $${MSSQL_SA_PASSWORD} -Q 'SELECT 1'",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  croniq-db-migrator:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.services
      target: migrator
    environment:
      CRONIQ_SQL_CONNECTION: Server=croniq-sql,1433;Database=CroniqSmoke;User Id=sa;Password=${CRONIQ_SQL_PASSWORD:-CroniqSqlP@ssw0rd!};Encrypt=False;TrustServerCertificate=True;
    depends_on:
      croniq-sql:
        condition: service_healthy
    restart: "no"

  croniq-api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.services
      target: api
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:5080
      DOTNET_ENVIRONMENT: Development
      Croniq__Auth__Mode: InMemory
      Croniq__Auth__InMemory__ApiKey: ${CRONIQ_SMOKE_API_KEY:-smoke-key}
      Croniq__Auth__InMemory__TenantId: "1"
      Croniq__Auth__InMemory__EnvironmentTag: dev
      Croniq__Persistence__Mode: SqlServer
      Croniq__Api__RequestsPerMinute: "240"
      Croniq__Core__TenantId: "1"
      Croniq__Core__EnvironmentTag: dev
      Croniq__Core__InstanceId: api-smoke
      Croniq__SqlServer__ConnectionString: Server=croniq-sql,1433;Database=CroniqSmoke;User Id=sa;Password=${CRONIQ_SQL_PASSWORD:-CroniqSqlP@ssw0rd!};Encrypt=False;TrustServerCertificate=True;
    depends_on:
      croniq-db-migrator:
        condition: service_completed_successfully
    ports:
      - "5080:5080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:5080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  croniq-worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.services
      target: worker
    environment:
      DOTNET_ENVIRONMENT: Development
      Croniq__Core__TenantId: "1"
      Croniq__Core__EnvironmentTag: dev
      Croniq__Core__InstanceId: worker-smoke
      Croniq__Persistence__Mode: SqlServer
      Croniq__SqlServer__ConnectionString: Server=croniq-sql,1433;Database=CroniqSmoke;User Id=sa;Password=${CRONIQ_SQL_PASSWORD:-CroniqSqlP@ssw0rd!};Encrypt=False;TrustServerCertificate=True;
    depends_on:
      croniq-db-migrator:
        condition: service_completed_successfully

volumes:
  croniq-sql-data:

services:
  croniq-api:
    profiles: ["api"]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.services
      target: api
      args:
        DOTNET_VERSION: ${DOTNET_VERSION:-10.0}
        MINVER_SKIP: ${CRONIQ_MINVER_SKIP:-true}
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:${CRONIQ_API_INTERNAL_PORT:-5080}
      DOTNET_ENVIRONMENT: ${CRONIQ_DOTNET_ENVIRONMENT:-Development}
      Croniq__Auth__Mode: ${CRONIQ_AUTH_MODE:-InMemory}
      Croniq__Auth__InMemory__ApiKey: ${CRONIQ_API_KEY:-smoke-key}
      Croniq__Auth__InMemory__TenantId: ${CRONIQ_CORE_TENANT_ID:-default}
      Croniq__Auth__InMemory__EnvironmentTag: ${CRONIQ_ENVIRONMENT:-dev}
      Croniq__Persistence__Mode: SqlServer
      Croniq__Api__RequestsPerMinute: ${CRONIQ_API_REQUESTS_PER_MINUTE:-240}
      Croniq__Api__ForwardedHeaders__Enabled: ${CRONIQ_API_FORWARDED_HEADERS_ENABLED:-false}
      Croniq__Api__ForwardedHeaders__ForwardLimit: ${CRONIQ_API_FORWARDED_HEADERS_FORWARD_LIMIT:-1}
      Croniq__Api__ForwardedHeaders__KnownNetworks__0: ${CRONIQ_API_FORWARDED_HEADERS_KNOWN_NETWORKS_0:-}
      Croniq__Api__ForwardedHeaders__KnownProxies__0: ${CRONIQ_API_FORWARDED_HEADERS_KNOWN_PROXIES_0:-}
      Croniq__Core__TenantMode: ${CRONIQ_CORE_TENANT_MODE:-Single}
      Croniq__Core__TenantId: ${CRONIQ_CORE_TENANT_ID:-default}
      Croniq__Core__EnvironmentTag: ${CRONIQ_ENVIRONMENT:-dev}
      Croniq__Core__InstanceId: ${CRONIQ_API_INSTANCE_ID:-api-dev}
      Croniq__Webhooks__Remote__BaseUrl: ${CRONIQ_SAMPLE_DMZ_BASEURL:-https://host.docker.internal:5001}
      Croniq__Webhooks__Remote__ApiKey: ${CRONIQ_SAMPLE_DMZ_API_KEY:-dmz-sample-key}
      Croniq__Webhooks__Remote__EnableRelay: false
      Croniq__Logging__Execution__BasePath: /app/logs
      Croniq__Observability__OtlpEndpoint: ${CRONIQ_OBS_OTLP_ENDPOINT:-http://otel-collector:4317}
      Croniq__Observability__OtlpProtocol: ${CRONIQ_OBS_OTLP_PROTOCOL:-grpc}
      Croniq__SqlServer__ConnectionString: Server=${CRONIQ_SQL_HOST:-mssql-22},1433;Database=${CRONIQ_SQL_DATABASE:-CroniqDev};User Id=sa;Password=${CRONIQ_SQL_PASSWORD:-CroniqSqlP@ssw0rd!};Encrypt=False;TrustServerCertificate=True;
    depends_on:
      mssql-22:
        condition: service_healthy
      croniq-db-migrator:
        condition: service_completed_successfully
    ports:
      - "${CRONIQ_API_HTTP_PORT:-5080}:${CRONIQ_API_INTERNAL_PORT:-5080}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail http://localhost:${CRONIQ_API_INTERNAL_PORT:-5080}/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s
    volumes:
      - ${CRONIQ_LOGS_DIR:-../../logs}:/app/logs
    networks:
      - croniq-net

  croniq-worker:
    profiles: ["worker"]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.services
      target: worker
      args:
        DOTNET_VERSION: ${DOTNET_VERSION:-10.0}
        MINVER_SKIP: ${CRONIQ_MINVER_SKIP:-true}
    environment:
      DOTNET_ENVIRONMENT: ${CRONIQ_DOTNET_ENVIRONMENT:-Development}
      Croniq__Core__TenantMode: ${CRONIQ_CORE_TENANT_MODE:-Single}
      Croniq__Core__TenantId: ${CRONIQ_CORE_TENANT_ID:-default}
      Croniq__Core__EnvironmentTag: ${CRONIQ_ENVIRONMENT:-dev}
      Croniq__Core__InstanceId: ${CRONIQ_WORKER_INSTANCE_ID:-worker-dev}
      Croniq__Webhooks__Mode: Remote
      Croniq__Webhooks__Remote__BaseUrl: ${CRONIQ_SAMPLE_DMZ_BASEURL:-https://host.docker.internal:5001}
      Croniq__Webhooks__Remote__ApiKey: ${CRONIQ_SAMPLE_DMZ_API_KEY:-dmz-sample-key}
      Croniq__Webhooks__Remote__StreamMode: Grpc
      Croniq__Webhooks__Remote__StreamFallback: Sse
      Croniq__Webhooks__Remote__EnableRelay: true
      Croniq__Webhooks__Remote__AllowInvalidServerCertificate: true
      Croniq__Logging__Execution__BasePath: /app/logs
      Croniq__Persistence__Mode: SqlServer
      Croniq__Observability__OtlpEndpoint: ${CRONIQ_OBS_OTLP_ENDPOINT:-http://otel-collector:4317}
      Croniq__Observability__OtlpProtocol: ${CRONIQ_OBS_OTLP_PROTOCOL:-grpc}
      Croniq__SqlServer__ConnectionString: Server=${CRONIQ_SQL_HOST:-mssql-22},1433;Database=${CRONIQ_SQL_DATABASE:-CroniqDev};User Id=sa;Password=${CRONIQ_SQL_PASSWORD:-CroniqSqlP@ssw0rd!};Encrypt=False;TrustServerCertificate=True;
    depends_on:
      mssql-22:
        condition: service_healthy
      croniq-db-migrator:
        condition: service_completed_successfully
    volumes:
      - ${CRONIQ_LOGS_DIR:-../../logs}:/app/logs
    networks:
      - croniq-net

  # Override base migrator service with dev-only seeding.
  croniq-db-migrator:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.services
      target: migrator
      args:
        DOTNET_VERSION: ${DOTNET_VERSION:-10.0}
        MINVER_SKIP: ${CRONIQ_MINVER_SKIP:-true}
    environment:
      CRONIQ_SQL_CONNECTION: Server=${CRONIQ_SQL_HOST:-mssql-22},1433;Database=${CRONIQ_SQL_DATABASE:-CroniqDev};User Id=sa;Password=${CRONIQ_SQL_PASSWORD:-CroniqSqlP@ssw0rd!};Encrypt=False;TrustServerCertificate=True;
      CRONIQ_SEED_ADMIN: ${CRONIQ_SEED_ADMIN:-true}
      CRONIQ_SEED_TENANT_ID: ${CRONIQ_SEED_TENANT_ID:-}
      CRONIQ_SEED_TENANT_NAME: ${CRONIQ_SEED_TENANT_NAME:-}
      CRONIQ_SEED_TENANT_REFERENCE: ${CRONIQ_SEED_TENANT_REFERENCE:-}
      CRONIQ_CORE_TENANT_ID: ${CRONIQ_CORE_TENANT_ID:-default}
      CRONIQ_CORE_TENANT_NAME: ${CRONIQ_CORE_TENANT_NAME:-Default}
      CRONIQ_SEED_ADMIN_USERNAME: ${CRONIQ_SEED_ADMIN_USERNAME:-admin}
      CRONIQ_SEED_ADMIN_PASSWORD: ${CRONIQ_SEED_ADMIN_PASSWORD:-admin}
      CRONIQ_SEED_ADMIN_PASSWORD_CHANGE_REQUIRED: ${CRONIQ_SEED_ADMIN_PASSWORD_CHANGE_REQUIRED:-true}
      # Optional: override scopes for the seeded admin. Supports comma/whitespace separators or "all".
      CRONIQ_SEED_ADMIN_SCOPES: ${CRONIQ_SEED_ADMIN_SCOPES:-}

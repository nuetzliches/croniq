services:
  mssql-22:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: croniq-mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${CRONIQ_SQL_PASSWORD:-CroniqSqlP@ssw0rd!}
      MSSQL_PID: Developer
    ports:
      - "${CRONIQ_SQL_HOST_PORT:-11433}:1433"
    volumes:
      - croniq-mssql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -Q "SELECT 1"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - croniq-net

  croniq-db-migrator:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.services
      target: migrator
    environment:
      CRONIQ_SQL_CONNECTION: Server=${CRONIQ_SQL_HOST:-mssql-22},1433;Database=${CRONIQ_SQL_DATABASE:-CroniqDev};User Id=sa;Password=${CRONIQ_SQL_PASSWORD:-CroniqSqlP@ssw0rd!};Encrypt=False;TrustServerCertificate=True;
    depends_on:
      mssql-22:
        condition: service_healthy
    restart: "no"
    networks:
      - croniq-net

volumes:
  croniq-mssql-data:

networks:
  croniq-net:
    driver: bridge

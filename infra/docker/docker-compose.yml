services:
  mssql-22:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: croniq-mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${CRONIQ_SQL_PASSWORD:-CroniqSqlP@ssw0rd!}
      MSSQL_PID: Developer
    ports:
      - "${CRONIQ_SQL_HOST_PORT:-11433}:1433"
    volumes:
      - croniq-mssql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -Q "SELECT 1"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - croniq-net

volumes:
  croniq-mssql-data:

networks:
  croniq-net:
    driver: bridge

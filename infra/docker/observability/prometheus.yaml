global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
  - job_name: croniq-api
    static_configs:
      - targets: ["croniq-api:9464"]
  - job_name: croniq-worker
    static_configs:
      - targets: ["croniq-worker:9464"]

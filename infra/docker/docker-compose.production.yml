services:
  mssql-22:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: croniq-mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${CRONIQ_SQL_PASSWORD:-CroniqSqlP@ssw0rd!}
      MSSQL_PID: Developer
    ports:
      - "${CRONIQ_SQL_HOST_PORT:-11433}:1433"
    volumes:
      - croniq-mssql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - croniq-net

  croniq-db-migrator:
    image: croniq-db-migrator:local
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.production
      target: migrator
    environment:
      CRONIQ_SQL_CONNECTION: Server=${CRONIQ_SQL_HOST:-mssql-22},1433;Database=${CRONIQ_SQL_DATABASE:-CroniqDev};User Id=sa;Password=${CRONIQ_SQL_PASSWORD:-CroniqSqlP@ssw0rd!};Encrypt=False;TrustServerCertificate=True;
      CRONIQ_SEED_ADMIN: ${CRONIQ_SEED_ADMIN:-true}
      CRONIQ_SEED_ADMIN_USERNAME: ${CRONIQ_SEED_ADMIN_USERNAME:-admin}
      CRONIQ_SEED_ADMIN_PASSWORD: ${CRONIQ_SEED_ADMIN_PASSWORD:-admin}
      CRONIQ_SEED_ADMIN_PASSWORD_CHANGE_REQUIRED: ${CRONIQ_SEED_ADMIN_PASSWORD_CHANGE_REQUIRED:-true}
      CRONIQ_SEED_ADMIN_SCOPES: ${CRONIQ_SEED_ADMIN_SCOPES:-all}
      CRONIQ_CORE_TENANT_ID: ${CRONIQ_CORE_TENANT_ID:-default}
      CRONIQ_CORE_TENANT_NAME: ${CRONIQ_CORE_TENANT_NAME:-Default}
    command: ["--apply"]
    depends_on:
      mssql-22:
        condition: service_healthy
    restart: "no"
    networks:
      - croniq-net

  croniq-api:
    image: croniq-api:local
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.production
      target: api
    environment:
      DOTNET_ENVIRONMENT: ${CRONIQ_DOTNET_ENVIRONMENT:-Production}
      Croniq__Security__DataProtection__KeyRingPath: ${CRONIQ_SECURITY_DATAPROTECTION_KEYRINGPATH:-/var/lib/croniq/keys}
      Croniq__Security__DataProtection__ApplicationName: ${CRONIQ_SECURITY_DATAPROTECTION_APPLICATIONNAME:-Croniq}
      Croniq__Auth__Mode: ${CRONIQ_AUTH_MODE:-InMemory}
      Croniq__Auth__InMemory__ApiKey: ${CRONIQ_API_KEY:-smoke-key}
      Croniq__Auth__InMemory__TenantId: ${CRONIQ_CORE_TENANT_ID:-default}
      Croniq__Auth__InMemory__EnvironmentTag: ${CRONIQ_ENVIRONMENT:-dev}
      Croniq__Auth__Password__Enabled: ${CRONIQ_AUTH_PASSWORD_ENABLED:-false}
      Croniq__Persistence__Mode: SqlServer
      Croniq__Webhooks__Mode: SqlServer
      Croniq__Api__ExposeSchemas: ${CRONIQ_API_EXPOSE_SCHEMAS:-true}
      Croniq__Api__ForwardedHeaders__Enabled: ${CRONIQ_API_FORWARDED_HEADERS_ENABLED:-false}
      Croniq__Api__ForwardedHeaders__ForwardLimit: ${CRONIQ_API_FORWARDED_HEADERS_FORWARD_LIMIT:-1}
      Croniq__Api__ForwardedHeaders__KnownNetworks__0: ${CRONIQ_API_FORWARDED_HEADERS_KNOWN_NETWORKS_0:-}
      Croniq__Api__ForwardedHeaders__KnownProxies__0: ${CRONIQ_API_FORWARDED_HEADERS_KNOWN_PROXIES_0:-}
      Croniq__Core__TenantId: ${CRONIQ_CORE_TENANT_ID:-default}
      Croniq__Core__EnvironmentTag: ${CRONIQ_ENVIRONMENT:-dev}
      Croniq__Core__InstanceId: ${CRONIQ_API_INSTANCE_ID:-api-test}
      Croniq__SqlServer__ConnectionString: Server=${CRONIQ_SQL_HOST:-mssql-22},1433;Database=${CRONIQ_SQL_DATABASE:-CroniqDev};User Id=sa;Password=${CRONIQ_SQL_PASSWORD:-CroniqSqlP@ssw0rd!};Encrypt=False;TrustServerCertificate=True;
    depends_on:
      mssql-22:
        condition: service_healthy
      croniq-db-migrator:
        condition: service_completed_successfully
    ports:
      - "${CRONIQ_API_HTTP_PORT:-5080}:8080"
    volumes:
      - croniq-dp-keys:/var/lib/croniq/keys
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s
    networks:
      - croniq-net

  croniq-ui:
    image: croniq-ui:local
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.production
      target: ui
    environment:
      DOTNET_ENVIRONMENT: ${CRONIQ_DOTNET_ENVIRONMENT:-Production}
      CRONIQ_UI_API_BASEURL: ${CRONIQ_UI_API_BASEURL:-http://localhost:${CRONIQ_API_HTTP_PORT:-5080}}
      CRONIQ_UI_SWAGGER_UI_URL: ${CRONIQ_UI_SWAGGER_UI_URL:-http://localhost:${CRONIQ_API_HTTP_PORT:-5080}/swagger}
      CRONIQ_UI_DEFAULT_TENANT_ID: ${CRONIQ_UI_DEFAULT_TENANT_ID:-default}
    depends_on:
      croniq-api:
        condition: service_healthy
    ports:
      - "${CRONIQ_UI_HTTP_PORT:-5081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s
    networks:
      - croniq-net

  croniq-worker:
    image: croniq-worker:local
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.production
      target: worker
    environment:
      DOTNET_ENVIRONMENT: ${CRONIQ_DOTNET_ENVIRONMENT:-Production}
      Croniq__Persistence__Mode: SqlServer
      Croniq__Core__TenantId: ${CRONIQ_CORE_TENANT_ID:-default}
      Croniq__Core__EnvironmentTag: ${CRONIQ_ENVIRONMENT:-dev}
      Croniq__Core__InstanceId: ${CRONIQ_WORKER_INSTANCE_ID:-worker-test}
      Croniq__SqlServer__ConnectionString: Server=${CRONIQ_SQL_HOST:-mssql-22},1433;Database=${CRONIQ_SQL_DATABASE:-CroniqDev};User Id=sa;Password=${CRONIQ_SQL_PASSWORD:-CroniqSqlP@ssw0rd!};Encrypt=False;TrustServerCertificate=True;
      # Croniq__Jobs__Assemblies__0: /app/jobs/Acme.Jobs.dll
    depends_on:
      mssql-22:
        condition: service_healthy
      croniq-db-migrator:
        condition: service_completed_successfully
    networks:
      - croniq-net

  croniq-webhooks:
    image: croniq-webhooks:local
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.production
      target: webhooks
    environment:
      DOTNET_ENVIRONMENT: ${CRONIQ_DOTNET_ENVIRONMENT:-Production}
      Croniq__Security__DataProtection__KeyRingPath: ${CRONIQ_SECURITY_DATAPROTECTION_KEYRINGPATH:-/var/lib/croniq/keys}
      Croniq__Security__DataProtection__ApplicationName: ${CRONIQ_SECURITY_DATAPROTECTION_APPLICATIONNAME:-Croniq}
      Croniq__Auth__Mode: ${CRONIQ_AUTH_MODE:-InMemory}
      Croniq__Auth__InMemory__ApiKey: ${CRONIQ_API_KEY:-smoke-key}
      Croniq__Auth__InMemory__TenantId: ${CRONIQ_CORE_TENANT_ID:-default}
      Croniq__Auth__InMemory__EnvironmentTag: ${CRONIQ_ENVIRONMENT:-dev}
      Croniq__Auth__Password__Enabled: ${CRONIQ_AUTH_PASSWORD_ENABLED:-false}
      Croniq__Persistence__Mode: SqlServer
      Croniq__Webhooks__Mode: SqlServer
      Croniq__Webhooks__Ingress__DispatchMode: StoreOnly
      Croniq__Core__TenantId: ${CRONIQ_CORE_TENANT_ID:-default}
      Croniq__Core__EnvironmentTag: ${CRONIQ_ENVIRONMENT:-dev}
      Croniq__Core__InstanceId: ${CRONIQ_WEBHOOKS_INSTANCE_ID:-webhooks-test}
      Croniq__SqlServer__ConnectionString: Server=${CRONIQ_SQL_HOST:-mssql-22},1433;Database=${CRONIQ_SQL_DATABASE:-CroniqDev};User Id=sa;Password=${CRONIQ_SQL_PASSWORD:-CroniqSqlP@ssw0rd!};Encrypt=False;TrustServerCertificate=True;
    depends_on:
      mssql-22:
        condition: service_healthy
      croniq-db-migrator:
        condition: service_completed_successfully
    ports:
      - "${CRONIQ_WEBHOOKS_HTTP_PORT:-5082}:8080"
    volumes:
      - croniq-dp-keys:/var/lib/croniq/keys
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s
    networks:
      - croniq-net

volumes:
  croniq-mssql-data:
  croniq-dp-keys:

networks:
  croniq-net:
    driver: bridge

services:
  otel-collector:
    profiles: ["obs"]
    image: otel/opentelemetry-collector-contrib:0.102.1
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "${CRONIQ_OTLP_GRPC_PORT:-4317}:4317"
      - "${CRONIQ_OTLP_HTTP_PORT:-4318}:4318"
      - "${CRONIQ_OTEL_PROM_PORT:-8889}:8889"
    depends_on:
      tempo:
        condition: service_started
    networks:
      - croniq-net

  prometheus:
    profiles: ["obs"]
    image: prom/prometheus:v2.54.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/rules:/etc/prometheus/rules:ro
      - prom-data:/prometheus
    ports:
      - "${CRONIQ_PROMETHEUS_PORT:-9090}:9090"
    networks:
      - croniq-net

  grafana:
    profiles: ["obs"]
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${CRONIQ_GRAFANA_PASSWORD:-admin}
      GF_SECURITY_ADMIN_USER: ${CRONIQ_GRAFANA_USER:-admin}
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${CRONIQ_GRAFANA_PORT:-5601}:3000"
    depends_on:
      prometheus:
        condition: service_started
      tempo:
        condition: service_started
    networks:
      - croniq-net

  tempo:
    profiles: ["obs"]
    image: grafana/tempo:2.4.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/tmp/tempo
    ports:
      - "${CRONIQ_TEMPO_HTTP_PORT:-3200}:3200"
    networks:
      - croniq-net

volumes:
  prom-data:
  grafana-data:
  tempo-data:

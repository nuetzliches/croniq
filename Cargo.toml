[workspace]
resolver = "2"
members = [
    "crates/croniq-cli",
    "crates/croniq-config",
    "crates/croniq-config-wasm",
    "crates/croniq-scheduler",
    "crates/croniq-store",
    "crates/croniq-execution",
    "crates/croniq-runner",
    "crates/croniq-mcp",
    "crates/croniq-bridge",
    "crates/croniq-auth",
    "crates/croniq-runner-sdk",
    "crates/croniq-server",
    "crates/croniq-demo-runner",
    "crates/croniq-shell-runner",
]

[workspace.package]
# Not the release version, deliberately, and never bumped by hand: a release
# cut changes only the CHANGELOGs. This value is CARGO_PKG_VERSION, which
# `--version`, `GET /version`, the MCP handshake and alert payloads report.
# CI stamps it on the runner, never in a commit:
#   - release.yml rewrites it to the pushed tag, e.g. 0.49.0;
#   - ci.yml's Docker job (main) to the last release plus the commit, e.g.
#     0.49.0+main.a1c20f2.
# Every other build - a local `cargo build`, devstack, `cargo install --git` -
# reports 0.0.0-dev, which cannot be mistaken for a release. It said 0.4.0
# for 45 releases (review 2026-10-24, C-2). GET /version's `git_sha` names the
# commit. No square brackets in this comment: both rewrites match up to the
# first one after the section header.
version = "0.0.0-dev"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nuetzliches/croniq"
homepage = "https://github.com/nuetzliches/croniq"

[profile.bench]
debug = true
lto = "thin"

# Dedicated profile for the wasm bridge — applied via
# `wasm-pack build --release` (see crates/croniq-config-wasm).
# Tuned for size, not speed: the schedule preview runs once per
# keystroke and is dwarfed by the network round-trip that loaded the
# page in the first place. Native `profile.release` is left untouched.
[profile.release.package.croniq-config-wasm]
opt-level = "z"
codegen-units = 1
strip = true

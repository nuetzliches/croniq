[workspace]
resolver = "2"
members = [
    "crates/croniq-cli",
    "crates/croniq-config",
    "crates/croniq-scheduler",
    "crates/croniq-store",
    "crates/croniq-execution",
    "crates/croniq-runner",
    "crates/croniq-mcp",
    "crates/croniq-bridge",
    "crates/croniq-auth",
    "crates/croniq-runner-sdk",
    "crates/croniq-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nuetzliches/croniq"
homepage = "https://github.com/nuetzliches/croniq"

[profile.bench]
debug = true
lto = "thin"

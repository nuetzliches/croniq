[workspace]
resolver = "2"
members = [
    "crates/croniq-cli",
    "crates/croniq-config",
    "crates/croniq-config-wasm",
    "crates/croniq-scheduler",
    "crates/croniq-store",
    "crates/croniq-execution",
    "crates/croniq-runner",
    "crates/croniq-mcp",
    "crates/croniq-bridge",
    "crates/croniq-auth",
    "crates/croniq-runner-sdk",
    "crates/croniq-server",
    "crates/croniq-demo-runner",
    "crates/croniq-shell-runner",
]

[workspace.package]
# Catch up with the most recent release tag. The release workflow rewrites
# this in-place to match the pushed tag at build time so binaries always
# carry the matching version (CARGO_PKG_VERSION ends up in `--version`
# output and the MCP server's identification handshake).
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nuetzliches/croniq"
homepage = "https://github.com/nuetzliches/croniq"

[profile.bench]
debug = true
lto = "thin"

# Dedicated profile for the wasm bridge — applied via
# `wasm-pack build --release` (see crates/croniq-config-wasm).
# Tuned for size, not speed: the schedule preview runs once per
# keystroke and is dwarfed by the network round-trip that loaded the
# page in the first place. Native `profile.release` is left untouched.
[profile.release.package.croniq-config-wasm]
opt-level = "z"
codegen-units = 1
strip = true

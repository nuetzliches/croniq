syntax = "proto3";

package croniq.rpc;

service Runner {
  rpc Connect (stream RunnerMessage) returns (stream ServerMessage);
}

message RunnerMessage {
  oneof payload {
    RunnerHello hello = 1;
    WorkAckSuccess ack_success = 2;
    WorkAckFailure ack_failure = 3;
    WorkEvents events = 4;
  }
}

message ServerMessage {
  oneof payload {
    ServerHello hello = 1;
    WorkAssigned assigned = 2;
  }
}

message RunnerHello {
  string runner_id = 1;
  int32 max_inflight = 2;
  map<string, string> capabilities = 3;
  bool allow_test_executions = 4;
  string runner_instance_id = 5;
}

message ServerHello {
  string server_id = 1;
  string tenant_id = 2;
  string environment_tag = 3;
  int64 server_time_utc = 4;
}

message WorkAssigned {
  string execution_id = 1;
  string lease_id = 2;
  string trigger_id = 3;
  string job_key = 4;
  int64 fire_at_utc = 5;
  int64 lease_expires_at_utc = 6;
  string payload = 7;
  string execution_mode = 8;
  string invocation_source = 9;
}

message WorkAckSuccess {
  string execution_id = 1;
  string lease_id = 2;
}

message WorkAckFailure {
  string execution_id = 1;
  string lease_id = 2;
  string error_type = 3;
  string error_message = 4;
  string dead_letter_reason = 5;
  int64 next_fire_time_utc = 6;
}

message WorkEvents {
  string execution_id = 1;
  string lease_id = 2;
  repeated WorkEvent events = 3;
}

message WorkEvent {
  string message = 1;
  string level = 2;
  int64 timestamp_utc = 3;
  map<string, string> properties = 4;
  string event_type = 5;
}

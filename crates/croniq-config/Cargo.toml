[package]
name = "croniq-config"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Croniqfile DSL parser, validator, compiler, and formatter"

[dependencies]
miette = { version = "7", features = ["fancy"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
glob = "0.3"

[dev-dependencies]
insta = { version = "1", features = ["yaml"] }
pretty_assertions = "1"

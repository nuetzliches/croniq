[package]
name = "croniq-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bridges the DSL (croniq-config) with the runtime (croniq-execution, croniq-runner)"

[dependencies]
croniq-config   = { path = "../croniq-config" }
croniq-execution = { path = "../croniq-execution" }
croniq-runner   = { path = "../croniq-runner" }
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
pretty_assertions = "1"

[package]
name = "croniq-store"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Persistence layer: Store traits + SQLite and in-memory implementations"

[features]
default = ["sqlite"]
sqlite = ["rusqlite"]
# The Postgres backend always brings TLS with it (issue #431): a remote
# database reached over cleartext exposes the connection password and every
# credential hash the auth tables hand back. rustls, not OpenSSL — no C
# toolchain enters the tree, and the crate is MIT/Apache-2.0 like the rest.
postgres = ["dep:postgres", "dep:tokio-postgres-rustls", "dep:rustls", "dep:rustls-pki-types", "dep:rustls-native-certs", "dep:webpki-roots"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.34", features = ["bundled"], optional = true }
postgres = { version = "0.19", features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1"], optional = true }
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring", "native-certs", "webpki-roots"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-pki-types = { version = "1", optional = true }
rustls-native-certs = { version = "0.8", optional = true }
webpki-roots = { version = "1", optional = true }

[dev-dependencies]
pretty_assertions = "1"
criterion = { version = "0.5", features = ["html_reports"] }
uuid = { version = "1", features = ["v4"] }
# Drives the PgStoreHandle regression test (tests/pg_actor.rs), which must run
# inside a Tokio runtime to reproduce the "runtime within a runtime" scenario.
# Same major as the rest of the workspace so it resolves to one copy.
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# Used by the Postgres integration test (tests/pg_integration.rs) to build
# model instances; chrono is already a normal dep but integration-test crates
# only see dev-dependencies directly.
chrono = { version = "0.4", features = ["serde"] }

[[bench]]
name = "sqlite_bench"
harness = false

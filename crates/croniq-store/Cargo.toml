[package]
name = "croniq-store"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Persistence layer: Store traits + SQLite and in-memory implementations"

[features]
default = ["sqlite"]
sqlite = ["rusqlite"]
postgres = ["dep:postgres"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.34", features = ["bundled"], optional = true }
postgres = { version = "0.19", features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1"], optional = true }

[dev-dependencies]
pretty_assertions = "1"

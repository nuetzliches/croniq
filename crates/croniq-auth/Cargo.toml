[package]
name = "croniq-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Authentication and authorization: JWT tokens, API keys, password auth"

[dependencies]
croniq-store = { path = "../croniq-store" }

chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
sha2 = "0.11"
hex = "0.4"
bcrypt = "0.17"
uuid = { version = "1", features = ["v4"] }
rand = "0.10"
thiserror = "2"

# PR-A3: TOTP/2FA + recovery codes + AES-GCM-wrapped TOTP secrets.
totp-rs = { version = "6", default-features = false, features = ["std", "gen_secret"] }
aes-gcm = "0.11"
hkdf = "0.13"
base32 = "0.5"
base64 = "0.23"
urlencoding = "2"

[dev-dependencies]
pretty_assertions = "1"

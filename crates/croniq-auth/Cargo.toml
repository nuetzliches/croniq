[package]
name = "croniq-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Authentication and authorization: JWT tokens, API keys, password auth"

[dependencies]
croniq-store = { path = "../croniq-store" }

chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "9"
sha2 = "0.10"
hex = "0.4"
bcrypt = "0.17"
uuid = { version = "1", features = ["v4"] }
rand = "0.9"
thiserror = "2"

[dev-dependencies]
pretty_assertions = "1"

[package]
name = "croniq-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MCP Server: expose Croniq's scheduler to AI assistants via the Model Context Protocol"

[[bin]]
name = "croniq-mcp"
path = "src/main.rs"

[dependencies]
croniq-runner = { path = "../croniq-runner" }
croniq-store = { path = "../croniq-store" }
croniq-config = { path = "../croniq-config" }
croniq-scheduler = { path = "../croniq-scheduler" }
croniq-execution = { path = "../croniq-execution" }
rmcp = { version = "~1.5", features = [
    "server",
    "macros",
    "transport-io",
    "transport-streamable-http-server",
] }
croniq-auth = { path = "../croniq-auth" }
http = "1"
tower-service = "0.3"
schemars = { version = "1.0", features = ["chrono04"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
pretty_assertions = "1"
tokio = { version = "1", features = ["full", "test-util"] }

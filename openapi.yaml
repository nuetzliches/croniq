openapi: 3.1.0
info:
  title: Croniq API
  description: Distributed job scheduling platform
  version: 0.32.0
  license:
    name: MIT OR Apache-2.0

servers:
  - url: http://localhost:4000
    description: Local development

security:
  - BearerAuth: []
  - ApiKeyAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: "ApiKey <raw_key>"

  schemas:
    HealthResponse:
      type: object
      properties:
        status: { type: string }
        runners_online: { type: integer }
        runners_stale: { type: integer }
        runners_dead: { type: integer }
        queued: { type: integer }

    VersionResponse:
      type: object
      required: [version, git_sha, build_time, env]
      properties:
        version:
          type: string
          description: "Cargo package version, baked in at compile time (e.g. \"0.23.0\")."
          example: "0.23.0"
        git_sha:
          type: string
          description: "Short git SHA of the build commit, or \"unknown\" outside a git checkout."
          example: "f3aea44"
        build_time:
          type: string
          format: date-time
          description: "RFC 3339 UTC timestamp at which this binary was built."
          example: "2026-05-23T12:35:00Z"
        env:
          type: string
          description: "Deploy-environment label from CRONIQ_ENV. Defaults to \"unknown\" when unset."
          example: "production"

    TokenResponse:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string }
        expires_in: { type: integer }

    JobDefinition:
      type: object
      properties:
        job_key: { type: string }
        description: { type: string, nullable: true }
        assigned_runner_id: { type: string, nullable: true }
        is_active: { type: boolean }
        metadata: { type: object, additionalProperties: { type: string } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        timeout: { type: string, nullable: true, description: "Execution timeout (\"5m\", \"30s\"). Null = system default (5m)." }
        max_retries: { type: integer, nullable: true, description: "Retry budget before dead-lettering. Null = system default (3)." }
        dead_letter_enabled: { type: boolean, nullable: true, description: "Keep permanently-failed executions in the dead-letter queue. Null = system default (true)." }
        dead_letter_retention: { type: string, nullable: true, description: "Dead-letter retention duration (\"14d\", \"0\" = keep forever). Null = system default (30d)." }
        dead_letter_operator_hint: { type: string, nullable: true, description: "Free-form triage hint surfaced with this job's dead letters." }
        dead_letter_replay_max_age: { type: string, nullable: true, description: "Opt-in stale-replay guard (\"7d\"): replaying a dead letter whose original scheduled_for is older is rejected with 409 unless forced. Null = replays always allowed." }
        tags: { type: array, items: { type: string }, description: "Free-form filter tags (convention key=value). Not routing-relevant." }

    TriggerDefinition:
      type: object
      properties:
        trigger_id: { type: string }
        job_key: { type: string }
        cron_expression: { type: string, nullable: true }
        timezone: { type: string, nullable: true }
        calendar: { type: string, nullable: true }
        window: { type: string, nullable: true }
        enabled: { type: boolean }
        managed_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    RunnerSummary:
      type: object
      properties:
        runner_id: { type: string }
        status: { type: string, enum: [Online, Stale, Dead] }
        capabilities: { type: array, items: { type: string } }
        max_inflight: { type: integer }
        inflight: { type: integer }
        last_poll_at: { type: string, format: date-time }

    Execution:
      type: object
      properties:
        id: { type: string, format: uuid }
        job_key: { type: string }
        fire_at: { type: string, format: date-time }
        scheduled_for: { type: string, format: date-time, description: "Original logical fire time of the trigger; constant across the retry chain and dead-letter replay (fire_at is reset on retry/replay). For manual triggers this is the trigger moment." }
        attempt: { type: integer }
        state: { type: string, enum: [queued, claimed, completed, failed, dead, cancelled] }
        runner_id: { type: string, nullable: true }
        claimed_at: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }
        duration_ms: { type: integer, nullable: true }
        error: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    DeadLetter:
      type: object
      properties:
        id: { type: string, format: uuid }
        execution_id: { type: string, format: uuid }
        job_key: { type: string }
        fire_at: { type: string, format: date-time }
        scheduled_for: { type: string, format: date-time, description: "Original logical fire time, carried unchanged through the retry chain. Anchors the stale-replay guard." }
        attempt: { type: integer }
        error: { type: string }
        dead_reason: { type: string }
        metadata: { type: object }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, nullable: true }

    WorkAssignment:
      type: object
      description: A single unit of work delivered to a runner in a poll response.
      properties:
        execution_id: { type: string, format: uuid }
        job_key: { type: string }
        fire_at: { type: string, format: date-time, description: "When this execution row became due (reset to now on retry/replay)." }
        scheduled_for: { type: string, format: date-time, nullable: true, description: "Original logical fire time of the trigger, constant across retries and replay. Null when the server predates this field — runners must not fall back to fire_at." }
        attempt: { type: integer, description: "1 = first attempt, 2 = first retry, …" }
        metadata: { type: object }
        timeout: { type: string }

    CalendarDefinition:
      type: object
      properties:
        calendar_id:
          type: string
          description: Real UUID for API-managed calendars; synthetic `dsl:{name}` for Croniqfile-defined ones.
        name: { type: string }
        timezone:
          type: string
          nullable: true
          description: >-
            IANA zone the calendar's rules are evaluated in — its weekday/date
            rules pick out days on this clock and its `window` rules open on it,
            for every job that references the calendar. `null` means UTC; it
            does **not** mean "the consulting job's zone". On a `dsl` row this
            is the effective zone, with `defaults { timezone … }` already
            folded in. Rejected with 400 `unknown_timezone` on write when it is
            not an IANA name.
        rules: { type: string }
        managed_by:
          type: string
          enum: [api, dsl]
          description: '`dsl` rows are synthesized at read time from the Croniqfile and refuse mutations (409). Use `/adopt` to take ownership.'
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DslAdoptResponse:
      type: object
      properties:
        calendar: { $ref: "#/components/schemas/CalendarDefinition" }
        dsl_key:
          type: string
          description: The DSL identifier (calendar name or job key) that was adopted. Used by `/unadopt` to find the row and the loader to skip it on reload.

    DslJobAdoptResponse:
      type: object
      properties:
        job: { $ref: "#/components/schemas/JobDefinition" }
        trigger: { $ref: "#/components/schemas/TriggerDefinition" }
        dsl_key: { type: string }

    DslManagedError:
      type: object
      properties:
        error: { type: string, enum: [dsl_managed, adoption_disabled, not_adopted] }
        message: { type: string }

    ApiClient:
      type: object
      properties:
        client_id: { type: string }
        name: { type: string }
        scopes: { type: array, items: { type: string } }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }

    # ─── PR-A1+ Auth + Multi-User ─────────────────────────────────────────

    Role:
      type: string
      enum: [admin, operator, viewer]
      description: >
        Maps to a default scope set via croniq_auth::default_scopes_for_role.

    User:
      type: object
      properties:
        user_id: { type: string }
        username: { type: string }
        email: { type: string, nullable: true }
        display_name: { type: string, nullable: true }
        role: { $ref: "#/components/schemas/Role" }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        last_login_at: { type: string, format: date-time, nullable: true }
        totp_enabled:
          type: boolean
          description: >
            Whether the user has a confirmed TOTP secret. Only present on
            `GET /v1/users/me`; omitted from admin list/get responses.

    MfaRequiredResponse:
      type: object
      description: >
        Returned by `POST /v1/auth/login` instead of TokenResponse when
        the user has TOTP enabled. Distinct shape via `requires_totp:
        true`. The `mfa_token` is a 5-minute JWT (purpose="mfa") only
        valid against `/v1/auth/login/totp`.
      properties:
        requires_totp: { type: boolean, enum: [true] }
        mfa_token: { type: string }
        mfa_token_expires_in: { type: integer }

    EnrollmentRequiredResponse:
      type: object
      description: >
        Returned by `POST /v1/auth/login` instead of TokenResponse when
        enforced 2FA is on but the account has no confirmed TOTP secret.
        Distinct shape via `enrollment_required: true`. The `enroll_token`
        is a short-lived JWT (purpose="totp_enroll") only valid against
        `/v1/auth/login/enroll/totp/begin` and `.../confirm`.
      properties:
        enrollment_required: { type: boolean, enum: [true] }
        enroll_token: { type: string }
        enroll_token_expires_in: { type: integer }

    Invitation:
      type: object
      properties:
        invitation_id: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        invited_by: { type: string }
        expires_at: { type: string, format: date-time }
        accepted_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    CreateInvitationResponse:
      type: object
      properties:
        invitation_id: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        expires_at: { type: string, format: date-time }
        token:
          type: string
          description: Raw `croniq_inv_…` token — shown ONCE.
        accept_url: { type: string }

    PersonalAccessToken:
      type: object
      description: PAT metadata (without the raw token).
      properties:
        token_id: { type: string }
        name: { type: string }
        token_prefix: { type: string }
        scopes: { type: array, items: { type: string } }
        expires_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }
        last_used_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    CreatePatResponse:
      type: object
      properties:
        token_id: { type: string }
        name: { type: string }
        token:
          type: string
          description: Raw `croniq_pat_…` token — shown ONCE.
        token_prefix: { type: string }
        scopes: { type: array, items: { type: string } }
        expires_at: { type: string, format: date-time, nullable: true }

    TotpSetupResponse:
      type: object
      properties:
        secret:
          type: string
          description: Base32-encoded TOTP seed.
        otpauth_url: { type: string }
        recovery_codes:
          type: array
          items: { type: string }

    OidcConfigResponse:
      type: object
      properties:
        enabled: { type: boolean }
        provider_name: { type: string, nullable: true }
        login_url: { type: string, nullable: true }

    AuthConfigResponse:
      type: object
      description: >
        Combined sign-in-method probe (issue #138) — the single payload the
        login UI fetches before any auth happens, so it can render the SSO
        button, password form, and up-front TOTP field in one round-trip.
      required: [oidc, password, totp]
      properties:
        oidc: { $ref: "#/components/schemas/OidcConfigResponse" }
        password:
          type: object
          required: [enabled]
          properties:
            enabled: { type: boolean, description: Password login is available. }
        totp:
          type: object
          required: [required]
          properties:
            required:
              type: boolean
              description: >
                Server enforces 2FA for every password login; the UI shows the
                code field up-front so login finishes in a single request.

    # ─── PR-B1 Audit + Stats ──────────────────────────────────────────────

    AuditEvent:
      type: object
      properties:
        event_id: { type: string }
        actor_type:
          type: string
          enum: [user, api_key, pat, oidc, system]
        actor_id: { type: string, nullable: true }
        action: { type: string }
        target_type: { type: string }
        target_id: { type: string, nullable: true }
        diff_json: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    JobStatsResponse:
      type: object
      properties:
        job_key: { type: string }
        window_days: { type: integer }
        total: { type: integer }
        completed: { type: integer }
        failed: { type: integer }
        dead: { type: integer }
        success_rate: { type: number, format: double }
        p50_ms: { type: integer, nullable: true }
        p95_ms: { type: integer, nullable: true }
        p99_ms: { type: integer, nullable: true }
        last_failure_at: { type: string, format: date-time, nullable: true }

    ThroughputBucket:
      type: object
      properties:
        start: { type: string, format: date-time }
        ok: { type: integer }
        err: { type: integer }

    ThroughputResponse:
      type: object
      properties:
        window: { type: string }
        bucket:
          type: string
          enum: [hour, day]
        buckets:
          type: array
          items: { $ref: "#/components/schemas/ThroughputBucket" }

    FailureHeatmap:
      type: object
      properties:
        days: { type: integer }
        rows:
          type: array
          description: rows[day][hour] = failure count
          items:
            type: array
            items: { type: integer }
        hotspots:
          type: array
          items:
            type: object
            properties:
              hour: { type: integer }
              failures: { type: integer }

    AlertRuleOverride:
      type: object
      description: |
        An operational override layered on top of a DSL-defined alert rule
        (issue #231). Exactly one intent is expressed per row — snooze,
        disable, or throttle — they are not composable. A row whose
        `expires_at` is in the past is inert (treated as if absent) until the
        watchdog sweep removes it.
      required: [rule_name, note, set_by_user_id, set_at]
      properties:
        rule_name: { type: string, description: Name of the DSL rule this overrides }
        enabled:
          type: boolean
          nullable: true
          description: "`false` disables the rule; `null` means the override does not touch enablement"
        snooze_until:
          type: string
          format: date-time
          nullable: true
          description: Rule is suppressed until this instant; doubles as the auto-clear deadline
        throttle_secs:
          type: integer
          nullable: true
          description: Replaces the DSL throttle window (seconds) while active
        note: { type: string, description: Mandatory incident context captured at write time }
        set_by_user_id: { type: string }
        set_at: { type: string, format: date-time }
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: When the override auto-clears; `null` for open-ended (disable/throttle only)

    AlertsConfigView:
      type: object
      description: |
        Effective alerts config (DSL-managed `channels` + `rules`) plus any
        operational overrides surfaced inline. The original config shape is
        preserved at the top level; `overrides` is additive.
      properties:
        channels:
          type: array
          items: { type: object }
        rules:
          type: array
          items: { type: object }
        overrides:
          type: array
          items: { $ref: "#/components/schemas/AlertRuleOverride" }

    AlertDelivery:
      type: object
      description: One per-fire alert delivery-log row (issue #140).
      required: [delivery_id, rule_name, channel_name, job_key, state, fired_at]
      properties:
        delivery_id: { type: string }
        rule_name: { type: string }
        channel_name: { type: string }
        job_key: { type: string }
        execution_id: { type: string, nullable: true }
        state:
          type: string
          enum: [delivered, failed, throttled]
          description: >
            `delivered` = channel handler succeeded; `failed` = handler
            errored (see `error`); `throttled` = rule matched but the
            per-(rule, job_key) throttle window suppressed the fire.
        error:
          type: string
          nullable: true
          description: Failure reason; set when `state` is `failed`.
        fired_at: { type: string, format: date-time }
        delivered_at: { type: string, format: date-time, nullable: true }

    TagCount:
      type: object
      description: A distinct tag value and how many entities of the queried kind carry it.
      required: [tag, count]
      properties:
        tag: { type: string }
        count:
          type: integer
          description: Number of entities carrying this tag.

    JobScheduleState:
      type: object
      description: >
        Per-job scheduling-liveness view (issue #250), derived from the
        persisted `job_states` the scheduler advances on every fire.
      required: [job_key, status, fire_count, overdue, execution_mode]
      properties:
        job_key: { type: string }
        status:
          type: string
          enum: [active, paused, disabled, exhausted]
          description: Lowercase trigger status.
        next_fire_at: { type: string, format: date-time, nullable: true }
        timezone:
          type: string
          nullable: true
          description: >
            IANA zone `next_fire_at` is computed in — the *effective* zone,
            read off the live trigger rather than the config, so it is filled
            in when the job inherits it from `defaults { }` or declares nothing
            at all (in which case it reads `UTC`, issue #427). `null` only when
            the live trigger snapshot is unavailable (store-only mode, or a job
            registered after boot) — never as a stand-in for UTC.
        last_fired_at: { type: string, format: date-time, nullable: true }
        fire_count: { type: integer }
        overdue:
          type: boolean
          description: >
            true when the trigger is active but its next scheduled fire is in
            the past — the scheduler hasn't advanced it (a missed fire).
        execution_mode:
          type: string
          enum: [queued, ephemeral]
          description: >
            `queued` (persisted executions) or `ephemeral` (fire-and-forget,
            no execution rows). Explains why an `ephemeral` job legitimately
            shows no execution history. Defaults to `queued`.
        config_error:
          type: string
          description: >
            Present when the job is `paused` because its `calendar` reference
            did not resolve at load time (issue #361) — the calendar failed to
            compile or is not defined. Distinguishes a fail-closed pause from a
            manual one. Omitted for healthy jobs. Set `policy { strict_calendars
            false }` in the Croniqfile to restore the legacy behavior (the job
            fires without its gate) instead of being paused.

    Diagnostic:
      type: object
      description: A single configuration-health finding from the diagnostics report.
      required: [id, severity, title, detail]
      properties:
        id:
          type: string
          description: Stable machine-readable id (e.g. "email.delivery"), safe to match on.
        severity:
          type: string
          enum: [critical, warning, info]
          description: >
            `critical` = actively broken or unsafe; `warning` = degraded /
            risky-by-default; `info` = FYI with no action required.
        title: { type: string, description: One-line human summary. }
        detail: { type: string, description: What it means and why it matters. }
        remedy:
          type: string
          nullable: true
          description: Suggested fix; `null` for purely informational findings.

paths:
  /health:
    get:
      summary: Health check
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }

  /version:
    get:
      summary: Build and environment metadata
      description: |
        Public (no auth) so pre-login UI can render a version chip and an
        environment badge. All four fields are non-sensitive: Cargo version,
        short git SHA, RFC 3339 build timestamp, and a deploy-environment
        label sourced from `CRONIQ_ENV` (defaults to `"unknown"`).
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionResponse" }

  /v1/auth/login:
    post:
      summary: Login with username and password
      description: >
        Returns a token pair on success. If the account has TOTP enabled and
        no `code`/`recovery_code` is supplied, returns `MfaRequiredResponse`
        (`requires_totp: true`) instead — complete via `/v1/auth/login/totp`,
        or supply the code here inline to finish in a single request. When the
        server enforces 2FA (`auth { totp { required true } }`) and the account
        has no confirmed secret, returns `EnrollmentRequiredResponse`
        (`enrollment_required: true`) with a short-lived `enroll_token`; the
        client finishes inline enrolment via `/v1/auth/login/enroll/totp/*`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
                code:
                  type: string
                  description: >
                    Optional current 6-digit TOTP, verified inline so a 2FA
                    login completes in one request. At most one of
                    `code` / `recovery_code`.
                recovery_code:
                  type: string
                  description: Optional single-use recovery code (alternative to `code`).
      responses:
        "200":
          description: >
            JWT tokens, an MFA step-up challenge (`MfaRequiredResponse`) when
            the account has 2FA and no code was supplied, or an enrolment
            challenge (`EnrollmentRequiredResponse`) when enforced 2FA is on and
            the account has no secret.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/TokenResponse"
                  - $ref: "#/components/schemas/MfaRequiredResponse"
                  - $ref: "#/components/schemas/EnrollmentRequiredResponse"
        "401": { description: Invalid credentials or TOTP/recovery code }
        "403": { description: Password login is disabled }

  /v1/auth/refresh:
    post:
      summary: Refresh access token
      security: []
      requestBody:
        content:
          application/json:
            schema:
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: Fresh access and refresh token pair
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }

  /v1/auth/logout:
    post:
      summary: Revoke refresh token
      security: []
      requestBody:
        content:
          application/json:
            schema:
              properties:
                refresh_token: { type: string }
      responses:
        "204": { description: Logged out }

  /v1/jobs:
    get:
      summary: List job definitions
      responses:
        "200":
          description: List of job definitions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/JobDefinition" }
    post:
      summary: Create or update a job definition
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [job_key]
              properties:
                job_key: { type: string }
                description: { type: string }
                assigned_runner_id: { type: string }
                metadata:
                  type: object
                  additionalProperties: { type: string }
                  description: >
                    Free-form job metadata. Keys prefixed with `__` are reserved for the scheduler and are ignored when supplied by a caller.
                timeout: { type: string }
                max_retries: { type: integer }
                dead_letter_enabled: { type: boolean }
                dead_letter_retention: { type: string, description: "Dead-letter retention (\"14d\"). Omit for the system default (30d)." }
                dead_letter_operator_hint: { type: string, description: "Triage hint surfaced with this job's dead letters." }
                dead_letter_replay_max_age: { type: string, description: "Opt-in stale-replay guard (\"7d\"). Omit to always allow replays." }
                tags: { type: array, items: { type: string } }
      responses:
        "201":
          description: The created or updated job definition
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobDefinition" }

  /v1/jobs/{job_key}:
    get:
      summary: Get a job definition
      parameters:
        - name: job_key
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The job definition
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobDefinition" }
    put:
      summary: Update a job's mutable metadata
      description: |
        Patch semantics on the policy fields: a missing key leaves the stored
        value untouched, an explicit `null` clears it back to the system
        default. Identity (`job_key`) and lifecycle (`is_active`) stay on
        their dedicated endpoints; schedules are owned by `/v1/schedules`.
        DSL-managed jobs return 409 (`error: dsl_managed`).
      parameters:
        - name: job_key
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                description: { type: string, nullable: true }
                timeout: { type: string, nullable: true }
                max_retries: { type: integer, nullable: true }
                dead_letter_enabled: { type: boolean, nullable: true }
                dead_letter_retention: { type: string, nullable: true, description: "Dead-letter retention (\"14d\"). Null clears to the system default (30d)." }
                dead_letter_operator_hint: { type: string, nullable: true, description: "Triage hint surfaced with this job's dead letters." }
                dead_letter_replay_max_age: { type: string, nullable: true, description: "Opt-in stale-replay guard (\"7d\"). Null disables the guard." }
                tags: { type: array, items: { type: string } }
      responses:
        "200":
          description: The updated job definition
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobDefinition" }
        "404": { description: Unknown job }
        "409":
          description: DSL-managed job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DslManagedError" }
    delete:
      summary: Delete a job and its triggers
      parameters:
        - name: job_key
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Deleted }

  /v1/jobs/{job_key}/activate:
    post:
      summary: Activate a job
      description: Flips `is_active` to true; the scheduler starts evaluating its triggers again.
      parameters:
        - name: job_key
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The activated job definition
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobDefinition" }
        "404": { description: Unknown job }

  /v1/jobs/{job_key}/deactivate:
    post:
      summary: Deactivate a job
      description: Flips `is_active` to false; triggers remain but stop firing until re-activated.
      parameters:
        - name: job_key
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The deactivated job definition
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobDefinition" }
        "404": { description: Unknown job }

  /v1/jobs/{job_key}/adopt:
    post:
      summary: Adopt a DSL-managed job (and its trigger) into the API store
      description: |
        Copies the Croniqfile job + its synthesized trigger into persistent storage
        with `managed_by="api"`, and inserts a row in `dsl_adoptions` so the loader
        skips this DSL key on subsequent reloads. The newly API-managed trigger is
        also pushed to the live scheduler so the job keeps firing without a reload.

        Requires `policy { dsl_adopt_on_mutate true }` in the Croniqfile — without
        it, returns 409 (`error: adoption_disabled`).
      parameters:
        - name: job_key
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The adopted job and its trigger
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DslJobAdoptResponse" }
        "404": { description: DSL job with that key not found }
        "409":
          description: Policy disabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DslManagedError" }

  /v1/jobs/{job_key}/unadopt:
    post:
      summary: Drop the API copy so the next reload reinstates the DSL job
      description: |
        Removes all `managed_by="api"` triggers belonging to this job, the API
        `JobDefinition`, and the `dsl_adoptions` record. The live scheduler stops
        firing the job until the next reload re-arms the DSL trigger.
      parameters:
        - name: job_key
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Adoption removed; API job + triggers deleted. }
        "409":
          description: Job exists but was not adopted from DSL.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DslManagedError" }

  /v1/schedules:
    get:
      summary: List trigger definitions
      parameters:
        - name: job_key
          in: query
          schema: { type: string }
      responses:
        "200":
          description: List of trigger definitions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TriggerDefinition" }
    post:
      summary: Create a trigger
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [job_key]
              properties:
                job_key: { type: string }
                cron_expression: { type: string }
                timezone: { type: string }
                calendar: { type: string }
                window: { type: string }
                enabled: { type: boolean, default: true }
      responses:
        "201":
          description: The created trigger definition
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TriggerDefinition" }

  /v1/schedules/{trigger_id}:
    get:
      summary: Get a trigger
      parameters:
        - name: trigger_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The trigger definition
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TriggerDefinition" }
    put:
      summary: Update an API-managed trigger
      description: |
        Patch the editable fields of an API-managed schedule. Omitted
        fields are preserved. Returns 409 for DSL-managed triggers
        (Croniqfile owns those), 404 if the trigger_id is unknown.
      parameters:
        - name: trigger_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cron_expression: { type: string }
                timezone: { type: string }
                enabled: { type: boolean }
      responses:
        "200":
          description: The updated trigger definition
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TriggerDefinition" }
        "404": { description: Trigger not found }
        "409": { description: Trigger is DSL-managed and cannot be edited via API }
    delete:
      summary: Delete a trigger
      parameters:
        - name: trigger_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Deleted }

  /v1/runners:
    get:
      summary: List connected runners
      responses:
        "200":
          description: List of connected runners
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RunnerSummary" }

  /v1/runners/stream:
    get:
      summary: SSE stream of runner presence (snapshot every 5s)
      responses:
        "200":
          description: Server-Sent Events stream
          content:
            text/event-stream: {}

  /v1/runners/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    delete:
      summary: Deregister a runner
      responses:
        "204": { description: Removed }

  /v1/executions:
    get:
      summary: List executions
      parameters:
        - name: job_key
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string, enum: [queued, claimed, completed, failed, dead, cancelled] }
        - name: limit
          in: query
          schema: { type: integer, default: 100 }
      responses:
        "200":
          description: List of executions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Execution" }

  /v1/events/stream:
    get:
      summary: Live Console SSE stream
      description: |
        Server-Sent Events stream of server tracing events powering the
        Live Console UI (issue #141). On connect, replays a bounded
        snapshot of recent events (default 200, max 1000) before
        following the live tail. Each frame is `event: log` with a
        JSON-encoded payload.

        Filtering by `levels` happens server-side (cheap). Free-text
        search is performed in the dashboard.

        Events on secret-bearing tracing targets are dropped before they
        reach the stream, and structured fields whose name looks like a
        credential (`token`, `secret`, `password`, ...) are replaced with
        `[redacted]`.

        Scope: `admin`. The stream is the raw server-wide tracing feed
        (including a replay buffer), not per-job output — per-execution
        logs stay available to `executions:read` via
        `GET /v1/executions/{id}/logs`.
      parameters:
        - name: levels
          in: query
          schema: { type: string }
          description: |
            Comma-separated levels to include (`trace`, `debug`, `info`,
            `warn`, `error`). Empty or unset = all levels (subject to the
            server's `RUST_LOG` filter).
        - name: snapshot
          in: query
          schema: { type: integer, default: 200, maximum: 1000 }
          description: How many backfill events to ship before the live tail.
      responses:
        "200":
          description: SSE stream of `log` events
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Each frame is `event: log\\ndata: {json}\\n\\n` where
                  `{json}` is a `ConsoleEvent` with fields
                  `ts`, `level`, `target`, `message`, `fields`.
        "503":
          description: Server was built without the Live Console hub (older binary or test mode)

  /v1/executions/{id}/logs:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:
      summary: Get execution logs
      responses:
        "200":
          description: Log events recorded for the execution
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    execution_id: { type: string }
                    timestamp: { type: string, format: date-time }
                    level: { type: string }
                    message: { type: string }
                    fields: { type: object }

  /v1/executions/{id}/cancel:
    post:
      summary: Cancel an execution
      description: |
        Cancel a queued or claimed execution. For `queued` executions the
        state is flipped to `cancelled` directly in the store. For
        `claimed` (in-flight) executions the state is flipped in the store
        AND the execution_id is pushed onto the owning runner's cancel
        queue — the runner picks it up on its next poll and aborts the
        handler (see the `cancel` field on `POST /v1/work/poll`).

        Idempotent: a second cancel for an already-cancelled execution
        returns 200. Returns 409 for executions in a terminal state
        (`completed`, `failed`, `dead`).

        Scope: `executions:cancel` or `admin`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: "Cancellation outcome, including whether the owning runner was notified"
          content:
            application/json:
              schema:
                type: object
                properties:
                  execution_id: { type: string, format: uuid }
                  cancelled: { type: boolean }
                  delivered_via_runner:
                    type: boolean
                    description: |
                      `true` if the execution was in-flight and the cancel
                      was pushed to a runner's cancel queue; `false` for
                      cancels of still-queued executions.
        "400": { description: Invalid execution id (not a UUID) }
        "404": { description: Execution not found }
        "409": { description: Execution is in a terminal state }

  /v1/dead-letters:
    get:
      summary: List dead letters
      parameters:
        - name: job_key
          in: query
          schema: { type: string }
      responses:
        "200":
          description: List of dead letters
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DeadLetter" }

  /v1/dead-letters/bulk-delete:
    post:
      summary: Bulk-delete dead letters
      description: |
        Remove many dead letters at once. Provide either an explicit `ids`
        list, or `all: true` (optionally scoped to a single `job_key`) to clear
        the queue. Returns the number of rows deleted. Requires the
        `dead-letters:write` scope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items: { type: string }
                all: { type: boolean }
                job_key: { type: string }
      responses:
        "200":
          description: Number of dead letters deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: integer }
        "400": { description: "Neither ids nor all provided, or a malformed id" }

  /v1/dead-letters/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:
      summary: Get dead letter details
      responses:
        "200":
          description: The dead letter
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeadLetter" }
    delete:
      summary: Delete a dead letter
      responses:
        "204": { description: Deleted }

  /v1/dead-letters/{id}/replay:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      summary: Replay a dead letter as a new execution
      description: |
        Requeues the dead letter as a fresh execution, preserving the original
        `scheduled_for` (logical fire time). Requires `dead-letters:write`.

        Honours the opt-in stale-replay guard: if the job declares
        `dead_letter { replay_max_age … }` and the dead letter's `scheduled_for`
        is older than that, the replay is refused with `409 stale_replay` unless
        the request body passes `force: true`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
                  default: false
                  description: Override the stale-replay guard.
      responses:
        "200":
          description: The execution queued from the dead letter
          content:
            application/json:
              schema:
                type: object
                properties:
                  execution_id: { type: string }
                  attempt: { type: integer }
                  scheduled_for: { type: string, format: date-time }
        "409":
          description: "Replay refused by the stale-replay guard (retry with `force: true`)."
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, enum: [stale_replay] }
                  message: { type: string }
                  scheduled_for: { type: string, format: date-time }
                  age_seconds: { type: integer }
                  replay_max_age: { type: string }

  /v1/alerts/config:
    get:
      summary: Effective alerts config with operational overrides
      description: |
        Returns the DSL-managed alert `channels` + `rules` the evaluator and
        watchdog are using, with active overrides surfaced inline. Webhook
        signing keys are never serialized. Requires `alerts:read`.
      responses:
        "200":
          description: Effective alerts config with operational overrides applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertsConfigView" }

  /v1/alerts/deliveries:
    get:
      summary: List the per-fire alert delivery log
      description: >
        Read-only view of alert deliveries (delivered / failed / throttled),
        newest-first. Backs the alerts UI and `doctor`. Requires `alerts:read`.
      parameters:
        - { name: job_key, in: query, schema: { type: string } }
        - { name: rule_name, in: query, schema: { type: string } }
        - name: state
          in: query
          description: Only return deliveries in this state. A typo is rejected with 400, not silently ignored.
          schema:
            type: string
            enum: [delivered, failed, throttled]
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - name: limit
          in: query
          description: Max rows. Capped server-side at 500.
          schema: { type: integer, default: 100, maximum: 500 }
      responses:
        "200":
          description: Delivery-log rows
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AlertDelivery" }
        "400": { description: Unknown state filter }

  /v1/alerts/deliveries/{id}:
    get:
      summary: Get a single alert delivery
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Delivery row
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertDelivery" }
        "404": { description: No delivery with that id }

  /v1/alerts/rules/{name}/snooze:
    post:
      summary: Snooze an alert rule until a deadline
      description: |
        Suppresses the named rule until `until`, which doubles as the
        auto-clear deadline. `note` is mandatory. Requires `alerts:write`
        (admin-only). Overwrites any existing override for the rule.
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [until, note]
              properties:
                until: { type: string, format: date-time }
                note: { type: string }
      responses:
        "200":
          description: The stored override for the rule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertRuleOverride" }
        "400": { description: Missing/blank note or missing deadline }
        "403": { description: Caller lacks alerts:write }
        "404": { description: Unknown rule }

  /v1/alerts/rules/{name}/disable:
    post:
      summary: Disable an alert rule
      description: |
        Disables the named rule. `expires_at` optionally auto-re-enables it;
        omit for an open-ended disable. `note` is mandatory. Requires
        `alerts:write`. Overwrites any existing override for the rule.
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: { type: string }
                expires_at: { type: string, format: date-time, nullable: true }
      responses:
        "200":
          description: The stored override for the rule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertRuleOverride" }
        "400": { description: Missing/blank note }
        "403": { description: Caller lacks alerts:write }
        "404": { description: Unknown rule }

  /v1/alerts/rules/{name}/throttle:
    post:
      summary: Override an alert rule's throttle window
      description: |
        Replaces the rule's DSL throttle window with `throttle` (a duration
        string such as `"30m"` or `"1h"`) while the override is active. Note
        this REPLACES rather than mins with the DSL window. `expires_at`
        optionally auto-clears. `note` is mandatory. Requires `alerts:write`.
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [throttle, note]
              properties:
                throttle: { type: string, description: "Duration string, e.g. \"30m\"" }
                note: { type: string }
                expires_at: { type: string, format: date-time, nullable: true }
      responses:
        "200":
          description: The stored override for the rule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertRuleOverride" }
        "400": { description: Missing/blank note or unparseable duration }
        "403": { description: Caller lacks alerts:write }
        "404": { description: Unknown rule }

  /v1/alerts/rules/{name}/override:
    get:
      summary: Inspect the current override for a rule
      description: Returns the active override. Requires `alerts:read`.
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The current override for the rule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertRuleOverride" }
        "404": { description: No override set (or unknown rule) }
    delete:
      summary: Clear a rule's override
      description: |
        Removes the override, returning the rule to pure DSL behaviour.
        Requires `alerts:write`.
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Cleared }
        "403": { description: Caller lacks alerts:write }
        "404": { description: Nothing to clear }

  /v1/calendars:
    get:
      summary: List calendars
      responses:
        "200":
          description: List of calendars
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CalendarDefinition" }
    post:
      summary: Create a calendar
      responses:
        "201":
          description: The created calendar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalendarDefinition" }

  /v1/calendars/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:
      summary: Get a calendar
      description: |
        Accepts both real UUIDs (API-managed rows) and synthetic `dsl:{name}` IDs
        (Croniqfile-defined calendars synthesized at read time).
      responses:
        "200":
          description: The calendar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalendarDefinition" }
        "404": { description: Unknown calendar }
    put:
      summary: Update a calendar
      description: |
        Refuses DSL-managed calendars (409 with `error: dsl_managed`). To take
        ownership, call `POST /v1/calendars/dsl:{name}/adopt` first.
      responses:
        "200":
          description: The updated calendar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalendarDefinition" }
        "409":
          description: DSL-managed; mutation refused.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DslManagedError" }
    delete:
      summary: Delete a calendar
      description: Refuses DSL-managed calendars (409). Adopt first if you want to remove it.
      responses:
        "204": { description: Deleted }
        "409":
          description: DSL-managed; mutation refused.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DslManagedError" }

  /v1/calendars/{id}/adopt:
    post:
      summary: Adopt a DSL-managed calendar into the API store
      description: |
        Copies the Croniqfile calendar named in the synthetic ID `dsl:{name}` into the
        persistent store with a fresh UUID and `managed_by="api"`, and inserts a row
        in `dsl_adoptions` so the loader skips this DSL key on subsequent reloads.
        Reversible via `/unadopt`.

        Requires `policy { dsl_adopt_on_mutate true }` in the Croniqfile — without
        it, returns 409 (`error: adoption_disabled`).
      parameters:
        - name: id
          in: path
          required: true
          description: Synthetic DSL ID (`dsl:{name}`).
          schema: { type: string }
      responses:
        "200":
          description: The adopted calendar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DslAdoptResponse" }
        "400":
          description: ID does not have the `dsl:` prefix.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DslManagedError" }
        "404": { description: DSL calendar with that name not found }
        "409":
          description: Policy disabled or other adoption refusal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DslManagedError" }

  /v1/calendars/{id}/unadopt:
    post:
      summary: Drop an adopted calendar so the next reload reinstates the DSL definition
      description: |
        Removes the API-managed row plus the `dsl_adoptions` record for the calendar.
        On the next config reload the Croniqfile definition surfaces again with
        `managed_by="dsl"`.
      parameters:
        - name: id
          in: path
          required: true
          description: API UUID of the calendar (returned from `/adopt`).
          schema: { type: string }
      responses:
        "204": { description: Adoption removed; API copy deleted. }
        "400":
          description: Caller passed a `dsl:` synthetic ID instead of the API UUID.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DslManagedError" }
        "404": { description: Calendar not found }
        "409":
          description: Calendar exists but was not adopted from DSL.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DslManagedError" }

  /v1/dashboard/forecast:
    get:
      summary: Schedule forecast with time buckets
      parameters:
        - name: window_minutes
          in: query
          schema: { type: integer, default: 60, maximum: 240 }
        - name: bucket_minutes
          in: query
          schema: { type: integer, default: 5 }
      responses:
        "200":
          description: Forecast buckets covering the requested window
          content:
            application/json:
              schema:
                type: object
                properties:
                  window_minutes: { type: integer }
                  bucket_minutes: { type: integer }
                  buckets:
                    type: array
                    items:
                      type: object
                      properties:
                        start: { type: string, format: date-time }
                        end: { type: string, format: date-time }
                        count: { type: integer }
                        jobs: { type: array, items: { type: string } }

  /v1/work/poll:
    post:
      summary: Poll for work (long-poll supported)
      description: |
        Runner ↔ server work loop. Long-poll up to ~35 s for new work.

        **Server-initiated cancellation (issue #176):** when an operator
        cancels an execution via `POST /v1/executions/{id}/cancel`, the
        execution_id is pushed onto the owning runner's cancel queue and
        delivered in the next poll's `cancel` array. SDKs that honour
        `cancel` (.NET, Go, Python, TS, Java) tear down the handler's
        cancellation token/context. The Rust SDK polls correctly while
        at capacity (so cancels are wire-delivered) but does not yet act
        on them — handler abort is tracked as a separate enhancement.

        **Control-slot polling at `max_inflight=1`:** every SDK keeps
        polling while at capacity, sending `inflight=[current ids]` so
        the server can deliver cancels. The server's poll handler
        returns immediately when capacity is zero (no long-poll), so the
        SDK paces these at-capacity polls via `capacity_backoff` (default
        500 ms in most SDKs). Pre-#176 runners would `sleep(capacity_backoff)`
        without polling and a `max_inflight=1` runner could never receive
        a cancel until the handler finished naturally — that limitation
        is now gone.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [runner_id]
              properties:
                runner_id: { type: string }
                capabilities: { type: array, items: { type: string } }
                max_inflight: { type: integer, default: 1 }
                inflight: { type: array, items: { type: string } }
                instance_id: { type: string }
      responses:
        "200":
          description: "Work items to execute, plus execution IDs the runner should cancel"
          content:
            application/json:
              schema:
                type: object
                properties:
                  work:
                    type: array
                    items: { $ref: "#/components/schemas/WorkAssignment" }
                  cancel:
                    type: array
                    items: { type: string, format: uuid }
                    description: |
                      Execution IDs the runner should cancel. Drained
                      from the per-runner cancel queue populated by
                      `POST /v1/executions/{id}/cancel`. See endpoint
                      description for delivery semantics.
        "409":
          description: |
            Runner instance conflict — this instance was deposed by a newer
            instance registering under the same runner_id. The deposed
            instance should back off and eventually exit (runner SDKs treat
            a streak of poll conflicts as fatal).
        "403":
          description: |
            The `runner_id` in the request body is bound to a different
            credential. A `runner_id` belongs to the credential that first
            used it in the work protocol (first-writer-wins); give each
            runner its own id, or release the binding with
            `DELETE /v1/runners/{id}` to hand the id over. Not retryable
            until one of those happens. Absent under
            `pull_api { runner_identity_binding "off" }`.
        "503":
          description: |
            The runner-identity binding could not be read or written. The
            check fails closed rather than accepting the request; retry.

  /v1/work/ack:
    post:
      summary: Acknowledge execution completion
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [runner_id, execution_id, status]
              properties:
                runner_id: { type: string }
                execution_id: { type: string }
                status: { type: string, enum: [success, failure] }
                error: { type: string }
                duration_ms: { type: integer }
                attempt: { type: integer }
      responses:
        "200": { description: Acknowledged }
        "403":
          description: |
            The `runner_id` in the request body is bound to a different
            credential. A `runner_id` belongs to the credential that first
            used it in the work protocol (first-writer-wins); give each
            runner its own id, or release the binding with
            `DELETE /v1/runners/{id}` to hand the id over. Not retryable
            until one of those happens. Absent under
            `pull_api { runner_identity_binding "off" }`.
        "503":
          description: |
            The runner-identity binding could not be read or written. The
            check fails closed rather than accepting the request; retry.

  /v1/work/renew:
    post:
      summary: Renew the lease on one claimed execution
      description: |
        Extends the lease on the **single execution** named by
        `execution_id`, on behalf of the runner named by `runner_id`. The
        execution must exist, be `claimed`, and be held by that runner.

        The renewed lease is what exempts a claim from the watchdog's
        stale-claim reaper, and the exemption is per execution: renewing one
        execution does not keep the reaper off the runner's other claims.
        Runners with several executions in flight must therefore renew each
        of them (the SDKs run one renew timer per execution).

        A successful renew also refreshes the runner's own liveness
        heartbeat, since it proves the process is alive.
      requestBody:
        content:
          application/json:
            schema:
              required: [runner_id, execution_id]
              properties:
                runner_id: { type: string }
                execution_id: { type: string, format: uuid }
      responses:
        "200":
          description: |
            The lease on `execution_id` was renewed. `renewed` is `true` only
            when that execution was actually consulted and its lease
            extended.
          content:
            application/json:
              schema:
                properties:
                  renewed: { type: boolean }
        "404":
          description: |
            No such execution — `execution_id` names nothing the server
            knows (or is not a valid execution id). Not retryable.
        "409":
          description: |
            The execution exists but its lease is not this runner's to
            extend: it is no longer `claimed` (completed, cancelled, or
            requeued by the watchdog), or it is claimed by a different
            runner. Ordinary and harmless when a renew races the runner's
            own completion — SDKs may ignore it — but it is never retryable.
        "403":
          description: |
            The `runner_id` in the request body is bound to a different
            credential. A `runner_id` belongs to the credential that first
            used it in the work protocol (first-writer-wins); give each
            runner its own id, or release the binding with
            `DELETE /v1/runners/{id}` to hand the id over. Not retryable
            until one of those happens. Absent under
            `pull_api { runner_identity_binding "off" }`.
        "503":
          description: |
            The runner-identity binding, or the execution's claim state,
            could not be read. Both checks fail closed rather than accepting
            the request; retry.

  /v1/work/{execution_id}/events:
    post:
      summary: Push structured log events
      parameters:
        - name: execution_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  level: { type: string }
                  message: { type: string }
                  fields: { type: object }
      responses:
        "200":
          description: Number of log events accepted
          content:
            application/json:
              schema:
                properties:
                  accepted: { type: integer }
        "403":
          description: |
            The execution is claimed by a runner belonging to a different
            credential, or is not claimed by any runner. This endpoint is
            addressed by execution, so it is fenced on the runner that
            claimed it — only that runner's credential may append to the
            execution's log. Absent under
            `pull_api { runner_identity_binding "off" }`.
        "404":
          description: No such execution.
        "503":
          description: |
            The runner-identity binding could not be resolved. The check
            fails closed rather than accepting the events; retry.

  /v1/api-clients:
    get:
      summary: List API clients
      responses:
        "200":
          description: List of API clients
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApiClient" }
    post:
      summary: Create an API client
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: { type: string }
                scopes: { type: array, items: { type: string } }
      responses:
        "201":
          description: The created API client
          content:
            application/json:
              schema:
                type: object
                properties:
                  client_id: { type: string }
                  name: { type: string }
                  scopes: { type: array, items: { type: string } }

  /v1/api-clients/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    delete:
      summary: Delete an API client and its keys
      responses:
        "204": { description: Deleted }

  /v1/api-clients/{id}/tokens:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      summary: Issue a token for an API client
      responses:
        "200":
          description: A token scoped to the API client
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }

  /v1/api-keys:
    post:
      summary: Generate a new API key
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [client_id]
              properties:
                client_id: { type: string }
      responses:
        "201":
          description: "The generated key; `raw_key` is shown only once"
          content:
            application/json:
              schema:
                type: object
                properties:
                  raw_key: { type: string, description: "Shown once only" }
                  key_id: { type: string }
                  key_prefix: { type: string }
                  client_id: { type: string }

  /v1/api-keys/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    delete:
      summary: Revoke an API key
      responses:
        "204": { description: Revoked }

  /v1/jobs/register:
    post:
      summary: Register a job from a runner or API client
      description: |
        Creates or updates a job + trigger. Collision policy:
        - If a Croniqfile (DSL) job with the same key exists: skip (DSL precedence)
        - If a runner/API job exists: update
        - Otherwise: create new
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [job_key, schedule]
              properties:
                job_key: { type: string, description: "e.g. billing:invoice" }
                schedule: { type: string, description: "Interval: 5m, 1h, 300, or */5 * * * *" }
                timezone: { type: string }
                timeout: { type: string }
                runner_id: { type: string }
                capabilities: { type: array, items: { type: string } }
                description: { type: string }
                max_retries: { type: integer }
                dead_letter_enabled: { type: boolean }
                dead_letter_retention: { type: string, description: "Dead-letter retention (\"14d\"). Omit for the system default (30d)." }
                dead_letter_operator_hint: { type: string, description: "Triage hint surfaced with this job's dead letters." }
                dead_letter_replay_max_age: { type: string, description: "Opt-in stale-replay guard (\"7d\"). Omit to always allow replays." }
                calendar: { type: string, description: "Calendar name gating execution." }
      responses:
        "201":
          description: Job created
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_key: { type: string }
                  trigger_id: { type: string }
                  status: { type: string, enum: [registered, skipped_dsl_precedence] }
        "200":
          description: Job updated (already existed)

  /v1/jobs/states:
    get:
      summary: Per-job scheduling liveness
      description: >
        Per-job scheduling-liveness view derived from the persisted
        `job_states` the scheduler advances on every fire (issue #250).
        Static sibling of `/v1/jobs/{job_key}` — routed first. The UI polls
        this to badge overdue jobs (a silently-stalled scheduler otherwise
        reads as healthy). Requires the `jobs:read` scope.
      responses:
        "200":
          description: Schedule-state rows
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/JobScheduleState" }

  /v1/trigger:
    post:
      summary: Trigger a job immediately
      description: >
        Enqueues an execution for the job. Supply an `idempotency_key` to
        dedup at-least-once producers (event redelivery, client retries,
        concurrent publishers): a repeat trigger with the same
        `(job_key, idempotency_key)` returns the existing `execution_id`
        with `deduplicated: true` instead of enqueuing a new execution —
        while that execution is still queued/running, or for a configurable
        window after it was created (`pull_api { trigger_dedup_window … }`,
        default 10m), even if it already finished. Dedup is best-effort:
        two truly concurrent identical triggers may both pass the lookup
        and enqueue twice. It is NOT a strict exactly-once guarantee.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [job_key]
              properties:
                job_key: { type: string }
                require: { type: array, items: { type: string } }
                prefer: { type: array, items: { type: string } }
                metadata:
                  type: object
                  description: >
                    Free-form metadata. Keys prefixed with `__` are reserved for the scheduler (`__runner_exec`, `__require`, `__prefer`, `__max_concurrent`) and are ignored when supplied by a caller — use `require` / `prefer` to influence routing.
                timeout: { type: string, default: "5m" }
                idempotency_key:
                  type: string
                  maxLength: 200
                  description: >
                    Optional dedup key, scoped per job_key. Empty string is
                    treated as absent; keys longer than 200 characters are
                    rejected with 400.
      responses:
        "200":
          description: "Trigger outcome, including whether the run was deduplicated"
          content:
            application/json:
              schema:
                type: object
                properties:
                  execution_id:
                    type: string
                    description: >
                      On a dedup hit this is the EXISTING execution's id,
                      not a new one.
                  queued:
                    type: integer
                    description: >
                      Queue depth after enqueue (unchanged on a dedup hit —
                      nothing is enqueued then).
                  deduplicated:
                    type: boolean
                    description: >
                      true when the trigger coalesced to an existing
                      execution via idempotency_key.
        "400": { description: Invalid request (e.g. idempotency_key longer than 200 characters) }
        "429":
          description: >
            Per-job queue-overflow cap hit (#299/#312). The number of queued
            executions for this `job_key` already reached its `max_queue_depth`
            (per-job override, default 10), so the trigger is rejected rather
            than piling work up unbounded for one job. The body is an empty
            TriggerResponse (`execution_id: ""`, `queued: 0`,
            `deduplicated: false`). Producers treat this as backpressure and
            back off — the SDKs surface it as a dedicated queue-overflow error
            that carries `retryAfterMs`, read from the `Retry-After` header.
          headers:
            Retry-After:
              required: true
              description: >
                Suggested backoff before retrying, in seconds (RFC 9110).
                Always set on this response; the SDKs surface it as
                `retryAfterMs`.
              schema: { type: integer }

  /v1/admin/reload-config:
    post:
      summary: Hot-reload the Croniqfile
      description: >
        Re-reads the Croniqfile, merges API-registered triggers (DSL
        precedence) and reconciles the live scheduler. Use `?dry_run=true`
        to validate and return a diff without applying. Requires the
        `admin` scope.
      parameters:
        - name: dry_run
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Reload applied (or validated when dry_run=true)
          content:
            application/json:
              schema:
                type: object
                properties:
                  applied: { type: boolean }
                  dry_run: { type: boolean }
                  diff:
                    type: object
                    properties:
                      added: { type: array, items: { type: string } }
                      removed: { type: array, items: { type: string } }
                      changed: { type: array, items: { type: string } }
                      total: { type: integer }
                  pending_restart:
                    type: array
                    description: >
                      Boot-only settings the Croniqfile changed since startup.
                      A reload applies jobs, calendars, triggers and the
                      `policy { }` flags only; `server { }`, `pull_api { }`,
                      `observability { }`, `mcp { }`, `oidc { }`, `smtp { }`,
                      `auth { }` and `alerts { }` need a server restart, so
                      these entries were parsed and discarded (issue #406).
                      Omitted when empty. `alerts` is reported as a
                      fingerprint, never as values, because a channel can
                      carry a signing key.
                    items:
                      type: object
                      properties:
                        setting: { type: string, example: server.execution_retention }
                        running: { type: string, nullable: true, description: Value in effect; null when unset at boot }
                        pending: { type: string, nullable: true, description: Value in the file; null when removed }
        "403": { description: Missing admin scope }
        "422":
          description: Validation or file-read error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, enum: [read_error, validation_error, store_error] }
                  message: { type: string }
                  line: { type: integer, nullable: true }
                  column: { type: integer, nullable: true }
        "500": { description: Apply failed after successful validation }
        "503": { description: Server not configured for reload (missing store or config path) }

  # ─── PR-A1+ Auth (TOTP step-up, OIDC, password-reset) ───────────────────

  /v1/auth/login/totp:
    post:
      summary: Complete a step-up login by submitting the TOTP code
      description: >
        Exchange the short-lived `mfa_token` returned by `/v1/auth/login`
        (when the user has TOTP enabled) for a normal `TokenResponse`.
        Supply EITHER `code` (6-digit authenticator code) OR
        `recovery_code` (single-use 8-char recovery code) — never both.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfa_token]
              properties:
                mfa_token: { type: string }
                code:
                  type: string
                  description: 6-digit TOTP from the authenticator app.
                recovery_code:
                  type: string
                  description: 8-char single-use recovery code.
      responses:
        "200":
          description: Tokens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "400": { description: Neither code nor recovery_code provided }
        "401": { description: "Invalid mfa_token, expired, or wrong code" }
        "403": { description: User deactivated }

  /v1/auth/login/enroll/totp/begin:
    post:
      summary: Start inline TOTP enrolment during enforced-2FA login
      description: >
        For an account that hit enforced 2FA without a confirmed secret.
        Validates the short-lived `enroll_token` from the login
        `EnrollmentRequiredResponse` and returns the once-shown secret, QR
        URL, and recovery codes. Public — the token (issued only after a
        verified password) is the proof.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enroll_token]
              properties:
                enroll_token: { type: string }
      responses:
        "200":
          description: Enrolment material (shown once)
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: { type: string }
                  otpauth_url: { type: string }
                  recovery_codes: { type: array, items: { type: string } }
        "401": { description: Invalid or expired enroll_token }
        "403": { description: User deactivated }
        "409": { description: Account already has TOTP enabled }

  /v1/auth/login/enroll/totp/confirm:
    post:
      summary: Finish inline TOTP enrolment and complete login
      description: >
        Verify the first 6-digit code against the pending secret, enable
        TOTP, and return a normal `TokenResponse`. Same `enroll_token` as
        `/begin`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enroll_token, code]
              properties:
                enroll_token: { type: string }
                code:
                  type: string
                  description: 6-digit TOTP from the authenticator app.
      responses:
        "200":
          description: Tokens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "401": { description: Invalid enroll_token or wrong code }
        "403": { description: User deactivated }

  /v1/auth/password-reset/request:
    post:
      summary: Initiate a password reset for a username
      description: >
        Always returns 202, regardless of whether the username exists,
        to avoid user enumeration. When the username does exist and the
        user is active, a single-use 1-hour token is created and emitted
        via the configured `EmailSender` (NoopSender logs an audit
        entry; an admin can recover the URL from server logs).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username: { type: string }
      responses:
        "202": { description: Reset processed (whether or not the user exists) }

  /v1/auth/password-reset/confirm:
    post:
      summary: Complete a password reset using the emailed token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token: { type: string }
                new_password:
                  type: string
                  minLength: 8
      responses:
        "204": { description: Password updated }
        "400": { description: new_password too short }
        "401": { description: Token unknown }
        "410": { description: Token expired or already used }
        "404": { description: User vanished between issue and use }

  /v1/auth/oidc/config:
    get:
      summary: Inspect whether OIDC sign-in is available
      description: >
        Read-only metadata for the login UI. Returns `enabled: false` when
        no OIDC provider is configured (env vars unset and no `oidc {}`
        block in the Croniqfile).
      security: []
      responses:
        "200":
          description: Provider metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OidcConfigResponse" }

  /v1/auth/config:
    get:
      summary: Probe every UI sign-in method (OIDC + password + TOTP)
      description: >
        Combined sign-in-method probe (issue #138). Canonical replacement for
        the OIDC-only `/v1/auth/oidc/config` — both are kept for now. Read-only,
        no secrets; the login UI fetches this once before any auth happens.
      security: []
      responses:
        "200":
          description: Sign-in-method summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthConfigResponse" }

  /v1/auth/oidc/login:
    get:
      summary: Start an OIDC sign-in (302 redirect to the IdP)
      security: []
      responses:
        "302": { description: Redirect to the IdP authorize URL }
        "404": { description: OIDC not configured }

  /v1/auth/oidc/callback:
    get:
      summary: IdP redirect target — completes the authorization-code flow
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Tokens minted (JIT-creates the user on first sign-in)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "401": { description: "Unknown state, bad code, or invalid ID token" }
        "403": { description: Linked user is deactivated }
        "404": { description: OIDC not configured }
        "410": { description: State expired }

  # ─── PR-A2 Users + Invitations ──────────────────────────────────────────

  /v1/users:
    get:
      summary: List all users (admin)
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
        "403": { description: Missing users:admin or admin scope }
    post:
      summary: Create a user with password (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, role]
              properties:
                username: { type: string }
                password: { type: string, minLength: 8 }
                role:
                  type: string
                  enum: [admin, operator, viewer]
                email: { type: string, nullable: true }
                display_name: { type: string, nullable: true }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { description: Validation error (empty username or short password) }
        "403": { description: Missing scope }
        "409": { description: Username already exists }

  /v1/users/{id}:
    get:
      summary: Load one user (admin)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: User
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404": { description: Not found }
    patch:
      summary: Partial user update (admin)
      description: >
        PATCH the role to a non-admin value, or set is_active=false, on
        the last active admin returns 409 Conflict — the lock-out guard.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, nullable: true }
                display_name: { type: string, nullable: true }
                role:
                  type: string
                  enum: [admin, operator, viewer]
                is_active: { type: boolean }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "409": { description: Operation would leave zero active admins }
        "404": { description: Not found }
    delete:
      summary: Delete a user (admin)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "204": { description: Deleted }
        "404": { description: Not found }
        "409": { description: Last active admin — refuse }

  /v1/users/me:
    get:
      summary: Load the authenticated user's profile
      responses:
        "200":
          description: User
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { description: Not a user caller }
    patch:
      summary: Update own display_name / email
      description: Role + is_active require `users:admin`; this endpoint refuses to change them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, nullable: true }
                display_name: { type: string, nullable: true }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }

  /v1/users/me/change-password:
    post:
      summary: Change own password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_password, new_password]
              properties:
                old_password: { type: string }
                new_password: { type: string, minLength: 8 }
      responses:
        "204": { description: Password updated }
        "400": { description: new_password too short }
        "401": { description: old_password wrong }

  /v1/invitations:
    get:
      summary: List outstanding invitations (admin)
      responses:
        "200":
          description: Invitations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Invitation" }
    post:
      summary: Issue a new invitation (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string }
                role:
                  type: string
                  enum: [admin, operator, viewer]
      responses:
        "201":
          description: Invitation created — raw token is shown ONCE
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateInvitationResponse" }

  /v1/invitations/{id}:
    delete:
      summary: Revoke an outstanding invitation (admin)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "204": { description: Revoked }
        "404": { description: Not found }
        "409": { description: Already accepted }

  /v1/invitations/accept:
    post:
      summary: Redeem an invitation token to create the new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, username, password]
              properties:
                token: { type: string }
                username: { type: string }
                password: { type: string, minLength: 8 }
      responses:
        "201": { description: User created and logged in }
        "401": { description: Unknown token }
        "409": { description: Username collision }
        "410": { description: Token expired or revoked }

  # ─── PR-A3 TOTP (self-service) ──────────────────────────────────────────

  /v1/users/me/totp/setup:
    post:
      summary: Begin TOTP enrolment
      description: >
        Returns the base32 seed, an otpauth:// URL for QR rendering, and
        10 single-use recovery codes (8-char alphanumeric). Idempotent
        until /confirm; calling it again on a confirmed secret returns
        409.
      responses:
        "200":
          description: Setup info — shown ONCE
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TotpSetupResponse" }
        "409": { description: Already confirmed; call /disable first }

  /v1/users/me/totp/confirm:
    post:
      summary: Activate TOTP by submitting a current code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: "^[0-9]{6}$" }
      responses:
        "204": { description: TOTP enabled }
        "401": { description: Code did not match }
        "409": { description: Already enabled }
        "404": { description: No pending setup }

  /v1/users/me/totp/disable:
    post:
      summary: Disable TOTP (requires fresh password proof)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        "204": { description: "TOTP disabled, recovery codes wiped" }
        "401": { description: Password wrong }

  /v1/users/me/totp/recovery-codes/regenerate:
    post:
      summary: Mint a fresh batch of recovery codes (invalidates previous)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        "200":
          description: New codes — shown ONCE
          content:
            application/json:
              schema:
                type: object
                properties:
                  recovery_codes:
                    type: array
                    items: { type: string }
        "401": { description: Password wrong }
        "409": { description: TOTP not enabled }

  # ─── PR-A4 Personal Access Tokens ───────────────────────────────────────

  /v1/users/me/tokens:
    get:
      summary: List own PATs
      responses:
        "200":
          description: PATs (without raw tokens)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PersonalAccessToken" }
    post:
      summary: Issue a new PAT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                scopes:
                  type: array
                  items: { type: string }
                  description: >-
                    Subset of the role's default scopes *and* of the scopes
                    carried by the credential making the request. Defaults to
                    the role's set narrowed to the caller's own scopes.
                expires_at:
                  type: string
                  format: date-time
                  nullable: true
      responses:
        "201":
          description: Created — raw token shown ONCE
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatePatResponse" }
        "400": { description: Empty name or empty scopes }
        "403":
          description: >-
            Requested scope outside the role's default-set or outside the
            caller's own scopes, or the request itself authenticated with a
            PAT (a PAT cannot issue further PATs).

  /v1/users/me/tokens/{id}:
    delete:
      summary: Revoke a PAT
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "204": { description: Revoked }
        "404": { description: Not your token }

  # ─── PR-B1 Stats + Audit + Insights ─────────────────────────────────────

  /v1/audit:
    get:
      summary: List audit events (admin)
      parameters:
        - { name: actor_type, in: query, schema: { type: string } }
        - { name: actor_id, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
        - { name: target_type, in: query, schema: { type: string } }
        - { name: target_id, in: query, schema: { type: string } }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: until, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, default: 200, maximum: 1000 } }
      responses:
        "200":
          description: Events newest-first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditEvent" }

  /v1/jobs/{job_key}/stats:
    get:
      summary: Aggregate execution stats for a job
      parameters:
        - { name: job_key, in: path, required: true, schema: { type: string } }
        - { name: days, in: query, schema: { type: integer, default: 7, minimum: 1, maximum: 90 } }
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobStatsResponse" }

  /v1/executions/throughput:
    get:
      summary: Stacked throughput buckets for the dashboard
      parameters:
        - name: window
          in: query
          schema:
            type: string
            enum: [24h, 7d, 30d]
            default: "24h"
      responses:
        "200":
          description: Bucket array
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThroughputResponse" }
        "400": { description: Unknown window }

  /v1/insights/failures:
    get:
      summary: Failure heatmap (day × hour) + hourly hotspots
      parameters:
        - { name: days, in: query, schema: { type: integer, default: 28, minimum: 7, maximum: 90 } }
      responses:
        "200":
          description: Heatmap
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FailureHeatmap" }

  /v1/tags:
    get:
      summary: Distinct tags across an entity kind
      description: >
        Distinct tag values across the entity kind with usage counts, sorted
        by count desc then alphabetically. Backs UI autocomplete and filter
        chips. `entity=jobs` requires the `jobs:read` scope; `entity=runners`
        requires `runners:read`.
      parameters:
        - name: entity
          in: query
          description: Entity kind to aggregate over.
          schema:
            type: string
            enum: [jobs, runners]
            default: jobs
      responses:
        "200":
          description: Tags with usage counts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TagCount" }
        "400": { description: Unknown entity kind }

  /v1/system/diagnostics:
    get:
      summary: Configuration health report (admin)
      description: >
        Admin-only, read-only configuration-health report. Reports posture
        (e.g. "no SMTP configured", "app URL not pinned"), never secrets.
        Backs the Settings → System UI panel and mirrors the boot-time
        warnings / `croniq-server doctor` output. Requires the `admin` scope.
      responses:
        "200":
          description: Diagnostic findings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Diagnostic" }

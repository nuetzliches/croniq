openapi: 3.1.0
info:
  title: Croniq API
  description: Distributed job scheduling platform
  version: 0.4.0
  license:
    name: MIT OR Apache-2.0

servers:
  - url: http://localhost:4000
    description: Local development

security:
  - BearerAuth: []
  - ApiKeyAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: "ApiKey <raw_key>"

  schemas:
    HealthResponse:
      type: object
      properties:
        status: { type: string }
        runners_online: { type: integer }
        runners_stale: { type: integer }
        runners_dead: { type: integer }
        queued: { type: integer }

    VersionResponse:
      type: object
      required: [version, git_sha, build_time, env]
      properties:
        version:
          type: string
          description: "Cargo package version, baked in at compile time (e.g. \"0.4.2\")."
          example: "0.4.2"
        git_sha:
          type: string
          description: "Short git SHA of the build commit, or \"unknown\" outside a git checkout."
          example: "f3aea44"
        build_time:
          type: string
          format: date-time
          description: "RFC 3339 UTC timestamp at which this binary was built."
          example: "2026-05-23T12:35:00Z"
        env:
          type: string
          description: "Deploy-environment label from CRONIQ_ENV. Defaults to \"unknown\" when unset."
          example: "production"

    TokenResponse:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string }
        expires_in: { type: integer }

    JobDefinition:
      type: object
      properties:
        job_key: { type: string }
        description: { type: string, nullable: true }
        assigned_runner_id: { type: string, nullable: true }
        is_active: { type: boolean }
        metadata: { type: object, additionalProperties: { type: string } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TriggerDefinition:
      type: object
      properties:
        trigger_id: { type: string }
        job_key: { type: string }
        cron_expression: { type: string, nullable: true }
        timezone: { type: string, nullable: true }
        calendar: { type: string, nullable: true }
        window: { type: string, nullable: true }
        enabled: { type: boolean }
        managed_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    RunnerSummary:
      type: object
      properties:
        runner_id: { type: string }
        status: { type: string, enum: [Online, Stale, Dead] }
        capabilities: { type: array, items: { type: string } }
        max_inflight: { type: integer }
        inflight: { type: integer }
        last_poll_at: { type: string, format: date-time }

    Execution:
      type: object
      properties:
        id: { type: string, format: uuid }
        job_key: { type: string }
        fire_at: { type: string, format: date-time }
        attempt: { type: integer }
        state: { type: string, enum: [queued, claimed, completed, failed, dead, cancelled] }
        runner_id: { type: string, nullable: true }
        duration_ms: { type: integer, nullable: true }
        error: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    DeadLetter:
      type: object
      properties:
        id: { type: string, format: uuid }
        execution_id: { type: string, format: uuid }
        job_key: { type: string }
        attempt: { type: integer }
        error: { type: string }
        dead_reason: { type: string }
        metadata: { type: object }
        created_at: { type: string, format: date-time }

    CalendarDefinition:
      type: object
      properties:
        calendar_id:
          type: string
          description: Real UUID for API-managed calendars; synthetic `dsl:{name}` for Croniqfile-defined ones.
        name: { type: string }
        timezone: { type: string, nullable: true }
        rules: { type: string }
        managed_by:
          type: string
          enum: [api, dsl]
          description: '`dsl` rows are synthesized at read time from the Croniqfile and refuse mutations (409). Use `/adopt` to take ownership.'
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DslAdoptResponse:
      type: object
      properties:
        calendar: { $ref: "#/components/schemas/CalendarDefinition" }
        dsl_key:
          type: string
          description: The DSL identifier (calendar name or job key) that was adopted. Used by `/unadopt` to find the row and the loader to skip it on reload.

    DslJobAdoptResponse:
      type: object
      properties:
        job: { $ref: "#/components/schemas/JobDefinition" }
        trigger: { $ref: "#/components/schemas/TriggerDefinition" }
        dsl_key: { type: string }

    DslManagedError:
      type: object
      properties:
        error: { type: string, enum: [dsl_managed, adoption_disabled, not_adopted] }
        message: { type: string }

    ApiClient:
      type: object
      properties:
        client_id: { type: string }
        name: { type: string }
        scopes: { type: array, items: { type: string } }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }

paths:
  /health:
    get:
      summary: Health check
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }

  /version:
    get:
      summary: Build and environment metadata
      description: |
        Public (no auth) so pre-login UI can render a version chip and an
        environment badge. All four fields are non-sensitive: Cargo version,
        short git SHA, RFC 3339 build timestamp, and a deploy-environment
        label sourced from `CRONIQ_ENV` (defaults to `"unknown"`).
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionResponse" }

  /v1/auth/login:
    post:
      summary: Login with username and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200":
          description: JWT tokens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "401": { description: Invalid credentials }

  /v1/auth/refresh:
    post:
      summary: Refresh access token
      security: []
      requestBody:
        content:
          application/json:
            schema:
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }

  /v1/auth/logout:
    post:
      summary: Revoke refresh token
      security: []
      requestBody:
        content:
          application/json:
            schema:
              properties:
                refresh_token: { type: string }
      responses:
        "204": { description: Logged out }

  /v1/jobs:
    get:
      summary: List job definitions
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/JobDefinition" }
    post:
      summary: Create or update a job definition
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [job_key]
              properties:
                job_key: { type: string }
                description: { type: string }
                assigned_runner_id: { type: string }
                metadata: { type: object }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobDefinition" }

  /v1/jobs/{job_key}:
    get:
      summary: Get a job definition
      parameters:
        - name: job_key
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobDefinition" }
    delete:
      summary: Delete a job and its triggers
      parameters:
        - name: job_key
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Deleted }

  /v1/jobs/{job_key}/activate:
    post:
      summary: Activate a job
      description: Flips `is_active` to true; the scheduler starts evaluating its triggers again.
      parameters:
        - name: job_key
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobDefinition" }
        "404": { description: Unknown job }

  /v1/jobs/{job_key}/deactivate:
    post:
      summary: Deactivate a job
      description: Flips `is_active` to false; triggers remain but stop firing until re-activated.
      parameters:
        - name: job_key
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobDefinition" }
        "404": { description: Unknown job }

  /v1/jobs/{job_key}/adopt:
    post:
      summary: Adopt a DSL-managed job (and its trigger) into the API store
      description: |
        Copies the Croniqfile job + its synthesized trigger into persistent storage
        with `managed_by="api"`, and inserts a row in `dsl_adoptions` so the loader
        skips this DSL key on subsequent reloads. The newly API-managed trigger is
        also pushed to the live scheduler so the job keeps firing without a reload.

        Requires `policy { dsl_adopt_on_mutate true }` in the Croniqfile — without
        it, returns 409 (`error: adoption_disabled`).
      parameters:
        - name: job_key
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DslJobAdoptResponse" }
        "404": { description: DSL job with that key not found }
        "409":
          description: Policy disabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DslManagedError" }

  /v1/jobs/{job_key}/unadopt:
    post:
      summary: Drop the API copy so the next reload reinstates the DSL job
      description: |
        Removes all `managed_by="api"` triggers belonging to this job, the API
        `JobDefinition`, and the `dsl_adoptions` record. The live scheduler stops
        firing the job until the next reload re-arms the DSL trigger.
      parameters:
        - name: job_key
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Adoption removed; API job + triggers deleted. }
        "409":
          description: Job exists but was not adopted from DSL.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DslManagedError" }

  /v1/schedules:
    get:
      summary: List trigger definitions
      parameters:
        - name: job_key
          in: query
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TriggerDefinition" }
    post:
      summary: Create a trigger
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [job_key]
              properties:
                job_key: { type: string }
                cron_expression: { type: string }
                timezone: { type: string }
                calendar: { type: string }
                window: { type: string }
                enabled: { type: boolean, default: true }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TriggerDefinition" }

  /v1/schedules/{trigger_id}:
    get:
      summary: Get a trigger
      parameters:
        - name: trigger_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TriggerDefinition" }
    put:
      summary: Update an API-managed trigger
      description: |
        Patch the editable fields of an API-managed schedule. Omitted
        fields are preserved. Returns 409 for DSL-managed triggers
        (Croniqfile owns those), 404 if the trigger_id is unknown.
      parameters:
        - name: trigger_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cron_expression: { type: string }
                timezone: { type: string }
                enabled: { type: boolean }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TriggerDefinition" }
        "404": { description: Trigger not found }
        "409": { description: Trigger is DSL-managed and cannot be edited via API }
    delete:
      summary: Delete a trigger
      responses:
        "204": { description: Deleted }

  /v1/runners:
    get:
      summary: List connected runners
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RunnerSummary" }

  /v1/runners/stream:
    get:
      summary: SSE stream of runner presence (snapshot every 5s)
      responses:
        "200":
          description: Server-Sent Events stream
          content:
            text/event-stream: {}

  /v1/runners/{id}:
    delete:
      summary: Deregister a runner
      responses:
        "204": { description: Removed }

  /v1/executions:
    get:
      summary: List executions
      parameters:
        - name: job_key
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string, enum: [queued, claimed, completed, failed, dead, cancelled] }
        - name: limit
          in: query
          schema: { type: integer, default: 100 }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Execution" }

  /v1/executions/{id}/logs:
    get:
      summary: Get execution logs
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    execution_id: { type: string }
                    timestamp: { type: string, format: date-time }
                    level: { type: string }
                    message: { type: string }
                    fields: { type: object }

  /v1/dead-letters:
    get:
      summary: List dead letters
      parameters:
        - name: job_key
          in: query
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DeadLetter" }

  /v1/dead-letters/{id}:
    get:
      summary: Get dead letter details
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeadLetter" }
    delete:
      summary: Delete a dead letter
      responses:
        "204": { description: Deleted }

  /v1/dead-letters/{id}/replay:
    post:
      summary: Replay a dead letter as a new execution
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  execution_id: { type: string }
                  attempt: { type: integer }

  /v1/calendars:
    get:
      summary: List calendars
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CalendarDefinition" }
    post:
      summary: Create a calendar
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalendarDefinition" }

  /v1/calendars/{id}:
    get:
      summary: Get a calendar
      description: |
        Accepts both real UUIDs (API-managed rows) and synthetic `dsl:{name}` IDs
        (Croniqfile-defined calendars synthesized at read time).
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalendarDefinition" }
        "404": { description: Unknown calendar }
    put:
      summary: Update a calendar
      description: |
        Refuses DSL-managed calendars (409 with `error: dsl_managed`). To take
        ownership, call `POST /v1/calendars/dsl:{name}/adopt` first.
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalendarDefinition" }
        "409":
          description: DSL-managed; mutation refused.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DslManagedError" }
    delete:
      summary: Delete a calendar
      description: Refuses DSL-managed calendars (409). Adopt first if you want to remove it.
      responses:
        "204": { description: Deleted }
        "409":
          description: DSL-managed; mutation refused.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DslManagedError" }

  /v1/calendars/{id}/adopt:
    post:
      summary: Adopt a DSL-managed calendar into the API store
      description: |
        Copies the Croniqfile calendar named in the synthetic ID `dsl:{name}` into the
        persistent store with a fresh UUID and `managed_by="api"`, and inserts a row
        in `dsl_adoptions` so the loader skips this DSL key on subsequent reloads.
        Reversible via `/unadopt`.

        Requires `policy { dsl_adopt_on_mutate true }` in the Croniqfile — without
        it, returns 409 (`error: adoption_disabled`).
      parameters:
        - name: id
          in: path
          required: true
          description: Synthetic DSL ID (`dsl:{name}`).
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DslAdoptResponse" }
        "400":
          description: ID does not have the `dsl:` prefix.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DslManagedError" }
        "404": { description: DSL calendar with that name not found }
        "409":
          description: Policy disabled or other adoption refusal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DslManagedError" }

  /v1/calendars/{id}/unadopt:
    post:
      summary: Drop an adopted calendar so the next reload reinstates the DSL definition
      description: |
        Removes the API-managed row plus the `dsl_adoptions` record for the calendar.
        On the next config reload the Croniqfile definition surfaces again with
        `managed_by="dsl"`.
      parameters:
        - name: id
          in: path
          required: true
          description: API UUID of the calendar (returned from `/adopt`).
          schema: { type: string }
      responses:
        "204": { description: Adoption removed; API copy deleted. }
        "400":
          description: Caller passed a `dsl:` synthetic ID instead of the API UUID.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DslManagedError" }
        "404": { description: Calendar not found }
        "409":
          description: Calendar exists but was not adopted from DSL.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DslManagedError" }

  /v1/dashboard/forecast:
    get:
      summary: Schedule forecast with time buckets
      parameters:
        - name: window_minutes
          in: query
          schema: { type: integer, default: 60, maximum: 240 }
        - name: bucket_minutes
          in: query
          schema: { type: integer, default: 5 }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  window_minutes: { type: integer }
                  bucket_minutes: { type: integer }
                  buckets:
                    type: array
                    items:
                      type: object
                      properties:
                        start: { type: string, format: date-time }
                        end: { type: string, format: date-time }
                        count: { type: integer }
                        jobs: { type: array, items: { type: string } }

  /v1/work/poll:
    post:
      summary: Poll for work (long-poll supported)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [runner_id]
              properties:
                runner_id: { type: string }
                capabilities: { type: array, items: { type: string } }
                max_inflight: { type: integer, default: 1 }
                inflight: { type: array, items: { type: string } }
                instance_id: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  work: { type: array }
                  cancel: { type: array }
        "409": { description: Runner instance conflict }

  /v1/work/ack:
    post:
      summary: Acknowledge execution completion
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [runner_id, execution_id, status]
              properties:
                runner_id: { type: string }
                execution_id: { type: string }
                status: { type: string, enum: [success, failure] }
                error: { type: string }
                duration_ms: { type: integer }
                attempt: { type: integer }
      responses:
        "200": { description: Acknowledged }

  /v1/work/renew:
    post:
      summary: Renew a work item lease
      requestBody:
        content:
          application/json:
            schema:
              properties:
                runner_id: { type: string }
                execution_id: { type: string }
      responses:
        "200": { description: Renewed }

  /v1/work/{execution_id}/events:
    post:
      summary: Push structured log events
      parameters:
        - name: execution_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  level: { type: string }
                  message: { type: string }
                  fields: { type: object }
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  accepted: { type: integer }

  /v1/api-clients:
    get:
      summary: List API clients
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApiClient" }
    post:
      summary: Create an API client
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: { type: string }
                scopes: { type: array, items: { type: string } }
      responses:
        "201":
          content:
            application/json:
              schema:
                type: object
                properties:
                  client_id: { type: string }
                  name: { type: string }
                  scopes: { type: array, items: { type: string } }

  /v1/api-clients/{id}:
    delete:
      summary: Delete an API client and its keys
      responses:
        "204": { description: Deleted }

  /v1/api-clients/{id}/tokens:
    post:
      summary: Issue a token for an API client
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }

  /v1/api-keys:
    post:
      summary: Generate a new API key
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [client_id]
              properties:
                client_id: { type: string }
      responses:
        "201":
          content:
            application/json:
              schema:
                type: object
                properties:
                  raw_key: { type: string, description: "Shown once only" }
                  key_id: { type: string }
                  key_prefix: { type: string }
                  client_id: { type: string }

  /v1/api-keys/{id}:
    delete:
      summary: Revoke an API key
      responses:
        "204": { description: Revoked }

  /v1/jobs/register:
    post:
      summary: Register a job from a runner or API client
      description: |
        Creates or updates a job + trigger. Collision policy:
        - If a Croniqfile (DSL) job with the same key exists: skip (DSL precedence)
        - If a runner/API job exists: update
        - Otherwise: create new
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [job_key, schedule]
              properties:
                job_key: { type: string, description: "e.g. billing:invoice" }
                schedule: { type: string, description: "Interval: 5m, 1h, 300, or */5 * * * *" }
                timezone: { type: string }
                timeout: { type: string }
                runner_id: { type: string }
                capabilities: { type: array, items: { type: string } }
                description: { type: string }
      responses:
        "201":
          description: Job created
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_key: { type: string }
                  trigger_id: { type: string }
                  status: { type: string, enum: [registered, skipped_dsl_precedence] }
        "200":
          description: Job updated (already existed)

  /v1/trigger:
    post:
      summary: Trigger a job immediately
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [job_key]
              properties:
                job_key: { type: string }
                require: { type: array, items: { type: string } }
                prefer: { type: array, items: { type: string } }
                metadata: { type: object }
                timeout: { type: string, default: "5m" }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  execution_id: { type: string }
                  queued: { type: integer }

  /v1/admin/reload-config:
    post:
      summary: Hot-reload the Croniqfile
      description: >
        Re-reads the Croniqfile, merges API-registered triggers (DSL
        precedence) and reconciles the live scheduler. Use `?dry_run=true`
        to validate and return a diff without applying. Requires the
        `admin` scope.
      parameters:
        - name: dry_run
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Reload applied (or validated when dry_run=true)
          content:
            application/json:
              schema:
                type: object
                properties:
                  applied: { type: boolean }
                  dry_run: { type: boolean }
                  diff:
                    type: object
                    properties:
                      added: { type: array, items: { type: string } }
                      removed: { type: array, items: { type: string } }
                      changed: { type: array, items: { type: string } }
                      total: { type: integer }
        "403": { description: Missing admin scope }
        "422":
          description: Validation or file-read error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, enum: [read_error, validation_error, store_error] }
                  message: { type: string }
                  line: { type: integer, nullable: true }
                  column: { type: integer, nullable: true }
        "500": { description: Apply failed after successful validation }
        "503": { description: Server not configured for reload (missing store or config path) }

name: Python SDK CI

# Branch-protection contract:
# Aggregator job `Python SDK CI required` at the bottom of this file is the
# single required status check. Adding it once gates schema + build +
# conformance + pack-smoke without naming individual jobs in the rule.

on:
  push:
    branches: [main]
    paths:
      - 'sdks/python/**'
      - 'sdks/conformance/**'
      - 'openapi.yaml'
      - '.github/workflows/python-sdk-ci.yml'
  pull_request:
    # NB: No `paths-ignore` for the same reason as ci.yml — once a job here
    # becomes a required status check, path-based skipping makes the
    # requirement unsatisfiable.
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Opt into Node 24 for JavaScript actions ahead of the 2026-06-02
  # default switch, silencing the Node 20 deprecation warnings from
  # setup-python/checkout/upload-artifact/etc. Matches the env block in
  # ci.yml, dotnet-sdk-ci.yml, go-sdk-ci.yml, and release.yml.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  schema:
    name: Conformance YAML schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.0
        with:
          python-version: '3.12'
      - name: Install check-jsonschema
        run: pip install --user check-jsonschema==0.37.2
      - name: Validate every case against case-schema.json
        # Same single source of truth as the .NET SDK pipeline — catches
        # typos / unknown keys / missing required fields before any binding
        # tries to deserialise them.
        run: |
          check-jsonschema --verbose \
            --schemafile sdks/conformance/schema/case-schema.json \
            sdks/conformance/cases/*.yaml

  build:
    name: Lint, type-check, test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: sdks/python
    strategy:
      fail-fast: false
      matrix:
        # 3.11 = minimum supported (TaskGroup / tomllib); 3.12 + 3.13 cover
        # the practical install base. Linux only for the full matrix —
        # macOS / Windows would only re-exercise the same pure-Python code.
        python-version: ['3.11', '3.12', '3.13']
        os: [ubuntu-latest]
        include:
          # One macOS smoke run on the default supported version, so
          # platform-specific path / file-state bugs surface here, not in a
          # downstream user's local env.
          - python-version: '3.12'
            os: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: sdks/python/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,otel]" pytest-timeout
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy
      - name: Pytest (unit + conformance)
        # --timeout protects against an SDK regression that hangs the
        # poll loop forever — a hung pytest would otherwise burn the
        # full job timeout (10 min default).
        run: pytest --timeout=30 -v

  pack-smoke:
    name: Pack smoke
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.0
        with:
          python-version: '3.12'
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      - name: Build sdist + wheel
        run: python -m build
      - name: Twine check
        # Validates package metadata (long-description rendering, classifier
        # validity, etc.) so we don't push a broken release.
        run: twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: croniq-runner-dist
          path: sdks/python/dist/
          if-no-files-found: error
          retention-days: 7

  required:
    # Aggregator job for branch protection — see dotnet-sdk-ci.yml for the
    # full rationale. Add ONE check (`Python SDK CI required`) to the
    # protected branch and the rule transitively gates schema, build,
    # pack-smoke.
    name: Python SDK CI required
    if: always()
    runs-on: ubuntu-latest
    needs: [schema, build, pack-smoke]
    steps:
      - name: Fail if any required job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "::error::A required job did not succeed:"
          echo "  schema:     ${{ needs.schema.result }}"
          echo "  build:      ${{ needs.build.result }}"
          echo "  pack-smoke: ${{ needs.pack-smoke.result }}"
          exit 1
      - name: All required jobs passed
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: echo "✓ schema, build, pack-smoke all succeeded"

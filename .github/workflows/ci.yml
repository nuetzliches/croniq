name: CI

on:
  push:
    branches: [main]
    # Skip the workflow when only landing-page / docs / markdown files
    # change. The site is published by the dedicated `Deploy site`
    # workflow (see pages.yml) and never bundled into the Docker
    # image, so a 60-min multi-arch build for a one-line copy tweak is
    # pure waste.
    paths-ignore:
      - 'site/**'
      - 'docs/**'
      - '**.md'
      - 'LICENSE*'
  pull_request:
    branches: [main]
    # NB: no `paths-ignore` on the PR trigger — `Rust (build + test +
    # clippy)` and `UI (build + typecheck)` are required status checks
    # under main's branch protection. If we skipped them on docs-only
    # PRs, the rule's "must pass" condition becomes unsatisfiable and
    # the PR can never merge without an admin override (see #98 for the
    # incident that motivated lifting this filter). Cargo/npm caches
    # make the no-op rebuild cheap enough to not be worth chasing.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  REGISTRY_IMAGE: ghcr.io/nuetzliches/croniq
  # Opt into Node 24 for JavaScript actions ahead of the 2026-06-02
  # default switch, silencing the Node 20 deprecation warnings from
  # checkout/upload-artifact/docker/login-action/etc.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  rust:
    name: Rust (build + test + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Build (with otlp — matches shipped artefacts)
        # Default Cargo feature stays off so a plain `cargo build` from a
        # checkout doesn't pull the opentelemetry stack. But the official
        # image + release binaries are built with `--features
        # croniq-server/otlp` (see Dockerfile and release.yml), so CI must
        # exercise that path on every push to catch breakage in the
        # otlp-gated code before a release.
        run: cargo build --workspace --features croniq-server/otlp
      - name: Build (no-default-features — guards off-path)
        # Counterpart to the otlp build above. The off-path has
        # `#[cfg(not(feature = "otlp"))]` branches in
        # crates/croniq-server/src/telemetry.rs that would silently bitrot
        # if only the otlp build is exercised. Server crate only — the
        # workspace's other crates don't gate on this feature.
        run: cargo build -p croniq-server
      - name: Test (with otlp)
        run: cargo test --workspace --features croniq-server/otlp
      - name: Test (no-default-features, server only)
        # telemetry.rs has #[cfg(not(feature = "otlp"))]-only tests
        # (e.g. decide_stderr_only_when_feature_off_even_if_endpoint_set)
        # that the otlp build above never compiles. Run the server's own
        # test suite in the no-feature config to keep that path exercised.
        run: cargo test -p croniq-server
      - name: Clippy
        # `--all-targets` covers tests + benches too. Without it, latent
        # `unused_must_use` and similar lints accumulate quietly in
        # test-only code (we hit ~25 of them on first sweep).
        run: cargo clippy --workspace --all-targets --features croniq-server/otlp -- -D warnings

  ui:
    name: UI (build + typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # The UI build needs the wasm bridge from `crates/croniq-config-wasm`.
      # We install the toolchain + wasm-pack here rather than splitting it
      # into a separate matrix job so `npm run build`'s `prebuild` hook
      # (`bash scripts/build-wasm.sh`) can produce `ui/src/lib/wasm/`
      # in-place without needing an artefact upload step.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # Scope the cache to just the wasm-relevant crates so the rust
          # job's full-workspace cache stays cleanly separated.
          workspaces: ". -> target"
          shared-key: wasm
      - name: Install wasm-pack
        run: |
          if ! command -v wasm-pack >/dev/null 2>&1; then
            curl -fsSL https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
          fi
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci || npm install
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Check wasm bundle size budget
        # Soft 250 KB gzipped ceiling — we ship at ~70 KB today, so this
        # only fires if a future change accidentally pulls a heavy dep
        # (chrono-tz, regex, etc.) back into the wasm path.
        run: |
          size=$(gzip -9c src/lib/wasm/croniq_config_wasm_bg.wasm | wc -c)
          echo "WASM bridge: $size bytes gzipped"
          if [ "$size" -gt 256000 ]; then
            echo "::error::WASM bundle exceeds 250 KB gzipped budget ($size bytes)"
            exit 1
          fi

  docker:
    # Build each architecture on a native runner instead of QEMU-emulating
    # arm64 on amd64. The previous single-runner setup spent ~50 of its 60
    # minutes inside QEMU compiling Rust deps for arm64 — native runners
    # cut that to ~10 min per arch, run in parallel, and use independent
    # GHA caches.
    #
    # Pattern follows docker/build-push-action's official multi-platform
    # recipe: each matrix job pushes the per-arch image *by digest* (no
    # tag), and the merge job below stitches the digests into a single
    # manifest list under the human-readable tags.
    name: Docker build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: [rust, ui]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Derive artefact-safe platform name
        id: plat
        # `linux/amd64` → `linux-amd64`, used as cache scope + artefact
        # name. Slashes break both, so we normalise once here.
        run: echo "name=${{ matrix.platform }}" | tr '/' '-' >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # OCI labels link the container to this (public) repo so new
          # package names inherit the repo's visibility on first
          # creation. See the note in release.yml for the full rationale.
          labels: |
            org.opencontainers.image.source=https://github.com/nuetzliches/croniq
            org.opencontainers.image.url=https://github.com/nuetzliches/croniq
            org.opencontainers.image.title=croniq
            org.opencontainers.image.description=Distributed cron that just works. Single binary. SQLite default. Production-ready retries.
            org.opencontainers.image.licenses=MIT OR Apache-2.0
            org.opencontainers.image.revision=${{ github.sha }}
          # Push by digest only — no tag yet. The merge job creates the
          # manifest list under :latest and :<sha> once both arches are
          # uploaded.
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Per-arch cache scopes so amd64 and arm64 don't fight over
          # the same cache slot.
          cache-from: type=gha,scope=docker-${{ steps.plat.outputs.name }}
          cache-to: type=gha,mode=max,scope=docker-${{ steps.plat.outputs.name }}
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ steps.plat.outputs.name }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-merge:
    # Stitches the per-arch digests from the matrix above into a single
    # multi-arch manifest list. After this runs, `docker pull
    # ghcr.io/nuetzliches/croniq:latest` resolves to the right image
    # for whatever arch the host is on.
    name: Docker manifest merge
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            --tag ${{ env.REGISTRY_IMAGE }}:latest \
            --tag ${{ env.REGISTRY_IMAGE }}:${{ github.sha }} \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)
      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ github.sha }}

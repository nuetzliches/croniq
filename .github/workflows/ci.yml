name: CI

on:
  push:
    branches: [main]
    # Skip the workflow when only landing-page / docs / markdown files
    # change. The site is published by the dedicated `Deploy site`
    # workflow (see pages.yml) and never bundled into the Docker
    # image, so a 60-min multi-arch build for a one-line copy tweak is
    # pure waste.
    paths-ignore:
      - 'site/**'
      - 'docs/**'
      - '**.md'
      - 'LICENSE*'
  pull_request:
    branches: [main]
    # NB: no `paths-ignore` on the PR trigger — `Rust (build + test +
    # clippy)` and `UI (build + typecheck)` are required status checks
    # under main's branch protection. If we skipped them on docs-only
    # PRs, the rule's "must pass" condition becomes unsatisfiable and
    # the PR can never merge without an admin override (see #98 for the
    # incident that motivated lifting this filter). Cargo/npm caches
    # make the no-op rebuild cheap enough to not be worth chasing.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  REGISTRY_IMAGE: ghcr.io/nuetzliches/croniq
  # Opt into Node 24 for JavaScript actions ahead of the 2026-06-02
  # default switch, silencing the Node 20 deprecation warnings from
  # checkout/upload-artifact/docker/login-action/etc.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  rust:
    name: Rust (build + test + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Build (with otlp — matches shipped artefacts)
        # Default Cargo feature stays off so a plain `cargo build` from a
        # checkout doesn't pull the opentelemetry stack. But the official
        # image + release binaries are built with `--features
        # croniq-server/otlp` (see Dockerfile and release.yml), so CI must
        # exercise that path on every push to catch breakage in the
        # otlp-gated code before a release.
        run: cargo build --workspace --features croniq-server/otlp
      - name: Build (no-default-features — guards off-path)
        # Counterpart to the otlp build above. The off-path has
        # `#[cfg(not(feature = "otlp"))]` branches in
        # crates/croniq-server/src/telemetry.rs that would silently bitrot
        # if only the otlp build is exercised. Server crate only — the
        # workspace's other crates don't gate on this feature.
        run: cargo build -p croniq-server
      - name: Test (with otlp)
        run: cargo test --workspace --features croniq-server/otlp
      - name: Test (no-default-features, server only)
        # telemetry.rs has #[cfg(not(feature = "otlp"))]-only tests
        # (e.g. decide_stderr_only_when_feature_off_even_if_endpoint_set)
        # that the otlp build above never compiles. Run the server's own
        # test suite in the no-feature config to keep that path exercised.
        run: cargo test -p croniq-server
      - name: Clippy
        # `--all-targets` covers tests + benches too. Without it, latent
        # `unused_must_use` and similar lints accumulate quietly in
        # test-only code (we hit ~25 of them on first sweep).
        run: cargo clippy --workspace --all-targets --features croniq-server/otlp -- -D warnings

  postgres:
    # The Postgres store backend lives behind the off-by-default
    # `croniq-store/postgres` feature, which the `rust` job above never
    # enables. That blind spot let it rot silently: `PgStore` fell 7 store
    # traits behind SQLite and stopped compiling entirely, undetected
    # (#298). This job closes the gap. A compile + clippy gate alone would
    # catch missing methods, but the SQL strings are opaque to the compiler
    # — reserved-word collisions (`window`), type mismatches, wrong bindings
    # only surface at runtime — so we also run the integration test against a
    # real Postgres service container.
    name: Store (Postgres backend)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: croniq
          POSTGRES_PASSWORD: croniq
          POSTGRES_DB: croniq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U croniq"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # Own cache scope so the postgres-feature artefacts don't churn the
          # main `rust` job's cache.
          shared-key: postgres
      - name: Build (--features postgres)
        # `--all-targets` also compiles the integration test binary.
        run: cargo build -p croniq-store --features postgres --all-targets
      - name: Clippy (--features postgres)
        # The main clippy pass runs with `croniq-server/otlp`, which never
        # turns on the store's postgres feature, so postgres-gated lints go
        # unchecked there. Guard them here.
        run: cargo clippy -p croniq-store --features postgres --all-targets -- -D warnings
      - name: Test (--features postgres against service Postgres)
        # `CRONIQ_TEST_PG_URL` switches the integration test from skip to
        # run — it drives every method of the 7 traits so runtime SQL bugs
        # fail CI.
        env:
          CRONIQ_TEST_PG_URL: postgres://croniq:croniq@localhost:5432/croniq
        run: cargo test -p croniq-store --features postgres

  server-postgres:
    # End-to-end check that croniq-server actually *boots and serves* on a
    # PostgreSQL backend. The `postgres` job above only exercises croniq-store
    # in isolation, outside any async runtime. The server drives the store from
    # inside its `#[tokio::main]` runtime, which is exactly where the
    # synchronous postgres driver used to panic ("Cannot start a runtime from
    # within a runtime"). Boot performs many store writes/reads/transactions on
    # the PgStoreHandle actor *before* the HTTP listener binds, so a `/health`
    # 200 proves the actor fix holds under a real boot.
    name: Server (Postgres backend, e2e)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: croniq
          POSTGRES_PASSWORD: croniq
          POSTGRES_DB: croniq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U croniq"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # Own cache scope so the server+postgres artefacts don't churn the
          # main `rust` job's cache (which never enables the postgres feature).
          shared-key: server-postgres
      - name: Build croniq-server (--features postgres)
        run: cargo build -p croniq-server --features postgres --bin croniq-server
      - name: Clippy (--features postgres)
        # The main clippy pass runs with `croniq-server/otlp`, which never turns
        # on the postgres feature, so postgres-gated lints go unchecked there.
        run: cargo clippy -p croniq-server --features postgres --lib --bins -- -D warnings
      - name: Boot server on Postgres and probe /health
        env:
          # Overrides the Croniqfile's `db sqlite`; env wins (resolve_db_spec).
          CRONIQ_DB: postgres://croniq:croniq@localhost:5432/croniq
          # Provided so the boot path never needs to touch the data dir for a
          # generated jwt.secret.
          CRONIQ_JWT_SECRET: ci-e2e-secret
          RUST_LOG: info
        run: |
          set -euo pipefail
          # Minimal, valid config — a server block, no jobs. Boot alone drives
          # the store hard (API-key reconcile writes, trigger-state restore,
          # adoption/override reads, queued-execution restore) on the actor.
          cat > /tmp/Croniqfile <<'EOF'
          server {
            listen :4000
            db sqlite
          }
          EOF
          mkdir -p ./.data
          ./target/debug/croniq-server \
            --config /tmp/Croniqfile --listen :4000 --data-dir ./.data \
            > server.log 2>&1 &
          SERVER_PID=$!
          # Always stop the server, even on failure.
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          ok=""
          for _ in $(seq 1 40); do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "::error::croniq-server exited during boot"
              break
            fi
            code=$(curl -fsS -o /tmp/health.json -w '%{http_code}' \
              http://127.0.0.1:4000/health || true)
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 1
          done

          echo "----- server.log -----"; cat server.log || true
          if [ -z "$ok" ]; then
            echo "::error::/health did not return 200 within 40s (server did not boot+serve on Postgres)"
            exit 1
          fi
          echo "----- /health -----"; cat /tmp/health.json; echo
          # Sanity: the sync driver panic would print a Rust panic line; the
          # server must never have fallen back to SQLite either.
          if grep -qi 'panicked' server.log; then
            echo "::error::server log contains a panic"; exit 1
          fi
          if grep -q 'backend="sqlite"' server.log; then
            echo "::error::server opened SQLite despite a postgres:// DSN"; exit 1
          fi

  ui:
    name: UI (build + typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # The UI build needs the wasm bridge from `crates/croniq-config-wasm`.
      # We install the toolchain + wasm-pack here rather than splitting it
      # into a separate matrix job so `npm run build`'s `prebuild` hook
      # (`bash scripts/build-wasm.sh`) can produce `ui/src/lib/wasm/`
      # in-place without needing an artefact upload step.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # Scope the cache to just the wasm-relevant crates so the rust
          # job's full-workspace cache stays cleanly separated.
          workspaces: ". -> target"
          shared-key: wasm
      - name: Install wasm-pack
        run: |
          if ! command -v wasm-pack >/dev/null 2>&1; then
            curl -fsSL https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
          fi
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci || npm install
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Check wasm bundle size budget
        # Soft 250 KB gzipped ceiling — we ship at ~70 KB today, so this
        # only fires if a future change accidentally pulls a heavy dep
        # (chrono-tz, regex, etc.) back into the wasm path.
        run: |
          size=$(gzip -9c src/lib/wasm/croniq_config_wasm_bg.wasm | wc -c)
          echo "WASM bridge: $size bytes gzipped"
          if [ "$size" -gt 256000 ]; then
            echo "::error::WASM bundle exceeds 250 KB gzipped budget ($size bytes)"
            exit 1
          fi

  docker:
    # Build each architecture on a native runner instead of QEMU-emulating
    # arm64 on amd64. The previous single-runner setup spent ~50 of its 60
    # minutes inside QEMU compiling Rust deps for arm64 — native runners
    # cut that to ~10 min per arch, run in parallel, and use independent
    # GHA caches.
    #
    # Pattern follows docker/build-push-action's official multi-platform
    # recipe: each matrix job pushes the per-arch image *by digest* (no
    # tag), and the merge job below stitches the digests into a single
    # manifest list under the human-readable tags.
    name: Docker build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: [rust, ui]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Derive artefact-safe platform name
        id: plat
        # `linux/amd64` → `linux-amd64`, used as cache scope + artefact
        # name. Slashes break both, so we normalise once here.
        run: echo "name=${{ matrix.platform }}" | tr '/' '-' >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # OCI labels link the container to this (public) repo so new
          # package names inherit the repo's visibility on first
          # creation. See the note in release.yml for the full rationale.
          labels: |
            org.opencontainers.image.source=https://github.com/nuetzliches/croniq
            org.opencontainers.image.url=https://github.com/nuetzliches/croniq
            org.opencontainers.image.title=croniq
            org.opencontainers.image.description=Distributed cron that just works. Single binary. SQLite default. Production-ready retries.
            org.opencontainers.image.licenses=MIT OR Apache-2.0
            org.opencontainers.image.revision=${{ github.sha }}
          # Push by digest only — no tag yet. The merge job creates the
          # manifest list under :latest and :<sha> once both arches are
          # uploaded.
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Per-arch cache scopes so amd64 and arm64 don't fight over
          # the same cache slot.
          cache-from: type=gha,scope=docker-${{ steps.plat.outputs.name }}
          cache-to: type=gha,mode=max,scope=docker-${{ steps.plat.outputs.name }}
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ steps.plat.outputs.name }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-merge:
    # Stitches the per-arch digests from the matrix above into a single
    # multi-arch manifest list. After this runs, `docker pull
    # ghcr.io/nuetzliches/croniq:latest` resolves to the right image
    # for whatever arch the host is on.
    name: Docker manifest merge
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            --tag ${{ env.REGISTRY_IMAGE }}:latest \
            --tag ${{ env.REGISTRY_IMAGE }}:${{ github.sha }} \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)
      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ github.sha }}

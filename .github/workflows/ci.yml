name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust (build + test + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

  ui:
    name: UI (build + typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci || npm install
      - run: npx tsc --noEmit
      - run: npm run build

  docker:
    name: Docker build + push
    runs-on: ubuntu-latest
    needs: [rust, ui]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # OCI labels link the container to this (public) repo so new package
      # names inherit the repo's visibility on first creation. See the note
      # in release.yml for the full rationale.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/nuetzliches/croniq:latest
            ghcr.io/nuetzliches/croniq:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/nuetzliches/croniq
            org.opencontainers.image.url=https://github.com/nuetzliches/croniq
            org.opencontainers.image.title=croniq
            org.opencontainers.image.description=Distributed cron that just works. Single binary. SQLite default. Production-ready retries.
            org.opencontainers.image.licenses=MIT OR Apache-2.0
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Best-effort visibility flip (idempotent, non-fatal). See release.yml
      # for details.
      - name: Ensure package is public (best-effort)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "/orgs/${{ github.repository_owner }}/packages/container/croniq/visibility" \
            -f visibility=public \
            || echo "::notice::Package visibility could not be set via API. If this is a new package name, flip it manually at https://github.com/orgs/${{ github.repository_owner }}/packages/container/croniq/settings"

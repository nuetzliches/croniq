name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Opt into Node 24 for JavaScript actions ahead of the 2026-06-02
  # default switch, silencing the Node 20 deprecation warnings from
  # checkout/upload-artifact/docker/login-action/etc.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  rust:
    name: Rust (build + test + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        # `--all-targets` covers tests + benches too. Without it, latent
        # `unused_must_use` and similar lints accumulate quietly in
        # test-only code (we hit ~25 of them on first sweep).
        run: cargo clippy --workspace --all-targets -- -D warnings

  ui:
    name: UI (build + typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # The UI build needs the wasm bridge from `crates/croniq-config-wasm`.
      # We install the toolchain + wasm-pack here rather than splitting it
      # into a separate matrix job so `npm run build`'s `prebuild` hook
      # (`bash scripts/build-wasm.sh`) can produce `ui/src/lib/wasm/`
      # in-place without needing an artefact upload step.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # Scope the cache to just the wasm-relevant crates so the rust
          # job's full-workspace cache stays cleanly separated.
          workspaces: ". -> target"
          shared-key: wasm
      - name: Install wasm-pack
        run: |
          if ! command -v wasm-pack >/dev/null 2>&1; then
            curl -fsSL https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci || npm install
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Check wasm bundle size budget
        # Soft 250 KB gzipped ceiling — we ship at ~70 KB today, so this
        # only fires if a future change accidentally pulls a heavy dep
        # (chrono-tz, regex, etc.) back into the wasm path.
        run: |
          size=$(gzip -9c src/lib/wasm/croniq_config_wasm_bg.wasm | wc -c)
          echo "WASM bridge: $size bytes gzipped"
          if [ "$size" -gt 256000 ]; then
            echo "::error::WASM bundle exceeds 250 KB gzipped budget ($size bytes)"
            exit 1
          fi

  docker:
    name: Docker build + push
    runs-on: ubuntu-latest
    needs: [rust, ui]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # OCI labels link the container to this (public) repo so new package
      # names inherit the repo's visibility on first creation. See the note
      # in release.yml for the full rationale.
      - uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/nuetzliches/croniq:latest
            ghcr.io/nuetzliches/croniq:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/nuetzliches/croniq
            org.opencontainers.image.url=https://github.com/nuetzliches/croniq
            org.opencontainers.image.title=croniq
            org.opencontainers.image.description=Distributed cron that just works. Single binary. SQLite default. Production-ready retries.
            org.opencontainers.image.licenses=MIT OR Apache-2.0
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

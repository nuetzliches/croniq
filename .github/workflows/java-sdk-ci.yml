name: Java SDK CI

# Branch-protection contract:
# Aggregator job `Java SDK CI required` at the bottom of this file is the
# single required status check. Adding it once gates schema + build +
# publish-smoke without naming individual jobs in the rule. Same pattern as
# dotnet-sdk-ci.yml and python-sdk-ci.yml.

on:
  push:
    branches: [main]
    paths:
      - 'sdks/java/**'
      - 'sdks/conformance/**'
      - 'openapi.yaml'
      - '.github/workflows/java-sdk-ci.yml'
  pull_request:
    # NB: No `paths-ignore` for the same reason as ci.yml — once a job here
    # becomes a required status check, path-based skipping makes the
    # requirement unsatisfiable.
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  schema:
    name: Conformance YAML schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.0
        with:
          python-version: '3.12'
      - name: Install check-jsonschema
        run: pip install --user check-jsonschema==0.37.2
      - name: Validate every case against case-schema.json
        # Same single source of truth as the dotnet/python/go/ts SDK
        # pipelines — catches typos / unknown keys / missing required
        # fields before any binding tries to deserialise them.
        run: |
          check-jsonschema --verbose \
            --schemafile sdks/conformance/schema/case-schema.json \
            sdks/conformance/cases/*.yaml

  build:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: sdks/java
    strategy:
      fail-fast: false
      matrix:
        # JVM bytecode is platform-independent, so the matrix here is
        # smaller than the .NET one — we just need to catch JDK distribution
        # quirks (path handling, line endings, file locks) on the supported
        # developer platforms. Single JDK version (21) until the real
        # implementation lands and forward-compat across 22/23/24 becomes
        # worth testing.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'
          cache-read-only: ${{ github.event_name != 'push' }}
      - name: Build & test
        # `gradle check` runs compile + test + any verification tasks
        # (will include Spotless once added). Single command keeps the CI
        # signal aligned with `./gradlew check` locally.
        run: gradle check --no-daemon

  publish-smoke:
    # Verifies the publish + signing config compiles without actually
    # uploading to Maven Central. `publishToMavenLocal` exercises the same
    # POM / sources jar / javadoc jar generation that the release pipeline
    # uses, so a broken `mavenPublishing { ... }` block fails here on PR
    # rather than during a tag-triggered release.
    name: Publish smoke (mavenLocal)
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: sdks/java
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'
          cache-read-only: ${{ github.event_name != 'push' }}
      - name: Publish to mavenLocal
        # Pinned version so the smoke matches a real release. Signing is
        # skipped automatically — the Vanniktech plugin only signs when
        # `signingInMemoryKey` is set, and PR runners get no GPG secrets.
        # Signing-correctness is exercised by the release workflow itself.
        run: |
          gradle publishToMavenLocal \
            -Pversion=0.0.0-ci \
            --no-daemon
      - name: Validate published artefacts
        run: |
          M2="$HOME/.m2/repository/io/github/nuetzliches/croniq-runner/0.0.0-ci"
          ls -la "$M2"
          for kind in "" "-sources" "-javadoc"; do
            f="$M2/croniq-runner-0.0.0-ci${kind}.jar"
            if [ ! -f "$f" ]; then
              echo "::error::expected ${f} not found"
              exit 1
            fi
          done
          if [ ! -f "$M2/croniq-runner-0.0.0-ci.pom" ]; then
            echo "::error::POM missing"
            exit 1
          fi
          echo "✓ jar, sources jar, javadoc jar, POM all present"

  required:
    # Aggregator job for branch protection — see dotnet-sdk-ci.yml for the
    # full rationale. Add ONE check (`Java SDK CI required`) to the
    # protected branch and the rule transitively gates schema, build,
    # publish-smoke.
    name: Java SDK CI required
    if: always()
    runs-on: ubuntu-latest
    needs: [schema, build, publish-smoke]
    steps:
      - name: Fail if any required job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "::error::A required job did not succeed:"
          echo "  schema:        ${{ needs.schema.result }}"
          echo "  build:         ${{ needs.build.result }}"
          echo "  publish-smoke: ${{ needs.publish-smoke.result }}"
          exit 1
      - name: All required jobs passed
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: echo "✓ schema, build, publish-smoke all succeeded"

name: Go SDK CI

# Branch-protection contract:
# Mirror of dotnet-sdk-ci.yml. The `Go SDK CI required` aggregator job
# at the bottom is the single required status check; it transitively
# gates schema, build, conformance, and vet.

on:
  push:
    branches: [main]
    paths:
      - 'sdks/go/**'
      - 'sdks/conformance/**'
      - 'openapi.yaml'
      - '.github/workflows/go-sdk-ci.yml'
  pull_request:
    # No `paths-ignore` — `Go SDK CI required` is a required status check
    # so the workflow must always trigger on PRs. Heavy build / vet /
    # staticcheck / conformance jobs short-circuit via the `changes`
    # filter below when nothing relevant changed.
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

env:
  GO_VERSION: '1.25'
  # Opt into Node 24 for JavaScript actions ahead of the 2026-06-02
  # default switch, silencing the Node 20 deprecation warnings from
  # setup-go/checkout/upload-artifact/etc. Matches the env block in
  # ci.yml, dotnet-sdk-ci.yml, and release.yml.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  changes:
    # Detect whether anything in this SDK's relevant paths changed on the
    # PR. Heavy jobs gate on `needs.changes.outputs.go == 'true'` so a
    # server / UI / other-SDK PR skips the Go toolchain entirely.
    name: Detect path changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            go:
              - 'sdks/go/**'
              - 'sdks/conformance/**'
              - 'openapi.yaml'
              - '.github/workflows/go-sdk-ci.yml'

  schema:
    name: Conformance YAML schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install check-jsonschema
        run: pip install --user check-jsonschema==0.37.2
      - name: Validate every case against case-schema.json
        run: |
          check-jsonschema --verbose \
            --schemafile sdks/conformance/schema/case-schema.json \
            sdks/conformance/cases/*.yaml
      - name: Validate every trigger case against trigger-case-schema.json
        run: |
          check-jsonschema --verbose \
            --schemafile sdks/conformance/schema/trigger-case-schema.json \
            sdks/conformance/cases-trigger/*.yaml

  build:
    name: Build, vet, test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            sdks/go/go.sum
            sdks/go/otel/go.sum

      - name: go vet (core)
        working-directory: sdks/go
        run: go vet ./...

      - name: go vet (otel)
        working-directory: sdks/go/otel
        run: go vet ./...

      - name: go build (core)
        working-directory: sdks/go
        run: go build ./...

      - name: go build (otel)
        working-directory: sdks/go/otel
        run: go build ./...

      - name: go test (core, excluding conformance)
        working-directory: sdks/go
        # Run the fast unit tests separately from the conformance suite
        # so a long conformance hang doesn't mask a unit-test failure.
        run: go test -race -timeout 60s $(go list ./... | grep -v /conformance)

      - name: go test (otel)
        working-directory: sdks/go/otel
        run: go test -race -timeout 60s ./...

  staticcheck:
    name: staticcheck
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            sdks/go/go.sum
            sdks/go/otel/go.sum
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
      - name: Run staticcheck (core)
        working-directory: sdks/go
        run: staticcheck ./...
      - name: Run staticcheck (otel)
        working-directory: sdks/go/otel
        run: staticcheck ./...

  conformance:
    name: Conformance suite
    runs-on: ubuntu-latest
    needs: [schema, changes]
    if: needs.changes.outputs.go == 'true'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: sdks/go/go.sum
      - name: Run conformance suite
        working-directory: sdks/go
        run: go test -race -timeout 120s ./conformance/... -v

  required:
    # Aggregator for branch-protection. Add ONE check to the protected
    # branch's required status list — `Go SDK CI required` — and the
    # rule transitively gates schema, build, staticcheck, conformance.
    name: Go SDK CI required
    if: always()
    runs-on: ubuntu-latest
    needs: [changes, schema, build, staticcheck, conformance]
    steps:
      - name: Fail if any required job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "::error::A required job did not succeed:"
          echo "  changes:      ${{ needs.changes.result }}"
          echo "  schema:       ${{ needs.schema.result }}"
          echo "  build:        ${{ needs.build.result }}"
          echo "  staticcheck:  ${{ needs.staticcheck.result }}"
          echo "  conformance:  ${{ needs.conformance.result }}"
          exit 1
      - name: All required jobs passed (or skipped because nothing relevant changed)
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: echo "Aggregator OK - all dependent jobs succeeded or were skipped (path filter)"

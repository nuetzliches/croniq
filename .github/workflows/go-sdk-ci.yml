name: Go SDK CI

# Branch-protection contract:
# Mirror of dotnet-sdk-ci.yml. The `Go SDK CI required` aggregator job
# at the bottom is the single required status check; it transitively
# gates schema, build, conformance, and vet.

on:
  push:
    branches: [main]
    paths:
      - 'sdks/go/**'
      - 'sdks/conformance/**'
      - 'openapi.yaml'
      - '.github/workflows/go-sdk-ci.yml'
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GO_VERSION: '1.25'
  # Opt into Node 24 for JavaScript actions ahead of the 2026-06-02
  # default switch, silencing the Node 20 deprecation warnings from
  # setup-go/checkout/upload-artifact/etc. Matches the env block in
  # ci.yml, dotnet-sdk-ci.yml, and release.yml.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  schema:
    name: Conformance YAML schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install check-jsonschema
        run: pip install --user check-jsonschema==0.37.2
      - name: Validate every case against case-schema.json
        run: |
          check-jsonschema --verbose \
            --schemafile sdks/conformance/schema/case-schema.json \
            sdks/conformance/cases/*.yaml

  build:
    name: Build, vet, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            sdks/go/go.sum
            sdks/go/otel/go.sum

      - name: go vet (core)
        working-directory: sdks/go
        run: go vet ./...

      - name: go vet (otel)
        working-directory: sdks/go/otel
        run: go vet ./...

      - name: go build (core)
        working-directory: sdks/go
        run: go build ./...

      - name: go build (otel)
        working-directory: sdks/go/otel
        run: go build ./...

      - name: go test (core, excluding conformance)
        working-directory: sdks/go
        # Run the fast unit tests separately from the conformance suite
        # so a long conformance hang doesn't mask a unit-test failure.
        run: go test -race -timeout 60s $(go list ./... | grep -v /conformance)

      - name: go test (otel)
        working-directory: sdks/go/otel
        run: go test -race -timeout 60s ./...

  staticcheck:
    name: staticcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            sdks/go/go.sum
            sdks/go/otel/go.sum
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
      - name: Run staticcheck (core)
        working-directory: sdks/go
        run: staticcheck ./...
      - name: Run staticcheck (otel)
        working-directory: sdks/go/otel
        run: staticcheck ./...

  conformance:
    name: Conformance suite
    runs-on: ubuntu-latest
    needs: [schema]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: sdks/go/go.sum
      - name: Run conformance suite
        working-directory: sdks/go
        run: go test -race -timeout 120s ./conformance/... -v

  required:
    # Aggregator for branch-protection. Add ONE check to the protected
    # branch's required status list — `Go SDK CI required` — and the
    # rule transitively gates schema, build, staticcheck, conformance.
    name: Go SDK CI required
    if: always()
    runs-on: ubuntu-latest
    needs: [schema, build, staticcheck, conformance]
    steps:
      - name: Fail if any required job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "::error::A required job did not succeed:"
          echo "  schema:       ${{ needs.schema.result }}"
          echo "  build:        ${{ needs.build.result }}"
          echo "  staticcheck:  ${{ needs.staticcheck.result }}"
          echo "  conformance:  ${{ needs.conformance.result }}"
          exit 1
      - name: All required jobs passed
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: echo "schema, build, staticcheck, conformance all succeeded"

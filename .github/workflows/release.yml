name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  # Opt into Node 24 for JavaScript actions ahead of the 2026-06-02
  # default switch, silencing the Node 20 deprecation warnings from
  # checkout/upload-artifact/docker/login-action/etc.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build release binaries
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.target }} \
            --bin croniq-server --bin croniq --bin croniq-mcp --bin croniq-demo-runner

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/croniq-server dist/
          cp target/${{ matrix.target }}/release/croniq dist/
          cp target/${{ matrix.target }}/release/croniq-mcp dist/
          cp target/${{ matrix.target }}/release/croniq-demo-runner dist/
          cp README.md LICENSE-MIT LICENSE-APACHE dist/
          cd dist && tar czf ../croniq-${{ matrix.target }}.tar.gz *

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target/${{ matrix.target }}/release/croniq-server.exe" dist/
          Copy-Item "target/${{ matrix.target }}/release/croniq.exe" dist/
          Copy-Item "target/${{ matrix.target }}/release/croniq-mcp.exe" dist/
          Copy-Item "target/${{ matrix.target }}/release/croniq-demo-runner.exe" dist/
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE dist/
          Compress-Archive -Path dist/* -DestinationPath "croniq-${{ matrix.target }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: croniq-${{ matrix.target }}
          path: |
            croniq-${{ matrix.target }}.tar.gz
            croniq-${{ matrix.target }}.zip

  docker:
    name: Docker release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      # OCI labels link the container to this (public) repo. When a fresh
      # package name is pushed for the first time, GitHub uses this link
      # to inherit the repo's visibility — so new packages default to
      # public without a manual flip in Package Settings.
      #
      # Existing packages keep whatever visibility they had; the current
      # croniq package was flipped once manually after the initial private
      # default and stays public across pushes. There is no public REST
      # or GraphQL API to change visibility programmatically (as of 2026),
      # so the one-time manual flip per package name is unavoidable.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/nuetzliches/croniq:latest
            ghcr.io/nuetzliches/croniq:${{ steps.version.outputs.version }}
            ghcr.io/nuetzliches/croniq:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/nuetzliches/croniq
            org.opencontainers.image.url=https://github.com/nuetzliches/croniq
            org.opencontainers.image.title=croniq
            org.opencontainers.image.description=Distributed cron that just works. Single binary. SQLite default. Production-ready retries.
            org.opencontainers.image.licenses=MIT OR Apache-2.0
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build, docker]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: croniq-*
          path: artifacts
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip

  homebrew:
    name: Update Homebrew tap
    runs-on: ubuntu-latest
    needs: release
    # Requires a PAT with write access to nuetzliches/homebrew-tap stored
    # as the secret HOMEBREW_TAP_TOKEN.
    # Job-level env lifts the secret into the env context so the push step's
    # `if:` can skip cleanly when the token isn't configured — step-level
    # `if:` cannot reference `secrets.*` directly (GH context-availability).
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: croniq-*
          path: artifacts
      - name: Compute SHA256s and update formula
        env:
          # Python reads these via os.environ so the single-quoted heredoc
          # below stays literal (no shell interpolation surprises).
          SHA_AARCH64_DARWIN_FILE: artifacts/croniq-aarch64-apple-darwin/croniq-aarch64-apple-darwin.tar.gz
          SHA_X86_64_DARWIN_FILE: artifacts/croniq-x86_64-apple-darwin/croniq-x86_64-apple-darwin.tar.gz
          SHA_AARCH64_LINUX_FILE: artifacts/croniq-aarch64-unknown-linux-gnu/croniq-aarch64-unknown-linux-gnu.tar.gz
          SHA_X86_64_LINUX_FILE: artifacts/croniq-x86_64-unknown-linux-gnu/croniq-x86_64-unknown-linux-gnu.tar.gz
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"

          SHA_AARCH64_DARWIN=$(sha256sum "$SHA_AARCH64_DARWIN_FILE" | awk '{print $1}')
          SHA_X86_64_DARWIN=$(sha256sum "$SHA_X86_64_DARWIN_FILE"  | awk '{print $1}')
          SHA_AARCH64_LINUX=$(sha256sum "$SHA_AARCH64_LINUX_FILE"  | awk '{print $1}')
          SHA_X86_64_LINUX=$(sha256sum "$SHA_X86_64_LINUX_FILE"    | awk '{print $1}')
          export SHA_AARCH64_DARWIN SHA_X86_64_DARWIN SHA_AARCH64_LINUX SHA_X86_64_LINUX

          sed -i \
            -e "s/version \".*\"/version \"${VERSION}\"/" \
            Formula/croniq.rb

          # Replace each sha256 placeholder in order:
          # aarch64-darwin, x86_64-darwin, aarch64-linux, x86_64-linux.
          python3 - <<'PY'
          import os, re

          with open("Formula/croniq.rb") as f:
              text = f.read()

          shas = [
              os.environ["SHA_AARCH64_DARWIN"],
              os.environ["SHA_X86_64_DARWIN"],
              os.environ["SHA_AARCH64_LINUX"],
              os.environ["SHA_X86_64_LINUX"],
          ]
          for s in shas:
              if not re.fullmatch(r"[0-9a-f]{64}", s):
                  raise SystemExit(f"refusing to write invalid sha256: {s!r}")

          it = iter(shas)
          text = re.sub(
              r'sha256 "[0-9a-f]{64}"',
              lambda _m: f'sha256 "{next(it)}"',
              text,
          )

          with open("Formula/croniq.rb", "w") as f:
              f.write(text)
          PY
      - name: Push updated formula to tap
        if: env.HOMEBREW_TAP_TOKEN != ''
        run: |
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/nuetzliches/homebrew-tap.git" tap
          cp Formula/croniq.rb tap/Formula/croniq.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/croniq.rb
          git diff --cached --quiet || git commit -m "croniq ${GITHUB_REF#refs/tags/}"
          git push

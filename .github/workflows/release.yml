name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re-)update Homebrew tap for, e.g. v0.5.0"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  REGISTRY_IMAGE: ghcr.io/nuetzliches/croniq
  # Opt into Node 24 for JavaScript actions ahead of the 2026-06-02
  # default switch, silencing the Node 20 deprecation warnings from
  # checkout/upload-artifact/docker/login-action/etc.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    name: Build (${{ matrix.target }})
    # Only run the build/release matrix on actual tag pushes. workflow_dispatch
    # is reserved for re-running the homebrew tap update against an existing
    # tag — re-building would publish a different binary under the same
    # version, which would break already-distributed checksums.
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      # Pin the workspace version to the pushed tag so every built binary
      # reports the right version via `--version` (CARGO_PKG_VERSION).
      # The edit is local to the runner and never committed back.
      - name: Sync workspace version with release tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          # Match the first `version = "..."` under the [workspace.package]
          # block so we don't accidentally rewrite per-crate manifests.
          python3 -c "
          import re, sys
          src = open('Cargo.toml').read()
          new = re.sub(
              r'(\[workspace\.package\][^\[]*?\nversion = )\"[^\"]+\"',
              lambda m: m.group(1) + '\"$VERSION\"',
              src,
              count=1,
              flags=re.DOTALL,
          )
          if new == src:
              sys.exit('failed to rewrite [workspace.package].version')
          open('Cargo.toml', 'w').write(new)
          "
          grep -A1 '^\[workspace.package\]' Cargo.toml | head -3

      - name: Build release binaries
        shell: bash
        # `--features croniq-server/otlp,croniq-server/postgres` matches the
        # Dockerfile so brew / tarball / image installs all honour
        # `OTEL_EXPORTER_OTLP_ENDPOINT` and can select `db postgres://…` /
        # CRONIQ_DB. Runtime gate in src/telemetry.rs keeps the exporter dormant
        # when unset; SQLite stays the default DB backend.
        run: |
          cargo build --release --target ${{ matrix.target }} \
            --features croniq-server/otlp,croniq-server/postgres \
            --bin croniq-server \
            --bin croniq \
            --bin croniq-mcp \
            --bin croniq-demo-runner \
            --bin croniq-shell-runner

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/croniq-server dist/
          cp target/${{ matrix.target }}/release/croniq dist/
          cp target/${{ matrix.target }}/release/croniq-mcp dist/
          cp target/${{ matrix.target }}/release/croniq-demo-runner dist/
          cp target/${{ matrix.target }}/release/croniq-shell-runner dist/
          cp README.md LICENSE-MIT LICENSE-APACHE dist/
          cd dist && tar czf ../croniq-${{ matrix.target }}.tar.gz *

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target/${{ matrix.target }}/release/croniq-server.exe" dist/
          Copy-Item "target/${{ matrix.target }}/release/croniq.exe" dist/
          Copy-Item "target/${{ matrix.target }}/release/croniq-mcp.exe" dist/
          Copy-Item "target/${{ matrix.target }}/release/croniq-demo-runner.exe" dist/
          Copy-Item "target/${{ matrix.target }}/release/croniq-shell-runner.exe" dist/
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE dist/
          Compress-Archive -Path dist/* -DestinationPath "croniq-${{ matrix.target }}.zip"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: croniq-${{ matrix.target }}
          path: |
            croniq-${{ matrix.target }}.tar.gz
            croniq-${{ matrix.target }}.zip

  docker:
    # Build each architecture on a native runner instead of QEMU-emulating
    # arm64 on amd64. The previous single-runner setup spent ~55 of its 65
    # minutes inside QEMU compiling Rust deps for arm64; native runners
    # cut that to <10 min cold and well under 1 min warm, with each arch
    # using its own GHA cache scope.
    #
    # Same pattern as ci.yml::docker — each matrix job pushes the per-arch
    # image *by digest* (no tag), and docker-merge below stitches the
    # digests into a single manifest list under the human-readable tags.
    name: Docker build (${{ matrix.platform }})
    # Same reasoning as the build job — never re-publish on workflow_dispatch.
    if: github.event_name == 'push'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Derive artefact-safe platform name
        id: plat
        # `linux/amd64` → `linux-amd64`, used as cache scope + artefact
        # name. Slashes break both, so we normalise once here.
        run: echo "name=${{ matrix.platform }}" | tr '/' '-' >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      # Same in-place version sync as the binary build job — keeps the
      # docker image's CARGO_PKG_VERSION aligned with the tag without
      # requiring a manual Cargo.toml bump in every release commit. Runs
      # in each matrix entry independently; the edit is local to that
      # runner.
      - name: Sync workspace version with release tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          python3 -c "
          import re, sys
          src = open('Cargo.toml').read()
          new = re.sub(
              r'(\[workspace\.package\][^\[]*?\nversion = )\"[^\"]+\"',
              lambda m: m.group(1) + '\"$VERSION\"',
              src,
              count=1,
              flags=re.DOTALL,
          )
          if new == src:
              sys.exit('failed to rewrite [workspace.package].version')
          open('Cargo.toml', 'w').write(new)
          "
      # OCI labels link the container to this (public) repo. When a fresh
      # package name is pushed for the first time, GitHub uses this link
      # to inherit the repo's visibility — so new packages default to
      # public without a manual flip in Package Settings.
      #
      # Existing packages keep whatever visibility they had; the current
      # croniq package was flipped once manually after the initial private
      # default and stays public across pushes. There is no public REST
      # or GraphQL API to change visibility programmatically (as of 2026),
      # so the one-time manual flip per package name is unavoidable.
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/nuetzliches/croniq
            org.opencontainers.image.url=https://github.com/nuetzliches/croniq
            org.opencontainers.image.title=croniq
            org.opencontainers.image.description=Distributed cron that just works. Single binary. SQLite default. Production-ready retries.
            org.opencontainers.image.licenses=MIT OR Apache-2.0
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Push by digest only — no tag yet. docker-merge below creates the
          # manifest list under :latest, :<version>, :<tag> once both arches
          # are uploaded.
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Per-arch cache scopes so amd64 and arm64 don't fight over the
          # same slot. The `release-` prefix keeps these distinct from
          # ci.yml's `docker-<plat>` scope, since release builds embed a
          # tag-driven Cargo.toml version bump and would otherwise pollute
          # the main-branch CI cache (and vice versa).
          cache-from: type=gha,scope=docker-release-${{ steps.plat.outputs.name }}
          cache-to: type=gha,mode=max,scope=docker-release-${{ steps.plat.outputs.name }}
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ steps.plat.outputs.name }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-merge:
    # Stitches the per-arch digests from the matrix above into a single
    # multi-arch manifest list. After this runs, `docker pull
    # ghcr.io/nuetzliches/croniq:<version>` resolves to the right image
    # for whatever arch the host is on.
    name: Docker manifest merge
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: docker
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            --tag ${{ env.REGISTRY_IMAGE }}:latest \
            --tag ${{ env.REGISTRY_IMAGE }}:${{ steps.version.outputs.version }} \
            --tag ${{ env.REGISTRY_IMAGE }}:${{ github.ref_name }} \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)
      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ steps.version.outputs.version }}

  release:
    name: GitHub Release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [build, docker-merge]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: croniq-*
          path: artifacts
      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          # action-gh-release uploads each file by its basename, flattening the
          # per-target subdirectories produced by download-artifact. The SHA256SUMS
          # manifest must therefore reference each archive by basename only —
          # otherwise `sha256sum --check` in install.sh can't locate the file
          # relative to the download directory.
          : > SHA256SUMS
          find . -type f \( -name "*.tar.gz" -o -name "*.zip" \) | sort | while read -r f; do
            name=$(basename "$f")
            hash=$(sha256sum "$f" | awk '{print $1}')
            printf '%s  %s\n' "$hash" "$name" >> SHA256SUMS
          done
          cat SHA256SUMS
      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          # Semver pre-release identifiers always contain a `-` (e.g.
          # `v0.10.2-rc1`, `v0.10.2-beta.1`). Mark those as GitHub
          # pre-releases so they don't replace the latest stable release
          # in the UI / install.sh resolution.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/SHA256SUMS

  homebrew:
    name: Update Homebrew tap
    runs-on: ubuntu-latest
    # On tag push we wait for the GitHub Release job to publish the assets
    # (we download them by URL, not via build artifacts, so the same flow
    # also works for `workflow_dispatch` re-runs against an existing tag).
    needs: release
    if: ${{ always() && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch') }}
    permissions:
      contents: read
    # Requires a PAT with write access to nuetzliches/homebrew-tap stored
    # as the secret HOMEBREW_TAP_TOKEN. Job-level env lifts the secret
    # into the env context so step-level `if:` can skip cleanly when the
    # token isn't configured (`secrets.*` is not available there).
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Skip if token is not configured
        if: env.HOMEBREW_TAP_TOKEN == ''
        run: |
          echo "::warning::HOMEBREW_TAP_TOKEN is not set — skipping tap update."
          exit 0
      - name: Resolve tag
        id: tag
        if: env.HOMEBREW_TAP_TOKEN != ''
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          # Skip the tap update for semver pre-releases (`v0.10.2-rc1`,
          # `-beta.1`, …). Homebrew users follow the latest stable formula;
          # rolling the tap to an RC would override that and force everyone
          # onto a pre-release on next `brew upgrade`. The release job
          # itself still publishes the GitHub Release (marked as
          # pre-release) so the binaries are available for testing.
          if [[ "$TAG" == *-* ]]; then
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag $TAG is a pre-release (contains '-'); skipping Homebrew tap update."
          else
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Download release assets, update formula, push to tap
        if: env.HOMEBREW_TAP_TOKEN != '' && steps.tag.outputs.is_release == 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail

          # Download the four release archives directly from the GitHub Release.
          # This works equally for tag-push runs (the release job above just
          # finished publishing them) and for workflow_dispatch re-runs against
          # an older tag where the build artifacts no longer exist.
          mkdir -p assets
          for target in \
            aarch64-apple-darwin \
            x86_64-apple-darwin \
            aarch64-unknown-linux-gnu \
            x86_64-unknown-linux-gnu; do
            gh release download "$TAG" \
              -R "${{ github.repository }}" \
              -p "croniq-${target}.tar.gz" \
              -D assets/
          done

          SHA_AARCH64_DARWIN=$(sha256sum assets/croniq-aarch64-apple-darwin.tar.gz | awk '{print $1}')
          SHA_X86_64_DARWIN=$(sha256sum  assets/croniq-x86_64-apple-darwin.tar.gz  | awk '{print $1}')
          SHA_AARCH64_LINUX=$(sha256sum  assets/croniq-aarch64-unknown-linux-gnu.tar.gz | awk '{print $1}')
          SHA_X86_64_LINUX=$(sha256sum   assets/croniq-x86_64-unknown-linux-gnu.tar.gz  | awk '{print $1}')
          export SHA_AARCH64_DARWIN SHA_X86_64_DARWIN SHA_AARCH64_LINUX SHA_X86_64_LINUX VERSION

          # The formula lives only in the tap repo (the local copy was
          # deleted because it went stale every release — tap is the
          # source of truth). Clone, edit in place, push.
          git clone --depth 1 \
            "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/nuetzliches/homebrew-tap.git" tap

          # Single python pass updates version + four sha256 slots. Order
          # must match the formula's platform order (aarch64-darwin,
          # x86_64-darwin, aarch64-linux, x86_64-linux).
          python3 - <<'PY'
          import os, re

          path = "tap/Formula/croniq.rb"
          with open(path) as f:
              text = f.read()

          version = os.environ["VERSION"]
          text = re.sub(r'version "[^"]+"', f'version "{version}"', text, count=1)

          shas = [
              os.environ["SHA_AARCH64_DARWIN"],
              os.environ["SHA_X86_64_DARWIN"],
              os.environ["SHA_AARCH64_LINUX"],
              os.environ["SHA_X86_64_LINUX"],
          ]
          for s in shas:
              if not re.fullmatch(r"[0-9a-f]{64}", s):
                  raise SystemExit(f"refusing to write invalid sha256: {s!r}")

          it = iter(shas)
          text = re.sub(
              r'sha256 "[0-9a-f]{64}"',
              lambda _m: f'sha256 "{next(it)}"',
              text,
          )

          with open(path, "w") as f:
              f.write(text)
          PY

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/croniq.rb
          if git diff --cached --quiet; then
              echo "Formula already up to date; nothing to push."
          else
              git commit -m "croniq $TAG"
              git push
          fi

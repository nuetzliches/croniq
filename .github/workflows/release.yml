name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: |
          cargo build --release --target ${{ matrix.target }} \
            --bin croniq-server --bin croniq --bin croniq-mcp

      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/croniq-server dist/
          cp target/${{ matrix.target }}/release/croniq dist/
          cp target/${{ matrix.target }}/release/croniq-mcp dist/
          cp README.md LICENSE-MIT LICENSE-APACHE dist/
          cd dist && tar czf ../croniq-${{ matrix.target }}.tar.gz *

      - uses: actions/upload-artifact@v4
        with:
          name: croniq-${{ matrix.target }}
          path: croniq-${{ matrix.target }}.tar.gz

  docker:
    name: Docker release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/nuetzliches/croniq:latest
            ghcr.io/nuetzliches/croniq:${{ steps.version.outputs.version }}
            ghcr.io/nuetzliches/croniq:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build, docker]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*.tar.gz

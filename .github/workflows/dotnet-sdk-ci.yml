name: .NET SDK CI

# Branch-protection contract:
# This workflow is intended to gate merges into main once feat/dotnet-sdk-init
# lands. Add the `.NET SDK CI required` job (defined at the bottom of this
# file) as the single required status check — it aggregates the result of
# schema, build, conformance, and pack-smoke into one signal so branch
# protection only has to know about a single job name.

on:
  push:
    branches: [main]
    paths:
      - 'sdks/dotnet/**'
      - 'sdks/conformance/**'
      - 'openapi.yaml'
      - '.github/workflows/dotnet-sdk-ci.yml'
  pull_request:
    # No `paths-ignore` — `.NET SDK CI required` is a required status check
    # so the workflow must always trigger on PRs. The heavy build /
    # conformance / pack-smoke jobs short-circuit via the `changes` filter
    # below when the PR doesn't touch any relevant path. The aggregator's
    # `contains(needs.*.result, 'failure'|'cancelled')` check treats
    # `skipped` as success, satisfying the required check at zero cost.
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  NUGET_XMLDOC_MODE: skip
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  changes:
    # Detect whether anything in this SDK's relevant paths changed on the
    # PR. Heavy jobs gate on `needs.changes.outputs.dotnet == 'true'` so a
    # server / UI / other-SDK PR skips the .NET toolchain entirely.
    name: Detect path changes
    runs-on: ubuntu-latest
    outputs:
      dotnet: ${{ steps.filter.outputs.dotnet }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            dotnet:
              - 'sdks/dotnet/**'
              - 'sdks/conformance/**'
              - 'openapi.yaml'
              - '.github/workflows/dotnet-sdk-ci.yml'

  schema:
    name: Conformance YAML schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install check-jsonschema
        # `python-jsonschema/check-jsonschema` is a Python library, not a
        # GitHub Action (no action.yml in the repo). Install via pip with
        # a pinned version — the runner image already ships Python.
        run: pip install --user check-jsonschema==0.37.2
      - name: Validate every case against case-schema.json
        # Catches typos / unknown keys / missing required fields before
        # the .NET runner deserialises a case into a CaseSpec. Cheap,
        # ~3s, and produces actionable JSON-Pointer errors.
        run: |
          check-jsonschema --verbose \
            --schemafile sdks/conformance/schema/case-schema.json \
            sdks/conformance/cases/*.yaml

  build:
    name: Build & test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.dotnet == 'true'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: sdks/dotnet
    strategy:
      fail-fast: false
      matrix:
        # OS-only matrix — `dotnet build` resolves both TFMs
        # (net8.0;net10.0) in a single invocation via the 10 SDK's
        # targeting packs. A separate framework axis would just re-run
        # the same restore.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0  # MinVer needs full tag history
      - name: Setup .NET (10 SDK pinned via global.json)
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          global-json-file: sdks/dotnet/global.json
      - name: Setup .NET 8 runtime (for net8.0 test target)
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: '8.0.x'
      - name: Cache NuGet packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('sdks/dotnet/Directory.Packages.props', 'sdks/dotnet/**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-
      - name: Restore
        run: dotnet restore Croniq.Runner.Sdk.slnx
      - name: Format check
        # Closest analogue to `cargo fmt --check`. Kept separate from
        # build so a formatting nit doesn't mask a compile error.
        run: dotnet format Croniq.Runner.Sdk.slnx --verify-no-changes --severity warn
      - name: Build
        run: dotnet build Croniq.Runner.Sdk.slnx --configuration Release --no-restore
      - name: Test (both TFMs)
        # Force bash on windows-latest — the default PowerShell parses
        # bash-style `\` line continuations as parse errors. Git Bash
        # ships preinstalled on the windows runner image, no extra
        # setup needed.
        shell: bash
        run: |
          dotnet test Croniq.Runner.Sdk.slnx --configuration Release --no-build \
            --logger "trx;LogFileName=test-results-${{ matrix.os }}.trx" \
            --collect:"XPlat Code Coverage" \
            --results-directory TestResults/
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.os }}
          path: sdks/dotnet/TestResults/
          if-no-files-found: warn
          retention-days: 7

  conformance:
    # Runs every conformance YAML against the .NET binding. Depends on
    # `schema` so a malformed case never produces a confusing C# test
    # failure first; the schema error is the more actionable signal.
    #
    # Linux-only — the suite is wire-level and OS-agnostic. The matrix
    # in `build` covers cross-platform compile / unit-test concerns.
    name: Conformance suite
    runs-on: ubuntu-latest
    needs: [schema, changes]
    if: needs.changes.outputs.dotnet == 'true'
    defaults:
      run:
        working-directory: sdks/dotnet
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup .NET (10 SDK)
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          global-json-file: sdks/dotnet/global.json
      - name: Cache NuGet packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('sdks/dotnet/Directory.Packages.props', 'sdks/dotnet/**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-
      - name: Restore (conformance project)
        run: dotnet restore tests/Croniq.Runner.Sdk.Conformance.Tests/Croniq.Runner.Sdk.Conformance.Tests.csproj
      - name: Build
        run: dotnet build tests/Croniq.Runner.Sdk.Conformance.Tests/Croniq.Runner.Sdk.Conformance.Tests.csproj --configuration Release --no-restore
      - name: Run conformance suite
        # net10.0 only — the wire behaviour we're testing is identical
        # across TFMs and the test harness setup (WireMock.Net) doesn't
        # benefit from re-running on net8.0.
        run: |
          dotnet test tests/Croniq.Runner.Sdk.Conformance.Tests/Croniq.Runner.Sdk.Conformance.Tests.csproj \
            --configuration Release --no-build --framework net10.0 \
            --logger "console;verbosity=normal" \
            --logger "trx;LogFileName=conformance.trx" \
            --results-directory TestResults
      - name: Upload conformance test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-results
          path: sdks/dotnet/TestResults/
          if-no-files-found: warn
          retention-days: 7

  pack-smoke:
    name: Pack smoke
    runs-on: ubuntu-latest
    needs: [build, changes]
    if: needs.changes.outputs.dotnet == 'true'
    defaults:
      run:
        working-directory: sdks/dotnet
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0  # MinVer needs full tag history
      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          global-json-file: sdks/dotnet/global.json
      - name: Cache NuGet packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('sdks/dotnet/Directory.Packages.props', 'sdks/dotnet/**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-
      - name: Restore
        run: dotnet restore Croniq.Runner.Sdk.slnx
      - name: Pack
        run: dotnet pack Croniq.Runner.Sdk.slnx --configuration Release --output ./artifacts
      - name: Validate package contents
        run: |
          ls -la artifacts/
          for nupkg in artifacts/*.nupkg; do
            echo "=== $nupkg ==="
            unzip -l "$nupkg" | grep -E "(README|icon|nuspec)" || true
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nupkg-smoke
          path: sdks/dotnet/artifacts/
          if-no-files-found: error
          retention-days: 7

  required:
    # Aggregator job for branch-protection. Add ONE check to the protected
    # branch's required status list — `.NET SDK CI required` — and the
    # rule transitively gates schema, build, conformance, and pack-smoke.
    #
    # Without this aggregator, branch protection has to list every job by
    # name; adding or renaming a job means updating the rule in GitHub UI.
    # The aggregator pattern means workflow authors own the contract.
    name: .NET SDK CI required
    if: always()
    runs-on: ubuntu-latest
    needs: [changes, schema, build, conformance, pack-smoke]
    steps:
      - name: Fail if any required job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "::error::A required job did not succeed:"
          echo "  changes:     ${{ needs.changes.result }}"
          echo "  schema:      ${{ needs.schema.result }}"
          echo "  build:       ${{ needs.build.result }}"
          echo "  conformance: ${{ needs.conformance.result }}"
          echo "  pack-smoke:  ${{ needs.pack-smoke.result }}"
          exit 1
      - name: All required jobs passed (or skipped because nothing relevant changed)
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: echo "Aggregator OK - all dependent jobs succeeded or were skipped (path filter)"

name: .NET SDK CI

on:
  push:
    branches: [main]
    paths:
      - 'sdks/dotnet/**'
      - 'openapi.yaml'
      - '.github/workflows/dotnet-sdk-ci.yml'
  pull_request:
    # No paths-ignore here — if this becomes a required check under branch
    # protection, path-based skipping makes the requirement unsatisfiable.
    # See ci.yml for the same pattern.
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_XMLDOC_MODE: skip
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: sdks/dotnet
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0  # MinVer needs full tag history
      - name: Setup .NET (10 SDK pinned via global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: sdks/dotnet/global.json
      - name: Setup .NET 8 runtime (for net8.0 test target)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('sdks/dotnet/**/*.csproj', 'sdks/dotnet/Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Test (both TFMs)
        run: |
          dotnet test --configuration Release --no-build \
            --logger "trx;LogFileName=test-results-${{ matrix.os }}.trx" \
            --collect:"XPlat Code Coverage" \
            --results-directory TestResults/
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: sdks/dotnet/TestResults/

  pack-smoke:
    name: Pack smoke
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: sdks/dotnet
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: sdks/dotnet/global.json
      - name: Restore
        run: dotnet restore
      - name: Pack
        run: dotnet pack --configuration Release --output ./artifacts
      - name: Validate package contents
        run: |
          ls -la artifacts/
          for nupkg in artifacts/*.nupkg; do
            echo "=== $nupkg ==="
            unzip -l "$nupkg" | grep -E "(README|icon|nuspec)" || true
          done
      - uses: actions/upload-artifact@v4
        with:
          name: nupkg-smoke
          path: sdks/dotnet/artifacts/

name: Croniq Nightly

on:
  # schedule:
  #   - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  COMPOSE_ARGS: -f infra/docker/docker-compose.yml -f infra/docker/docker-compose.dev.yml -f infra/docker/docker-compose.observability.yml
  COMPOSE_PROFILES: --profile api --profile worker --profile obs

jobs:
  docs:
    name: Docs Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install docs dependencies
        working-directory: docs
        run: npm ci

      - name: Markdownlint
        working-directory: docs
        run: npm run docs:lint

      - name: Link check (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config docs/.lychee.toml docs

      - name: Upload lychee report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-lychee-report
          path: lychee/out.md
          if-no-files-found: ignore

  smoke:
    name: Aspire Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run observability smoke tests
        run: dotnet test tests/Croniq.Observability.Tests/Croniq.Observability.Tests.csproj --configuration Release

      - name: Copy environment defaults
        run: cp .env.example .env

      - name: Ensure HTTPS development certificate
        run: dotnet dev-certs https

      - name: Start Aspire dev stack
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $env:CRONIQ_DEVSTACK_CADDY = "false"
          $env:CRONIQ_DEVSTACK_UI = "false"
          $process = Start-Process -FilePath dotnet -ArgumentList @(
            "run",
            "--project", "tools/Croniq.Devstack.AppHost/Croniq.Devstack.AppHost.csproj",
            "--configuration", "Release",
            "--",
            "--profile", "obs"
          ) -RedirectStandardOutput "artifacts/aspire-devstack.log" -RedirectStandardError "artifacts/aspire-devstack.err.log" -PassThru
          $process.Id | Out-File -FilePath artifacts/aspire-devstack.pid -Encoding ascii

      - name: Wait for API health
        shell: pwsh
        run: |
          try {
            ./scripts/ci/wait-for-http.ps1 -Uri "http://localhost:5080/health" -Attempts 120 -DelaySeconds 2 -TimeoutSeconds 10
          } catch {
            if (Test-Path "artifacts/aspire-devstack.err.log") {
              Get-Content "artifacts/aspire-devstack.err.log" -Tail 200
            }
            throw
          }

      - name: Run Croniq.Api.Smoke tests
        run: dotnet test tests/Croniq.Api.Smoke/Croniq.Api.Smoke.csproj --configuration Release
        env:
          CRONIQ_WEBHOOK_BASEURL: http://localhost:5000

      - name: Upload Aspire logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devstack-logs
          path: artifacts/aspire-devstack.*

      - name: Shut down Aspire dev stack
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "artifacts/aspire-devstack.pid") {
            $processId = Get-Content "artifacts/aspire-devstack.pid" | Select-Object -First 1
            if ($processId) {
              Stop-Process -Id $processId -Force -ErrorAction SilentlyContinue
            }
          }

  compliance:
    name: SBOM & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        run: dotnet restore croniq.slnx

      - name: Prepare directories
        run: |
          mkdir -p artifacts
          mkdir -p bin

      - name: Install Syft & Trivy (pinned)
        shell: pwsh
        run: |
          ./scripts/ci/install-supplychain-tool.ps1 -Tool syft -InstallDir "$PWD/bin"
          ./scripts/ci/install-supplychain-tool.ps1 -Tool trivy -InstallDir "$PWD/bin"
          "$PWD/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Generate SBOM (Syft)
        run: syft dir:. -o json > artifacts/sbom.json

      - name: License compatibility scan (Syft + allowlist)
        run: |
          mkdir -p artifacts/licenses
          syft dir:. -o spdx-json=artifacts/licenses/sbom.json
          python scripts/ci/check-licenses.py artifacts/licenses/sbom.json eng/licenses/allowed-licenses.json

      - name: Run Trivy filesystem scan
        run: |
          trivy fs . \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format sarif \
            --output artifacts/trivy.sarif \
            --exit-code 1 \
            --no-progress

      - name: Upload compliance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-compliance
          path: artifacts

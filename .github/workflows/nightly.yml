name: Croniq Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  COMPOSE_ARGS: -f infra/docker/docker-compose.yml -f infra/docker/docker-compose.dev.yml -f infra/docker/docker-compose.observability.yml
  COMPOSE_PROFILES: --profile api --profile worker --profile obs

jobs:
  docs:
    name: Docs Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install docs dependencies
        working-directory: docs
        run: npm ci

      - name: Markdownlint
        working-directory: docs
        run: npm run docs:lint

      - name: Link check (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config docs/.lychee.toml docs

      - name: Upload lychee report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-lychee-report
          path: lychee/out.md
          if-no-files-found: ignore

  smoke:
    name: Compose Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run observability smoke tests
        run: dotnet test tests/Croniq.Observability.Tests/Croniq.Observability.Tests.csproj --configuration Release

      - name: Copy environment defaults
        run: cp .env.example .env

      - name: Start Croniq dev stack
        shell: pwsh
        run: >-
          ./scripts/ci/compose-devstack.ps1
          -Action Up
          -Profiles @('api','worker','obs')

      - name: Wait for API health
        shell: pwsh
        run: |
          try {
            ./scripts/ci/wait-for-http.ps1 -Uri "http://localhost:5080/health"
          } catch {
            ./scripts/ci/compose-devstack.ps1 -Action Logs -Profiles @('api','worker','obs') -OutputDirectory artifacts
            throw
          }

      - name: Run Croniq.Api.Smoke tests
        run: dotnet test tests/Croniq.Api.Smoke/Croniq.Api.Smoke.csproj --configuration Release

      - name: Collect docker logs
        if: always()
        shell: pwsh
        run: >-
          ./scripts/ci/compose-devstack.ps1 -Action Logs -Profiles @('api','worker','obs') -OutputDirectory artifacts

      - name: Upload docker logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devstack-logs
          path: artifacts/devstack.log

      - name: Shut down stack
        if: always()
        shell: pwsh
        run: >-
          ./scripts/ci/compose-devstack.ps1 -Action Down -Profiles @('api','worker','obs') -CaptureLogs

  compliance:
    name: SBOM & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        run: dotnet restore croniq.sln

      - name: Prepare directories
        run: |
          mkdir -p artifacts
          mkdir -p bin

      - name: Install Syft & Trivy (pinned)
        shell: pwsh
        run: |
          ./scripts/ci/install-supplychain-tool.ps1 -Tool syft -InstallDir "$PWD/bin"
          ./scripts/ci/install-supplychain-tool.ps1 -Tool trivy -InstallDir "$PWD/bin"
          "$PWD/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Generate SBOM (Syft)
        run: syft dir:. -o json > artifacts/sbom.json

      - name: License compatibility scan
        run: |
          dotnet tool restore
          mkdir -p artifacts/licenses
          dotnet tool run dotnet-project-licenses \
            --input croniq.sln \
            --include-transitive \
            --use-project-assets-json \
            --allowed-license-types eng/licenses/allowed-licenses.json \
            --licenseurl-to-license-mappings eng/licenses/license-url-overrides.json \
            --json \
            --outfile artifacts/licenses/license-scan.json

      - name: Run Trivy filesystem scan
        run: |
          trivy fs . \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format sarif \
            --output artifacts/trivy.sarif \
            --exit-code 1 \
            --no-progress

      - name: Upload compliance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-compliance
          path: artifacts

name: Deploy site

on:
  push:
    branches: [main]
  # Manual redeploy escape hatch: a transient "Deployment failed, try again
  # later" from actions/deploy-pages cannot be fixed by re-running the failed
  # job — the rerun's rebuilt artifact joins the first attempt's one and
  # deploy-pages hard-errors on the duplicate "github-pages" name. A fresh
  # dispatch gets a clean run (and a clean artifact slate) instead.
  workflow_dispatch:
    paths:
      - 'site/**'
      # The deploy bundles a fresh build of croniq-config-wasm into
      # site/wasm/, so changes to the bridge or the parser it wraps
      # need to re-publish the docs even when the HTML is untouched.
      - 'crates/croniq-config-wasm/**'
      - 'crates/croniq-config/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Opt into Node 24 for JavaScript actions ahead of the 2026-06-02
  # default switch, silencing the Node 20 deprecation warnings from
  # checkout/configure-pages/upload-pages-artifact/etc.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # Build the wasm bridge so site/generator.html has a working
      # ./wasm/ path. We reuse the same scripts the UI uses but copy
      # into site/wasm/ instead of ui/src/lib/wasm/.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: wasm
      - name: Install wasm-pack
        run: |
          if ! command -v wasm-pack >/dev/null 2>&1; then
            curl -fsSL https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
          fi
      - name: Build wasm bridge
        run: |
          cd crates/croniq-config-wasm
          wasm-pack build --target web --release --out-dir pkg
      - name: Copy wasm into site/
        run: |
          mkdir -p site/wasm
          cp crates/croniq-config-wasm/pkg/croniq_config_wasm.js \
             crates/croniq-config-wasm/pkg/croniq_config_wasm_bg.wasm \
             site/wasm/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

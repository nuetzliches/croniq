name: Croniq Staging Deploy

on:
  workflow_dispatch:
    inputs:
      image-tag:
        description: "Existing image tag to deploy (defaults to latest release tag)"
        required: false
        type: string
  workflow_call:
    inputs:
      image-tag:
        required: false
        type: string
    secrets:
      STAGING_KUBECONFIG:
        required: true

permissions:
  contents: read
  packages: read
  id-token: write

env:
  DOTNET_NOLOGO: true
  DOTNET_ROLL_FORWARD: LatestMajor
  REGISTRY: ghcr.io
  STAGING_NAMESPACE: croniq-staging

jobs:
  deploy:
    name: Helm Deploy to Staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.croniq.local
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          VERSION="${{ inputs['image-tag'] }}"
          if [ -z "$VERSION" ]; then
            VERSION="${{ github.event.inputs['image-tag'] }}"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME}"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="staging-${GITHUB_RUN_ID}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Configure kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Configure Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Set kubeconfig
        run: |
          echo "${{ secrets.STAGING_KUBECONFIG }}" | base64 -d > kubeconfig
          echo "KUBECONFIG=${{ github.workspace }}/kubeconfig" >> $GITHUB_ENV
        shell: bash

      - name: Helm upgrade/install
        run: |
          helm upgrade --install croniq charts/croniq \
            --namespace ${{ env.STAGING_NAMESPACE }} \
            --create-namespace \
            --set image.api.repository=${{ env.REGISTRY }}/${{ github.repository_owner }}/croniq-api \
            --set image.api.tag=${{ steps.version.outputs.version }} \
            --set image.worker.repository=${{ env.REGISTRY }}/${{ github.repository_owner }}/croniq-worker \
            --set image.worker.tag=${{ steps.version.outputs.version }} \
            -f charts/environments/staging-values.yaml

      - name: Wait for API health
        shell: pwsh
        run: |
          try {
            ./scripts/ci/wait-for-http.ps1 -Uri "https://staging.croniq.local/health"
          } catch {
            kubectl get pods -n ${{ env.STAGING_NAMESPACE }}
            kubectl describe pods -n ${{ env.STAGING_NAMESPACE }}
            kubectl logs deployment/croniq-api -n ${{ env.STAGING_NAMESPACE }} --tail=200
            throw
          }

      - name: Wait for persistence health
        shell: pwsh
        run: |
          try {
            ./scripts/ci/wait-for-http.ps1 -Uri "https://staging.croniq.local/health/persistence"
          } catch {
            kubectl describe deployment/croniq-api -n ${{ env.STAGING_NAMESPACE }}
            throw
          }

      - name: Check webhook ingress
        shell: pwsh
        run: |
          try {
            ./scripts/ci/wait-for-http.ps1 -Uri "https://staging.croniq.local/webhooks/health"
          } catch {
            kubectl logs deployment/croniq-webhooks -n ${{ env.STAGING_NAMESPACE }} --tail=200 || true
            throw
          }

      - name: Run staging smoke tests
        run: >-
          dotnet test tests/Croniq.Api.Smoke/Croniq.Api.Smoke.csproj
          --configuration Release
          -- TestRunParameters.Parameter(name="BaseUrl", value="https://staging.croniq.local")

      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p artifacts
          kubectl get pods -n ${{ env.STAGING_NAMESPACE }} -o wide > artifacts/pods.txt
          kubectl logs deployment/croniq-api -n ${{ env.STAGING_NAMESPACE }} --tail=500 > artifacts/api.log || true
          kubectl logs deployment/croniq-worker -n ${{ env.STAGING_NAMESPACE }} --tail=500 > artifacts/worker.log || true
          kubectl describe pods -n ${{ env.STAGING_NAMESPACE }} > artifacts/describe.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-diagnostics
          path: artifacts

name: .NET SDK Release

# Publishes Croniq.Runner.Sdk + Croniq.Runner.Sdk.OpenTelemetry to nuget.org
# when a tag of the form `dotnet-sdk-vX.Y.Z` is pushed. The tag prefix
# matches the existing MinVer configuration in
# `sdks/dotnet/Directory.Build.props` (MinVerTagPrefix=dotnet-sdk-v), so
# the build-time version is derived automatically from the tag — no manual
# csproj edits needed.
#
# Prerequisites (one-time, set by a repo admin):
#   * Repo secret `NUGET_API_KEY` — a nuget.org API key with push rights
#     for both packages. Generate at https://www.nuget.org/account/apikeys
#     with "Push" + "Push new packages and package versions", scoped to the
#     `Croniq.*` package glob.
#
# Tag examples:
#   dotnet-sdk-v0.1.0              → stable release on nuget.org
#   dotnet-sdk-v0.2.0-preview.1    → MinVer keeps the pre-release suffix,
#                                    NuGet surfaces it under "Show prerelease"

on:
  push:
    tags: ['dotnet-sdk-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing tag to (re-)pack, e.g. dotnet-sdk-v0.1.0. Republishing the same version is rejected by nuget.org.'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  NUGET_XMLDOC_MODE: skip
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  publish:
    name: Build, verify, publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/dotnet
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # MinVer reads tags from history to compute the package version.
          # `fetch-depth: 0` brings the full commit history; `fetch-tags: true`
          # forces tag refs to come along even when the trigger ref is a tag
          # itself (otherwise MinVer can fall back to its 0.0.0-alpha default).
          # Both flags together mirror the recipe in the MinVer FAQ.
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve tag → version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REF="${{ inputs.version }}"
          else
            REF="${GITHUB_REF#refs/tags/}"
          fi
          if [[ ! "$REF" =~ ^dotnet-sdk-v(.+)$ ]]; then
            echo "::error::tag '$REF' does not match dotnet-sdk-vX.Y.Z"
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "Resolved version=${BASH_REMATCH[1]}"

      - name: Setup .NET (10 SDK pinned via global.json)
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          global-json-file: sdks/dotnet/global.json

      - name: Setup .NET 8 runtime (for net8.0 test target)
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('sdks/dotnet/Directory.Packages.props', 'sdks/dotnet/**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore Croniq.Runner.Sdk.slnx

      - name: Build (Release)
        run: dotnet build Croniq.Runner.Sdk.slnx --configuration Release --no-restore

      - name: Test (both TFMs)
        run: |
          dotnet test Croniq.Runner.Sdk.slnx --configuration Release --no-build \
            --logger "console;verbosity=normal"

      - name: Run conformance suite
        # Same wire-protocol guard the PR-time CI applies. We re-run it on
        # publish so a regression that slipped past PR review can't ship
        # to nuget.org.
        run: |
          dotnet test tests/Croniq.Runner.Sdk.Conformance.Tests/Croniq.Runner.Sdk.Conformance.Tests.csproj \
            --configuration Release --no-build --framework net10.0 \
            --logger "console;verbosity=normal"

      - name: Pack (Release, version pinned from tag)
        # Belt-and-suspenders: we set MinVerVersionOverride to the resolved
        # tag version so the pack output is deterministic even if MinVer's
        # tag-walking trips over a quirk in the GitHub Actions checkout
        # (lightweight tag vs annotated, shallow-but-tagged refs, etc.).
        # This is the supported MinVer escape hatch — see
        # https://github.com/adamralph/minver#can-i-disable-minver
        run: |
          dotnet pack Croniq.Runner.Sdk.slnx --configuration Release --no-build --output ./artifacts \
            -p:MinVerVersionOverride=${{ steps.version.outputs.version }}

      - name: List packed artefacts
        run: ls -la artifacts/

      - name: Verify the packed version matches the tag
        # Belt-and-braces: MinVer is well-behaved, but if a future Directory.Build.props
        # change accidentally severs the tag→version link, we'd otherwise push the
        # wrong number to nuget.org silently. Glob the .nupkg filenames and assert.
        shell: bash
        run: |
          EXPECTED="${{ steps.version.outputs.version }}"
          MISSING=0
          for pkg in Croniq.Runner.Sdk Croniq.Runner.Sdk.OpenTelemetry; do
            if ! ls "artifacts/${pkg}.${EXPECTED}.nupkg" >/dev/null 2>&1; then
              echo "::error::expected artifacts/${pkg}.${EXPECTED}.nupkg not found"
              ls "artifacts/${pkg}".*.nupkg || true
              MISSING=1
            fi
          done
          if [ "$MISSING" = "1" ]; then exit 1; fi

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          # --skip-duplicate so a re-run after a partial failure (e.g. the
          # main package pushed, the otel package didn't) doesn't 409 on
          # the already-pushed artefact.
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          # Symbol packages (.snupkg) ride along automatically when sitting
          # next to the .nupkg, but be explicit to surface push errors.
          dotnet nuget push "artifacts/*.snupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate || true
          echo "Published Croniq.Runner.Sdk@${{ steps.version.outputs.version }} + .OpenTelemetry"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nupkg-${{ steps.version.outputs.version }}
          path: sdks/dotnet/artifacts/
          if-no-files-found: error
          retention-days: 30

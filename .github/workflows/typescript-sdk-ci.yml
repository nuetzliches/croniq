name: TypeScript SDK CI

# Branch-protection contract:
# `TypeScript SDK CI required` (the aggregator at the bottom) is the single
# job to gate merges on — it transitively covers schema, build, conformance,
# and pack-smoke. See dotnet-sdk-ci.yml for the matching pattern.

on:
  push:
    branches: [main]
    paths:
      - 'sdks/typescript/**'
      - 'sdks/conformance/**'
      - 'openapi.yaml'
      - '.github/workflows/typescript-sdk-ci.yml'
  pull_request:
    # No `paths-ignore` — `TypeScript SDK CI required` is a required status
    # check so the workflow must always trigger on PRs. Heavy build /
    # conformance / pack-smoke jobs short-circuit via the `changes` filter
    # below when nothing relevant changed.
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

env:
  # Opt into Node 24 for JavaScript actions ahead of the 2026-06-02
  # default switch, silencing the Node 20 deprecation warnings from
  # setup-node/checkout/upload-artifact/etc. Matches the env block in
  # ci.yml, dotnet-sdk-ci.yml, go-sdk-ci.yml, python-sdk-ci.yml, and
  # release.yml.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  changes:
    name: Detect path changes
    runs-on: ubuntu-latest
    outputs:
      typescript: ${{ steps.filter.outputs.typescript }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            typescript:
              - 'sdks/typescript/**'
              - 'sdks/conformance/**'
              - 'openapi.yaml'
              - '.github/workflows/typescript-sdk-ci.yml'

  schema:
    name: Conformance YAML schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install check-jsonschema
        run: pip install --user check-jsonschema==0.37.2
      - name: Validate every case against case-schema.json
        run: |
          check-jsonschema --verbose \
            --schemafile sdks/conformance/schema/case-schema.json \
            sdks/conformance/cases/*.yaml
      - name: Validate every trigger case against trigger-case-schema.json
        run: |
          check-jsonschema --verbose \
            --schemafile sdks/conformance/schema/trigger-case-schema.json \
            sdks/conformance/cases-trigger/*.yaml

  build:
    name: Build & test (Node ${{ matrix.node }}, ${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: sdks/typescript
    strategy:
      fail-fast: false
      matrix:
        # 20.x = LTS floor (Node 18 EOL'd 2025-04-30, transitive npm deps in
        # the @nuetzliches/croniq-runner tree have started dropping support).
        # 22.x = current LTS, 24.x = next LTS line.
        node: ['20', '22', '24']
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test (unit)
        run: npm test

  conformance:
    # Runs every conformance YAML against the TypeScript binding. Depends on
    # `schema` so a malformed case never produces a confusing JS test
    # failure first — the schema error is the more actionable signal.
    #
    # Linux-only — the suite is wire-level and OS-agnostic. The matrix in
    # `build` covers cross-platform concerns.
    name: Conformance suite
    runs-on: ubuntu-latest
    needs: [schema, changes]
    if: needs.changes.outputs.typescript == 'true'
    defaults:
      run:
        working-directory: sdks/conformance/bindings/typescript
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Build SDK (binding consumes the local @nuetzliches/croniq-runner build)
        working-directory: sdks/typescript
        run: |
          npm ci
          npm run build
      - name: Install binding deps
        run: npm install --no-audit --no-fund
      - name: Run conformance suite
        run: npm test

  pack-smoke:
    name: Pack smoke
    runs-on: ubuntu-latest
    needs: [build, changes]
    if: needs.changes.outputs.typescript == 'true'
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Pack
        # `npm pack --pack-destination` errors with ENOENT on some runners
        # if the directory doesn't pre-exist; create it explicitly so the
        # behaviour is consistent across the Linux/macOS/Windows matrix.
        run: |
          mkdir -p ./artifacts
          npm pack --pack-destination ./artifacts
      - name: Validate package contents
        run: |
          ls -la artifacts/
          for tgz in artifacts/*.tgz; do
            echo "=== $tgz ==="
            tar -tzf "$tgz" | head -30
            # Sanity-check: dist/index.js and dist/index.d.ts must be present.
            tar -tzf "$tgz" | grep -q 'package/dist/index.js$' || { echo "missing dist/index.js"; exit 1; }
            tar -tzf "$tgz" | grep -q 'package/dist/index.d.ts$' || { echo "missing dist/index.d.ts"; exit 1; }
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-smoke
          path: sdks/typescript/artifacts/
          if-no-files-found: error
          retention-days: 7

  required:
    # Aggregator job for branch-protection. Mirror dotnet-sdk-ci.yml.
    name: TypeScript SDK CI required
    if: always()
    runs-on: ubuntu-latest
    needs: [changes, schema, build, conformance, pack-smoke]
    steps:
      - name: Fail if any required job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "::error::A required job did not succeed:"
          echo "  changes:     ${{ needs.changes.result }}"
          echo "  schema:      ${{ needs.schema.result }}"
          echo "  build:       ${{ needs.build.result }}"
          echo "  conformance: ${{ needs.conformance.result }}"
          echo "  pack-smoke:  ${{ needs.pack-smoke.result }}"
          exit 1
      - name: All required jobs passed (or skipped because nothing relevant changed)
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: echo "Aggregator OK - all dependent jobs succeeded or were skipped (path filter)"

name: CI Pull Request Validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_ROLL_FORWARD: LatestMajor
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  validate:
    name: Format, Build & Quick Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore croniq.slnx

      - name: Prepare tooling directories
        run: mkdir -p bin

      - name: Install Trivy (pinned)
        shell: pwsh
        run: |
          ./scripts/ci/install-supplychain-tool.ps1 -Tool trivy -InstallDir "$PWD/bin"
          "$PWD/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Syft (pinned)
        shell: pwsh
        run: |
          ./scripts/ci/install-supplychain-tool.ps1 -Tool syft -InstallDir "$PWD/bin"
          "$PWD/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify formatting
        run: dotnet format croniq.slnx --verify-no-changes

      - name: Build with analyzers
        run: dotnet build croniq.slnx --configuration Release --no-restore -warnaserror

      - name: Validate gRPC samples (syntax/build-only)
        shell: pwsh
        run: ./eng/validate-grpc-samples.ps1

      - name: Dependency vulnerability scan (informational)
        run: |
          set +e
          dotnet list package --vulnerable --include-transitive
          exit 0

      - name: License compatibility scan (Syft + allowlist)
        run: |
          mkdir -p artifacts/licenses
          syft dir:. -o spdx-json=artifacts/licenses/sbom.json
          python scripts/ci/check-licenses.py artifacts/licenses/sbom.json eng/licenses/allowed-licenses.json

      - name: Upload license report (informational)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: license-report
          path: artifacts/licenses/license-scan.json
          if-no-files-found: ignore

      - name: Trivy filesystem scan (informational)
        run: |
          trivy fs . \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --no-progress \
            --exit-code 0

  tests:
    name: Test Matrix
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - displayName: Croniq.Core.Tests
            project: tests/Croniq.Core.Tests/Croniq.Core.Tests.csproj
          - displayName: Croniq.Api.Tests
            project: tests/Croniq.Api.Tests/Croniq.Api.Tests.csproj
          - displayName: Croniq.JobStore.InMemory.Tests
            project: tests/Croniq.JobStore.InMemory.Tests/Croniq.JobStore.InMemory.Tests.csproj
          - displayName: Croniq.Providers.Default.Tests
            project: tests/Croniq.Providers.Default.Tests/Croniq.Providers.Default.Tests.csproj
          - displayName: Croniq.Observability.Tests
            project: tests/Croniq.Observability.Tests/Croniq.Observability.Tests.csproj
          - displayName: Croniq.Persistence.SqlServer.Tests
            project: tests/Croniq.Persistence.SqlServer.Tests/Croniq.Persistence.SqlServer.Tests.csproj
          - displayName: Croniq.Sdk.Tests
            project: tests/Croniq.Sdk.Tests/Croniq.Sdk.Tests.csproj
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore croniq.slnx

      - name: Build
        run: dotnet build croniq.slnx --configuration Release --no-restore

      - name: Prepare coverage folder
        run: mkdir -p coverage

      - name: Run ${{ matrix.displayName }}
        shell: pwsh
        run: >-
          ./scripts/ci/run-tests.ps1
          -Project "${{ matrix.project }}"
          -DisplayName "${{ matrix.displayName }}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.displayName }}
          path: TestResults

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.displayName }}
          path: coverage

  coverage-summary:
    name: Coverage Summary & Gates
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage
          merge-multiple: true

      - name: Install ReportGenerator
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.1
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Build coverage summary
        run: >-
          reportgenerator
          "-reports:coverage/**/coverage.cobertura.xml"
          "-targetdir:coverage/report"
          -reporttypes:JsonSummary

      - name: Enforce coverage gates
        run: |
          python scripts/ci/enforce_coverage_thresholds.py \
            coverage/report/Summary.json \
            --core-assembly Croniq.Core \
            --core-threshold 73 \
            --overall-threshold 75 \
            --core-branch-threshold 55 \
            --overall-branch-threshold 55

      - name: Comment coverage summary on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = 'coverage/report/Summary.json';
            if (!fs.existsSync(path)) {
              core.setFailed(`Missing coverage summary at ${path}`);
            }
            const marker = '<!-- croniq-ci-coverage -->';
            const summary = JSON.parse(fs.readFileSync(path, 'utf8'));
            const overall = Number(summary?.summary?.linecoverage ?? 0).toFixed(2);
            const assemblies = summary?.coverage?.assemblies ?? [];
            const coreAssembly = assemblies.find(a => a.name === 'Croniq.Core');
            const assemblyRows = assemblies
              .map(a => `| ${a.name} | ${Number(a.coverage).toFixed(2)}% |`)
              .join('\n');
            const body = [
              marker,
              '### Coverage Summary',
              '',
              `- Overall: **${overall}%**`,
              coreAssembly
                ? `- Croniq.Core: **${Number(coreAssembly.coverage).toFixed(2)}%**`
                : '- Croniq.Core: _keine Daten_',
              '',
              '<details><summary>Assemblies</summary>',
              '',
              '| Assembly | Coverage |',
              '| --- | ---: |',
              assemblyRows,
              '',
              '</details>'
            ].filter(Boolean).join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const existingComments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number }
            );
            const previous = existingComments.find(comment => comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }

      - name: Upload aggregated coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-coverage-summary
          path: coverage/report

  ui-openapi-sync:
    name: UI OpenAPI Snapshot & Schemas
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install UI dependencies
        working-directory: src/Croniq.Ui
        run: npm ci

      - name: Generate OpenAPI schemas (offline/snapshot first)
        working-directory: src/Croniq.Ui
        env:
          # Allow CI to use snapshot without depending on live backend
          CRONIQ_OPENAPI_URL: ''
        run: npm run generate:api

      - name: Fail on generated diffs (api-schema + snapshot)
        run: |
          git diff --stat --exit-code -- projects/api-schema/generated artifacts/swagger.json || (
            git diff --color=always -- projects/api-schema/generated artifacts/swagger.json
            exit 1
          )

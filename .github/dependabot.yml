version: 2

# Every ecosystem with a manifest in this repo, not only the workflow pins
# (review 2026-10-24, C-9). Minor and patch updates are grouped into one PR
# per ecosystem (and per directory where the ecosystem has several), so a
# weekly run yields a handful of PRs instead of dozens; majors stay separate
# because they are the ones that need reading. Security updates are not
# affected by `open-pull-requests-limit` or the grouping.
#
# The SDK manifests (pip, gomod, nuget, gradle, sdks/typescript) belong to
# published libraries: a bump there raises the floor every consumer must
# meet, so they run monthly and pip/npm only widen a range when the new
# release falls outside it.

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # init and analyze must be the same release: analyze refuses a
      # configuration written by another init version, so a PR that bumps
      # only one of them can never pass (#858, #860).
      codeql-action:
        patterns:
          - "github/codeql-action*"

  # The workspace. Cargo.lock is the shipped dependency set; cargo-deny gates
  # every bump on advisories and licences.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  # Base images of the one Dockerfile (rust, node, debian, alpine, nginx).
  # `rust:<x>-bookworm` is also the de facto MSRV build: CI's rust job uses
  # floating stable, so keeping this tag current keeps the two from drifting.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      docker-images:
        update-types: [minor, patch]

  # Dashboard: the bundle the image ships.
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      ui-minor-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 is the Go-based compiler with a new API. typescript-eslint
      # refuses it outright ("does not support TS 7.0", peer range
      # `>=4.8.4 <6.1.0`, support tracked in typescript-eslint#10940 for
      # TS >= 7.1), and vue-tsc 3.3 still drives the TS 6 JS API through
      # Volar, so #909 failed at `npm run lint` before the type check ran.
      # Lift this once typescript-eslint and vue-tsc support TypeScript 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directories:
      - /sdks/typescript
      - /sdks/conformance/bindings/typescript
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    versioning-strategy: increase-if-necessary
    groups:
      typescript-sdk-minor-patch:
        update-types: [minor, patch]
    ignore:
      # @types/node tracks the SDK's lowest supported Node (`engines`), not
      # the newest one: newer typings would let the SDK call APIs its floor
      # lacks. Raise it together with `engines` and the CI matrix.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7: same blocker as in ui/ (typescript-eslint's peer range
      # stops below 6.1, #955). Lift both ignores together.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /sdks/python
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    versioning-strategy: increase-if-necessary
    groups:
      python-sdk-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directories:
      - /sdks/go
      - /sdks/go/otel
      - /sdks/go/conformance
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      go-sdk-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: nuget
    directory: /sdks/dotnet
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      dotnet-sdk-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: gradle
    directory: /sdks/java
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      java-sdk-minor-patch:
        update-types: [minor, patch]

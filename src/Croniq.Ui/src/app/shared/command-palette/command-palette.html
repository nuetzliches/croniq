@if (isOpen()) {
<section
  class="fixed inset-0 z-50 flex items-start justify-center pt-[15vh]"
  role="dialog"
  aria-modal="true"
  aria-labelledby="commandPaletteLabel"
  (keydown)="handleKey($event)"
>
  <div class="absolute inset-0 bg-slate-950/80 backdrop-blur-xl" aria-hidden="true" (click)="close()"></div>

  <div class="relative z-10 w-full max-w-2xl px-4">
    <div
      class="rounded-2xl border border-white/10 bg-surface-alt/95 shadow-2xl ring-1 ring-black/50"
      role="document"
    >
      <header class="flex items-center justify-between px-5 pb-3 text-sm text-muted">
        <span id="commandPaletteLabel">Quick actions</span>
        <button
          type="button"
          class="rounded-md border border-white/10 px-3 py-1 text-xs font-semibold text-primary"
          (click)="close()"
          aria-label="Close command palette"
        >
          Esc
        </button>
      </header>

      <div class="border-b border-white/10 px-5 pb-3">
        <label class="sr-only" for="commandPaletteQuery">Search commands</label>
        <input
          #commandPaletteInput
          id="commandPaletteQuery"
          type="text"
          class="w-full bg-transparent text-base text-primary placeholder:text-muted focus:outline-none focus-visible:ring-2 focus-visible:ring-accent/40"
          [value]="query()"
          (input)="onSearch(commandPaletteInput.value)"
          placeholder="Type a command or route"
          autocomplete="off"
        />
      </div>

      <p class="sr-only" aria-live="polite">{{ liveRegionMessage() }}</p>

      <ul
        class="max-h-[50vh] divide-y divide-white/5 overflow-y-auto"
        role="listbox"
        aria-label="Command results"
        [attr.aria-activedescendant]="activeDescendantId() ?? undefined"
      >
        @if (results().length === 0) {
        <li class="px-5 py-4 text-sm text-muted">No commands match "{{ query() }}".</li>
        } @else { @for (cmd of results(); track cmd.id; let idx = $index) {
        <li>
          <button
            type="button"
            role="option"
            class="flex w-full items-baseline justify-between gap-4 px-5 py-3 text-left text-sm font-medium text-primary transition-colors hover:bg-accent/10"
            [class.bg-accent/20]="idx === activeIndex()"
            [class.text-white]="idx === activeIndex()"
            [attr.aria-selected]="idx === activeIndex()"
            [id]="optionId(cmd, idx)"
            (click)="execute(cmd, idx)"
          >
            <span>{{ cmd.label }}</span>
            <small class="text-xs text-muted">{{ cmd.description ?? (cmd.path ? '/' + cmd.path : '') }}</small>
          </button>
        </li>
        } }
      </ul>
    </div>
  </div>
</section>
}

<div
  class="p-6 bg-white dark:bg-zinc-800 rounded-lg shadow-xl border border-zinc-200 dark:border-zinc-700 min-w-[400px] max-w-lg"
>
  @if (data.title) {
  <h2 class="text-lg font-semibold mb-2 text-zinc-900 dark:text-zinc-100">{{ data.title }}</h2>
  }

  <p class="text-sm text-zinc-600 dark:text-zinc-400 mb-6 leading-relaxed">
    {{ data.message }}
  </p>

  <div class="flex justify-end gap-3">
    <button
      type="button"
      (click)="cancel()"
      class="px-4 py-2 text-zinc-700 dark:text-zinc-300 hover:bg-zinc-100 dark:hover:bg-zinc-700 rounded-md font-medium text-sm transition-colors"
    >
      {{ data.cancelLabel || 'Cancel' }}
    </button>
    <button
      type="button"
      (click)="confirm()"
      [class]="
        data.variant === 'danger'
          ? 'bg-red-600 hover:bg-red-700'
          : 'bg-zinc-900 dark:bg-zinc-100 dark:text-zinc-900 hover:opacity-90'
      "
      class="px-4 py-2 text-white rounded-md font-medium text-sm transition-colors"
    >
      {{ data.confirmLabel || 'Confirm' }}
    </button>
  </div>
</div>

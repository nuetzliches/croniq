<span
  aria-hidden="true"
  class="h-2.5 w-2.5 rounded-full bg-sky-400 shadow-[0_0_12px] shadow-sky-400 transition-colors"
  [class.bg-emerald-400]="intent() === 'success'"
  [class.shadow-emerald-400]="intent() === 'success'"
  [class.bg-amber-400]="intent() === 'warn'"
  [class.shadow-amber-400]="intent() === 'warn'"
  [class.bg-sky-400]="intent() === 'neutral'"
  [class.shadow-sky-400]="intent() === 'neutral'"
></span>
<span class="flex flex-col gap-1 leading-snug">
  <span class="text-[0.75rem] uppercase tracking-[0.4em] text-muted">{{ label() }}</span>
  <span class="text-lg font-semibold text-primary">{{ value() }}</span>
</span>

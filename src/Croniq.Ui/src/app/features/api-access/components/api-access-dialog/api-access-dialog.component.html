<div
  class="flex h-full w-[500px] flex-col overflow-hidden rounded-xl border border-white/10 bg-surface shadow-2xl"
>
  <!-- Header -->
  <header
    class="flex items-center justify-between border-b border-white/10 bg-surface-alt px-6 py-4"
  >
    <h2 class="text-lg font-semibold text-primary">
      {{ isEdit ? 'Edit API Client' : 'Register API Client' }}
    </h2>
    <button (click)="close()" class="text-muted hover:text-primary">
      <span class="sr-only">Close</span>
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M6 18L18 6M6 6l12 12"
        />
      </svg>
    </button>
  </header>

  <!-- Body -->
  <div class="flex-1 overflow-y-auto p-6">
    <form class="space-y-4" (submit)="$event.preventDefault(); save()">
      <!-- Client ID -->
      <div class="space-y-1">
        <label for="clientId" class="text-sm font-medium text-muted">Client ID</label>
        @if (isEdit) {
        <div
          class="w-full rounded-lg border border-white/10 bg-surface-alt px-3 py-2 text-sm text-muted opacity-50"
        >
          {{ model().clientId }}
        </div>
        } @else {
        <input
          id="clientId"
          type="text"
          [field]="form.clientId"
          class="w-full rounded-lg border border-white/10 bg-surface-alt px-3 py-2 text-sm text-primary placeholder:text-muted focus:border-accent focus:outline-none"
          placeholder="e.g. ci-pipeline"
        />
        @if (submitAttempted() && clientIdInvalid()) {
        <p class="text-xs text-danger">Client ID is required.</p>
        } }
      </div>

      <!-- Name -->
      <div class="space-y-1">
        <label for="name" class="text-sm font-medium text-muted">Display Name</label>
        <input
          id="name"
          type="text"
          [field]="form.name"
          class="w-full rounded-lg border border-white/10 bg-surface-alt px-3 py-2 text-sm text-primary placeholder:text-muted focus:border-accent focus:outline-none"
          placeholder="e.g. CI/CD Primary Worker"
        />
      </div>

      <!-- Environment -->
      <div class="space-y-1">
        <label for="environment" class="text-sm font-medium text-muted">Environment</label>
        <input
          id="environment"
          type="text"
          [field]="form.environmentTag"
          class="w-full rounded-lg border border-white/10 bg-surface-alt px-3 py-2 text-sm text-primary placeholder:text-muted focus:border-accent focus:outline-none"
          placeholder="e.g. Live"
        />
      </div>

      <!-- Scopes -->
      <div class="space-y-1">
        <label for="scopes" class="text-sm font-medium text-muted">Scopes (comma separated)</label>
        <input
          id="scopes"
          type="text"
          [value]="scopesInput()"
          (input)="setScopes($any($event.target).value)"
          class="w-full rounded-lg border border-white/10 bg-surface-alt px-3 py-2 text-sm text-primary placeholder:text-muted focus:border-accent focus:outline-none"
          placeholder="e.g. jobs:read, jobs:write"
        />
      </div>
    </form>
  </div>

  <!-- Footer -->
  <footer
    class="flex items-center justify-end gap-3 border-t border-white/10 bg-surface-alt px-6 py-4"
  >
    <button
      type="button"
      (click)="close()"
      class="rounded-lg px-4 py-2 text-sm font-medium text-muted hover:bg-white/5 hover:text-primary"
    >
      Cancel
    </button>
    <button
      type="button"
      (click)="save()"
      class="rounded-lg bg-accent px-4 py-2 text-sm font-semibold text-white transition hover:bg-accent-hover disabled:opacity-50"
    >
      Save
    </button>
  </footer>
</div>

<div
  class="p-6 bg-white dark:bg-zinc-800 rounded-lg shadow-xl border border-zinc-200 dark:border-zinc-700 min-w-[400px]"
>
  <h2 class="text-lg font-semibold mb-4 text-zinc-900 dark:text-zinc-100">API Key Created</h2>

  <p class="text-sm text-zinc-600 dark:text-zinc-400 mb-4">
    This key will only be shown once. Please copy it and store it securely.
  </p>

  <div class="relative mb-6">
    <pre
      class="p-3 bg-zinc-100 dark:bg-zinc-900 rounded border border-zinc-200 dark:border-zinc-700 font-mono text-sm break-all whitespace-pre-wrap"
      >{{ data.secret }}</pre
    >
    <button
      type="button"
      (click)="copy()"
      class="absolute top-2 right-2 p-1.5 rounded-md hover:bg-zinc-200 dark:hover:bg-zinc-800 text-zinc-500 transition-colors"
      title="Copy to clipboard"
    >
      @if (copied()) {
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="text-green-600"
      >
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
      } @else {
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
      </svg>
      }
    </button>
  </div>

  <div class="flex justify-end">
    <button
      type="button"
      (click)="close()"
      class="px-4 py-2 bg-zinc-900 dark:bg-zinc-100 text-white dark:text-zinc-900 rounded-md font-medium text-sm hover:opacity-90 transition-opacity"
    >
      Done
    </button>
  </div>
</div>

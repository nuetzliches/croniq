<cq-dialog size="sm">
  <h2 cqDialogHeader class="text-lg font-semibold text-primary">API Key Created</h2>

  <p class="text-sm text-muted">
    This key will only be shown once. Please copy it and store it securely.
  </p>

  <div class="relative mt-4">
    <pre
      class="p-3 rounded border border-white/10 bg-surface-alt font-mono text-sm text-primary break-all whitespace-pre-wrap"
      >{{ data.secret }}</pre
    >
    <button
      type="button"
      (click)="copy()"
      class="absolute top-2 right-2 p-1.5 rounded-md hover:bg-white/5 text-muted transition-colors"
      title="Copy to clipboard"
    >
      @if (copied()) {
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="text-success"
      >
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
      } @else {
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
      </svg>
      }
    </button>
  </div>

  <div cqDialogFooter class="flex justify-end">
    <button
      type="button"
      (click)="close()"
      class="rounded-lg bg-accent px-4 py-2 text-sm font-semibold text-white transition hover:bg-accent-hover"
    >
      Done
    </button>
  </div>
</cq-dialog>

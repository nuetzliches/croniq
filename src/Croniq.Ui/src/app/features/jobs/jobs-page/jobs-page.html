<div class="flex h-full flex-col space-y-6">
  <!-- Header / Filters -->
  <header class="flex flex-wrap items-center justify-between gap-4">
    <div class="flex items-center gap-4">
      <div class="relative">
        <input
          type="text"
          placeholder="Search jobs..."
          class="w-64 rounded-lg border border-white/10 bg-surface-alt px-4 py-2 text-sm text-primary placeholder:text-muted focus:border-accent focus:outline-none"
          [value]="searchQuery()"
          (input)="setSearchQuery($any($event.target).value)"
        />
      </div>
      <select
        class="rounded-lg border border-white/10 bg-surface-alt px-4 py-2 text-sm text-primary focus:border-accent focus:outline-none"
        (change)="setNamespaceFilter($any($event.target).value || null)"
      >
        <option value="">All Namespaces</option>
        <option value="billing">billing</option>
        <option value="system">system</option>
      </select>
    </div>
    <button
      type="button"
      class="rounded-lg bg-accent px-4 py-2 text-sm font-semibold text-white transition hover:bg-accent-hover"
    >
      Create Job
    </button>
  </header>

  <!-- Data Table -->
  <div class="flex-1 overflow-hidden rounded-xl border border-white/10 bg-surface-alt shadow-card">
    <div class="overflow-x-auto">
      <table class="w-full text-left text-sm">
        <thead class="bg-white/5 text-xs uppercase text-muted">
          <tr>
            <th class="px-6 py-3 font-medium">Job Key</th>
            <th class="px-6 py-3 font-medium">Namespace</th>
            <th class="px-6 py-3 font-medium">Triggers</th>
            <th class="px-6 py-3 font-medium">Last Run</th>
            <th class="px-6 py-3 font-medium text-right">Actions</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-white/10">
          @if (loading()) {
            <tr>
              <td colspan="5" class="px-6 py-8 text-center text-muted">Loading jobs...</td>
            </tr>
          } @else if (jobs().length === 0) {
            <tr>
              <td colspan="5" class="px-6 py-8 text-center text-muted">No jobs found.</td>
            </tr>
          } @else {
            @for (job of jobs(); track job.jobKey) {
              <tr class="group hover:bg-white/5">
                <td class="px-6 py-4 font-medium text-primary">{{ job.jobKey }}</td>
                <td class="px-6 py-4 text-muted">default</td>
                <td class="px-6 py-4 text-muted">
                  <!-- Mock data for now -->
                  2 Schedules
                </td>
                <td class="px-6 py-4">
                  <span class="inline-flex items-center gap-1.5 rounded-full bg-success/10 px-2 py-1 text-xs font-medium text-success">
                    Success
                  </span>
                  <span class="ml-2 text-xs text-muted">2m ago</span>
                </td>
                <td class="px-6 py-4 text-right">
                  <div class="flex justify-end gap-2 opacity-0 transition group-hover:opacity-100">
                    <button class="text-xs font-medium text-accent hover:text-accent-hover">Trigger</button>
                    <button class="text-xs font-medium text-muted hover:text-primary">Edit</button>
                  </div>
                </td>
              </tr>
            }
          }
        </tbody>
      </table>
    </div>
  </div>
</div>

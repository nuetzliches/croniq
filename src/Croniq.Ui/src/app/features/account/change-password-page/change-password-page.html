<div class="flex min-h-screen flex-col items-center justify-center bg-surface p-6">
  <div class="w-full max-w-md space-y-8">
    <div class="flex flex-col items-center space-y-2 text-center">
      <cq-app-brand class="scale-125" />
      <h1 class="mt-4 text-2xl font-bold tracking-tight text-primary">Change Password</h1>
      <p class="text-sm text-muted">Update your account security</p>
    </div>

    <div class="rounded-2xl border border-white/10 bg-surface-alt/50 p-8 shadow-xl backdrop-blur-sm">
      <form
        class="space-y-6"
        novalidate
        [attr.aria-busy]="busy()"
        (submit)="$event.preventDefault(); submit()"
      >
        <div class="space-y-2">
          <label for="cp-current" class="text-xs font-semibold uppercase tracking-wide text-muted">
            Current Password
          </label>
          <input
            id="cp-current"
            type="password"
            [field]="changePasswordForm.currentPassword"
            class="w-full rounded-lg border border-white/10 bg-white/5 px-4 py-2.5 text-sm text-primary placeholder-white/20 transition focus:border-accent focus:outline-none focus:ring-1 focus:ring-accent"
            placeholder="Enter current password"
            autocomplete="current-password"
            autofocus
            aria-required="true"
            [attr.aria-invalid]="showValidation() && currentPasswordEmpty() ? 'true' : null"
            (input)="onEdit()"
          />
          @if (showValidation() && currentPasswordEmpty()) {
          <p id="cp-current-error" class="text-xs text-danger">Current password is required.</p>
          }
        </div>

        <div class="space-y-2">
          <label for="cp-new" class="text-xs font-semibold uppercase tracking-wide text-muted">
            New Password
          </label>
          <input
            id="cp-new"
            type="password"
            [field]="changePasswordForm.newPassword"
            class="w-full rounded-lg border border-white/10 bg-white/5 px-4 py-2.5 text-sm text-primary placeholder-white/20 transition focus:border-accent focus:outline-none focus:ring-1 focus:ring-accent"
            placeholder="Enter new password"
            autocomplete="new-password"
            aria-required="true"
            [attr.aria-invalid]="showValidation() && newPasswordEmpty() ? 'true' : null"
            (input)="onEdit()"
          />
          @if (showValidation() && newPasswordEmpty()) {
          <p id="cp-new-error" class="text-xs text-danger">New password is required.</p>
          }
        </div>

        @if (lastAction()) {
        <div
          class="rounded-lg border px-4 py-3 text-sm"
          [class.border-danger]="lastActionTone() === 'error'"
          [class.bg-danger/10]="lastActionTone() === 'error'"
          [class.text-danger]="lastActionTone() === 'error'"
          [class.border-success]="lastActionTone() === 'success'"
          [class.bg-success/10]="lastActionTone() === 'success'"
          [class.text-success]="lastActionTone() === 'success'"
          aria-live="polite"
        >
          {{ lastAction() }}
        </div>
        }

        <div class="flex gap-3">
          <a
            routerLink="/"
            class="flex-1 rounded-lg border border-white/10 bg-white/5 px-4 py-2.5 text-center text-sm font-semibold text-primary transition hover:bg-white/10"
          >
            Cancel
          </a>
          <button
            type="submit"
            class="flex-1 rounded-lg bg-accent px-4 py-2.5 text-sm font-semibold text-white shadow-lg shadow-accent/20 transition hover:bg-accent-hover disabled:opacity-50 disabled:shadow-none"
            [disabled]="busy()"
          >
            @if (busy()) {
            <span class="inline-flex items-center gap-2">
              <svg class="h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              Updating...
            </span>
            } @else {
            Update Password
            }
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<section class="mx-auto w-full max-w-lg space-y-6">
  <header class="space-y-2">
    <h1 class="text-2xl font-semibold">Change password</h1>
    <p class="text-sm text-text-muted">
      You will be signed out and need to sign in again.
    </p>
  </header>

  <form class="space-y-4" (submit)="$event.preventDefault(); submit()">
    <label class="space-y-1 text-text-muted">
      Current password
      <input
        type="password"
        [field]="changePasswordForm.currentPassword"
        class="w-full rounded-xl border border-white/15 bg-white/5 px-3 py-2 text-sm text-text"
        autocomplete="current-password"
        aria-required="true"
        [attr.aria-invalid]="showValidation() && currentPasswordEmpty() ? 'true' : null"
        (input)="onEdit()"
      />
    </label>

    <label class="space-y-1 text-text-muted">
      New password
      <input
        type="password"
        [field]="changePasswordForm.newPassword"
        class="w-full rounded-xl border border-white/15 bg-white/5 px-3 py-2 text-sm text-text"
        autocomplete="new-password"
        aria-required="true"
        [attr.aria-invalid]="showValidation() && newPasswordEmpty() ? 'true' : null"
        (input)="onEdit()"
      />
    </label>

    @if (lastAction()) {
    <p
      class="rounded-xl border px-4 py-3 text-sm"
      [class.border-danger]="lastActionTone() === 'error'"
      [class.text-danger]="lastActionTone() === 'error'"
      [class.border-white/10]="lastActionTone() !== 'error'"
      [class.text-text]="lastActionTone() !== 'error'"
      aria-live="polite"
    >
      {{ lastAction() }}
    </p>
    }

    <div class="flex items-center gap-3">
      <button
        type="submit"
        class="inline-flex items-center justify-center rounded-xl border border-accent bg-accent/10 px-4 py-2 text-sm font-semibold text-white transition hover:bg-accent/15 disabled:opacity-60"
        [disabled]="busy()"
      >
        Change password
      </button>

      <a
        class="text-sm font-semibold text-text-muted hover:text-text"
        [routerLink]="['/']"
      >
        Cancel
      </a>
    </div>
  </form>
</section>

<cq-dialog size="sm">
  <div cqDialogHeader class="flex w-full items-center justify-between">
    <h2 class="text-lg font-semibold text-primary">Rotate secret</h2>
    <button type="button" (click)="close()" class="text-muted hover:text-primary">
      <span class="sr-only">Close</span>
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M6 18L18 6M6 6l12 12"
        />
      </svg>
    </button>
  </div>

  <form id="rotateSecretForm" class="space-y-4" (submit)="onSubmit($event)">
    <p class="text-sm text-muted">
      Rotate the signing secret for <span class="font-mono text-primary">{{ data.hookKey }}</span
      >. Configure activation and grace windows to allow a safe rollout.
    </p>

    <cq-form-field
      label="Activate in (seconds)"
      forId="activateInSeconds"
      hint="Leave empty to activate immediately."
      [error]="submitAttempted() ? activateError() : null"
    >
      <input
        id="activateInSeconds"
        type="number"
        cqInput
        [formField]="$any(form.activateInSeconds)"
        placeholder="0"
      />
    </cq-form-field>

    <cq-form-field
      label="Grace period (seconds)"
      forId="gracePeriodSeconds"
      hint="Optional overlap window for the previous secret."
      [error]="submitAttempted() ? graceError() : null"
    >
      <input
        id="gracePeriodSeconds"
        type="number"
        cqInput
        [formField]="$any(form.gracePeriodSeconds)"
        placeholder="0"
      />
    </cq-form-field>

    <cq-form-field label="Notes" forId="rotationNotes" hint="Optional context for auditors.">
      <textarea
        id="rotationNotes"
        rows="3"
        cqTextarea
        [formField]="form.notes"
        placeholder="Why the rotation is needed"
      ></textarea>
    </cq-form-field>
  </form>

  <div cqDialogFooter class="flex items-center justify-end gap-3">
    <button
      type="button"
      (click)="close()"
      class="rounded-lg px-4 py-2 text-sm font-medium text-muted hover:bg-white/5 hover:text-primary"
    >
      Cancel
    </button>
    <button
      type="submit"
      form="rotateSecretForm"
      [disabled]="!!activateError() || !!graceError()"
      class="rounded-lg bg-accent px-4 py-2 text-sm font-semibold text-white transition hover:bg-accent-hover disabled:opacity-50"
    >
      Rotate
    </button>
  </div>
</cq-dialog>

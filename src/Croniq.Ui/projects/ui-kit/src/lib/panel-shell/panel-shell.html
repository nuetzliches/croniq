@if (panelTemplate()) {
<aside
  class="flex h-full flex-col shrink-0 border-r border-white/10 bg-surface/80 transition-all"
  [class.w-[320px]]="open()"
  [class.w-12]="!open()"
>
  <div class="flex items-start justify-between gap-2 border-b border-white/10 px-3 py-3">
    @if (open()) {
    <div class="min-w-0">
      <h2 class="truncate text-sm font-semibold text-primary">{{ title() }}</h2>
      @if (subtitle()) {
      <p class="text-xs text-muted">{{ subtitle() }}</p>
      }
    </div>
    }
    <button
      type="button"
      class="rounded-lg border border-white/10 bg-white/5 px-2 py-1 text-[11px] font-semibold text-primary transition hover:border-accent hover:text-accent"
      [attr.aria-label]="open() ? 'Collapse filters panel' : 'Expand filters panel'"
      (click)="handleToggle()"
    >
      <span aria-hidden="true">{{ open() ? '⟨' : '⟩' }}</span>
    </button>
  </div>

  @if (open()) {
  <div class="flex-1 overflow-y-auto p-4">
    <ng-container [ngTemplateOutlet]="panelTemplate()" />
  </div>
  }
</aside>
}

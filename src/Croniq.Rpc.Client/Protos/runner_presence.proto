syntax = "proto3";

package croniq.rpc;

option csharp_namespace = "Croniq.Rpc";

service RunnerPresence {
  rpc Stream (RunnerPresenceStreamRequest) returns (stream RunnerPresenceStreamEvent);
}

message RunnerPresenceStreamRequest {
  string tenant_id = 1;
  string environment_tag = 2;
  bool include_offline = 3;
}

message RunnerPresenceRunner {
  string runner_id = 1;
  string last_seen_at_utc = 2;
  string expires_at_utc = 3;
  bool is_online = 4;
  string metadata_json = 5;
}

message RunnerPresenceStreamEvent {
  string type = 1;
  int64 emitted_at_utc = 2;
  int64 latest_seen_at_utc = 3;
  int32 online_count = 4;
  int32 total_count = 5;
  repeated RunnerPresenceRunner snapshot = 6;
  repeated RunnerPresenceRunner updated = 7;
  repeated string removed_runner_ids = 8;
}

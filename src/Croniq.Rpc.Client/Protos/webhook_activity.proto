syntax = "proto3";

package croniq.rpc;

option csharp_namespace = "Croniq.Rpc";

service WebhookActivity {
  rpc Stream (WebhookActivityStreamRequest) returns (stream WebhookActivityStreamEvent);
}

message WebhookActivityStreamRequest {
  string tenant_id = 1;
  string environment_tag = 2;
  int64 from_utc = 3;
  int64 to_utc = 4;
  int64 updated_since_utc = 5;
  repeated string hook_keys = 6;
  repeated string job_keys = 7;
  int32 limit = 8;
}

message WebhookActivityStreamEvent {
  string type = 1;
  int64 emitted_at_utc = 2;
  int64 latest_occurred_at_utc = 3;
}

services:
  croniq:
    build: .
    ports:
      - "4000:4000"
      - "9900:9900"
    environment:
      - RUST_LOG=info
      - CRONIQ_ADMIN_USER=admin
      # CRONIQ_ADMIN_PASSWORD unset → random password generated & logged on first start
    volumes:
      - croniq-data:/var/lib/croniq
    restart: unless-stopped

volumes:
  croniq-data:

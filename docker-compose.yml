# Croniq quickstart — https://github.com/nuetzliches/croniq
#
# Usage:
#   docker compose up
#
# Open http://localhost:4000 in your browser.
# The two demo runners connect automatically and execute the pre-loaded jobs.
#
# Tunable env vars (set in shell or .env file):
#   CRONIQ_IMAGE      — image tag  (default: ghcr.io/nuetzliches/croniq:latest)
#   RUNNER_REPLICAS   — demo runner count (default: 2)
#   RUNNER_FAIL_RATE  — fraction 0.0–1.0 of jobs that fail (default: 0.05)
#
# The demo stack uses a fixed admin password (admin/admin) and a fixed API key
# so the runners can authenticate without manual setup. Do NOT reuse either
# outside the local demo.

services:
  server:
    image: ${CRONIQ_IMAGE:-croniq:local}
    build: .
    restart: unless-stopped
    ports:
      - "4000:4000"   # UI + API
      - "9900:9900"   # Prometheus metrics
    volumes:
      - croniq-data:/var/lib/croniq
      - ./Croniqfile.demo:/etc/croniq/Croniqfile:ro
    environment:
      RUST_LOG: info
      CRONIQ_DATA_DIR: /var/lib/croniq
      CRONIQ_ADMIN_USER: admin
      CRONIQ_ADMIN_PASSWORD: admin
      CRONIQ_DEMO_MODE: "1"
      # Pre-enable TOTP for the seeded admin so a marketing walkthrough
      # hits the MFA step. Login: admin / admin → recovery code `123456`
      # at the prompt (10 single-use slots per container reseed). Comment
      # out to land on the dashboard directly after admin/admin.
      CRONIQ_DEMO_MFA: "1"
      # Optional: seed a default admin API client on first run. Must start
      # with the `croniq_` prefix — the entrypoint fails fast if it doesn't.
      # In production: CRONIQ_INIT_API_KEY=croniq_$(openssl rand -hex 32)
      CRONIQ_INIT_API_KEY: croniq_demo_local_stack_key_not_for_production_use
      # Optional: ship scheduler traces + logs to an OTLP collector
      # (Aspire Dashboard, OTel-Collector, Grafana Tempo/Loki, …). The
      # official ghcr.io/nuetzliches/croniq image is built with the otlp
      # feature since v0.14.0; setting the endpoint below activates it
      # at runtime. See README.md#observability for the full env-var
      # matrix.
      # OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      # OTEL_SERVICE_NAME: croniq
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/4000"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  runner:
    image: ${CRONIQ_IMAGE:-croniq:local}
    build: .
    entrypoint: ["croniq-demo-runner"]
    restart: unless-stopped
    deploy:
      replicas: ${RUNNER_REPLICAS:-2}
    environment:
      CRONIQ_SERVER_URL: http://server:4000
      CRONIQ_API_KEY: croniq_demo_local_stack_key_not_for_production_use
      RUNNER_FAIL_RATE: ${RUNNER_FAIL_RATE:-0.05}
      RUNNER_MAX_INFLIGHT: "4"
      # Free-form tags so the Runners page filter chip bar shows real
      # data out of the box. Override with `RUNNER_TAGS=` to clear them.
      RUNNER_TAGS: ${RUNNER_TAGS:-env=demo,role=worker}
      RUST_LOG: info
    depends_on:
      server:
        condition: service_healthy

volumes:
  croniq-data:

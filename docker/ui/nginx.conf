# Dashboard container (Dockerfile target `ui-runtime`, issue #587).
#
# This server block serves files and nothing else. It does **not** proxy /v1:
# the reverse proxy in front routes / here and /v1 to croniq-server, and that
# is what makes the dashboard same-origin with the API. ADR-0001 requires it —
# the refresh token is a `SameSite=Strict; Path=/v1/auth` cookie that cannot
# reach a different origin, so a dashboard on its own origin falls back to
# keeping that token in localStorage, which is exactly the exposure #454
# removed. A `proxy_pass` in here would also put a second, undocumented route
# to the API inside a container whose job is HTML.
#
# The response headers below mirror what croniq-server sends when it serves the
# bundle itself (`croniq_server::ui_assets`, `croniq_server::api::hardening`),
# so the two delivery paths behave the same. `csp_matches_the_server_constant`
# in api/hardening.rs asserts the CSP has not drifted from the Rust constant;
# the caching rules have the same reasoning as ui_assets and are commented
# there.

server {
    # The unprivileged image runs as UID 101, so the port is above 1024 and no
    # capability has to be granted to bind it.
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # nginx would otherwise advertise its exact version on every response and
    # in every error page, which buys an attacker a version check for free.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;
    gzip_min_length 256;

    # Content-hashed build output: the name cannot change meaning, so a year is
    # safe and `immutable` also suppresses the revalidation a forced reload
    # would otherwise send.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Everything else — the document above all. A cached index.html names asset
    # files from an older build and renders blank after an upgrade, so it must
    # revalidate. `try_files … /index.html` is the SPA fallback: the dashboard
    # routes on the path, so a deep link is a document request for a path with
    # no file behind it.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri $uri/ /index.html;
    }

    # Kubernetes/compose liveness without reaching through to the API.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}

name: "Single assignment, handler succeeds, runner acks success"
description: |
  Baseline happy path. The first poll returns one assignment; subsequent polls
  are empty. The noop handler completes immediately. The runner must ack with
  status=success carrying the original execution_id and attempt.

  The assignment carries the optional scheduled_for field with a value that
  differs from fire_at (as in a replayed/late execution). The SDK must accept
  it without error — that the value reaches the handler context is asserted in
  each SDK's own unit tests, since this suite only observes the wire. Cases
  that omit scheduled_for (e.g. 03, 05) double as the mixed-version tolerance
  check: an older server never sends it and the context must surface
  null/None, never a fire_at fallback.

runner_config:
  capabilities: ["billing"]
  max_inflight: 1
  api_key: "croniq_testkey"
  poll_timeout_ms: 2000
  poll_retry_delay_ms: 200
  drain_timeout_ms: 2000

handlers:
  - job_key: "billing:invoice"
    behavior: noop

server_script:
  - on: "POST /v1/work/poll"
    match_count: 1
    respond:
      status: 200
      body:
        work:
          - execution_id: "exec-001"
            job_key: "billing:invoice"
            fire_at: "2026-05-23T10:00:00Z"
            scheduled_for: "2026-05-23T09:30:00Z"
            attempt: 1
            metadata: {}
            timeout: "1m"
        cancel: []
  - on: "POST /v1/work/poll"
    respond:
      status: 200
      body: { work: [], cancel: [] }
  - on: "POST /v1/work/ack"
    respond: { status: 200, body: {} }

expectations:
  duration_max_ms: 3000
  http:
    - method: POST
      path: /v1/work/poll
      min_count: 1
      headers:
        authorization: "ApiKey croniq_testkey"
    - method: POST
      path: /v1/work/ack
      exact_count: 1
      body_match:
        runner_id: "*"
        execution_id: "exec-001"
        status: "success"
        attempt: 1

name: "Trigger timeout — explicit value sent verbatim"
description: |
  When the caller supplies a timeout it is sent verbatim as a duration string
  under the `timeout` key. The complementary half — a client must OMIT timeout
  when the caller gives none, never fabricate a default — is pinned by
  01-trigger-minimal via body_absent.

  Omission is load-bearing, not cosmetic: the server reads an absent `timeout`
  as "inherit the job's configured one" and only falls back to 5m when the job
  declares none either (issue #551). A client that fabricated "5m" would cap
  every manual fire of a `timeout 2h` job at five minutes.

trigger_config:
  api_key: "croniq_trigger_key"

trigger_calls:
  - request:
      job_key: "cache:warm"
      timeout: "30s"
    expect:
      response:
        execution_id: "exec-500"
        queued: 1
        deduplicated: false

server_script:
  - on: "POST /v1/trigger"
    respond:
      status: 200
      body:
        execution_id: "exec-500"
        queued: 1

expectations:
  duration_max_ms: 2000
  http:
    - method: POST
      path: /v1/trigger
      exact_count: 1
      body_match:
        job_key: "cache:warm"
        timeout: "30s"
      body_absent:
        - metadata
        - require
        - prefer
        - idempotency_key

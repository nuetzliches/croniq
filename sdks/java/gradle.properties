# Default version used by local builds. The release workflow overrides this
# with -Pversion=X.Y.Z derived from the git tag, so this value is only ever
# observed when developers run `gradle build` outside CI.
version=0.0.0-SNAPSHOT

# Vanniktech maven-publish plugin reads these property names from the env
# (ORG_GRADLE_PROJECT_* convention). Declared empty here so a local
# `gradle publishToMavenLocal` does not fail with "missing property" — the
# plugin only signs and uploads when the values are non-empty.
mavenCentralUsername=
mavenCentralPassword=
signingInMemoryKey=
signingInMemoryKeyPassword=

# Performance — keep the daemon warm between Gradle invocations and run
# tests/compilation in parallel where modules allow it.
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Reproducible builds — every contributor and CI agent compiles bit-for-bit.
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache disabled: Spotless 6.x has an open bug where the
# JVM-local cache it relies on goes stale across runs when the config
# cache is enabled. Symptom: "Spotless JVM-local cache is stale" with no
# action that fixes it short of `rm -rf .gradle`. See
# https://github.com/diffplug/spotless/issues/987 — re-enable once that
# resolves.
org.gradle.configuration-cache=false

# JVM args for the Gradle daemon. Kept conservative; CI runners are
# typically 4-8 GB and we never want a Gradle OOM on a 14-module multi-build
# to look like an SDK bug.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# Kotlin DSL build files compile faster with the K2 frontend.
kotlin.code.style=official

# SDK version — overridden by CI when publishing a tagged release via
# `-Pversion=X.Y.Z` from the tag name. Matches the .NET SDK's MinVer-derived
# 0.1.x scheme; bump in lockstep. The 0.0.x line is reserved for pipeline
# smoke tests (no real implementation yet) so consumers know to wait for
# 0.1.0 before depending on the public API.
version=0.0.1-SNAPSHOT

# Group ID is the Sonatype-verified Maven Central namespace owned by the
# repo author (io.github.nuetzliches). If/when `io.croniq` gets verified
# separately, switch group + the Java packages in lockstep — artifact IDs
# (croniq-runner-*) stay stable across that move.
group=io.github.nuetzliches

# Vanniktech maven-publish plugin reads these property names from the env
# (ORG_GRADLE_PROJECT_* convention). Declared empty here so a local
# `gradle publishToMavenLocal` does not fail with "missing property" — the
# plugin only signs and uploads when the values are non-empty.
mavenCentralUsername=
mavenCentralPassword=
signingInMemoryKey=
signingInMemoryKeyPassword=

# Link checker settings for Croniq docs
accept = ["200..399"]
max_redirects = 5
retry_wait_time = 2
retry_count = 2
user_agent = "CroniqDocsLinkChecker/1.0 (+https://github.com/nuetzliches/croniq)"

exclude = [
  "^http://localhost",
  "^https://localhost",
  "^http://127\\.0\\.0\\.1",
  "^https://127\\.0\\.0\\.1"
]

# Restrict checks to the docs tree by default
include_path = [
  "docs"
]
